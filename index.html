  return h+'</div>';
}

/* v8: 부재·예약·완료·개통완료 4칸 세그먼트 (팝업 없이 1탭 전환, 같은 칸을 한 번 더 누르면 미통화) */
function segHTML(c){
  var h = '<div class="seg" role="group" aria-label="통화 상태 선택" data-st="'+esc(c.status||'미통화')+'">';
  ST_BTNS.forEach(function(s){
    var on = c.status===s;
    h += '<button type="button" class="seg-b'+(on?' on':'')+'" data-st="'+esc(s)+'"'
       + ' data-act="status" data-id="'+c.id+'" aria-pressed="'+(on?'true':'false')+'" title="'+esc(s)+' (한 번 더 누르면 미통화)'+'"'
       + '>'+esc(stLabel(s))+'</button>';
  });
  return h+'</div>';
}

function todoBar(){
  var openConsult = state.posts.filter(function(p){ return p.kind==='consult' && !p.done; }).length;
  var t = todayStr();
  var left = custsOfDay(t).filter(function(c){ return !isDoneSt(c.status); }).length;
  var noCall = custsOfDay(t).filter(function(c){ return c.status==='미통화'; }).length;
  var keeps = keepList().length;
  return '<section class="todobar">'
    + '<button class="todo" data-act="filter" data-f="consult">'
    +   '<span>미처리 상담놓침</span><b>'+openConsult+'</b></button>'
    + '<button class="todo" data-act="tab" data-tab="band">'
    +   '<span>오늘 남은 콜</span><b>'+left+'</b><em>미통화 '+noCall+'</em></button>'
    + '<button class="todo keep" data-act="keep-open">'
    +   '<span>📵 부재중 킵</span><em>부재·킵 고객 모아 바로 통화</em><b>'+keeps+'</b></button>'
    + '</section>';
}

function noticeView(){
  var pinned = state.posts.filter(function(p){ return p.pinned; }).sort(byAtDesc);
  /* v5: 구분 필터(사전예약·상담놓침·매장 공지)를 고르면 고정 공지도 그 목록에 함께 보여줍니다 */
  var feed = state.posts.filter(function(p){
    if(!postMatch(p)) return false;
    if(p.pinned && ui.filter==='all') return false;
    return true;
  }).sort(byAtDesc);
  /* v7: '모두 접기' 대상은 피드 글의 댓글만 — 고정 공지는 자기 '접기' 버튼으로만 접힌다 */
  var openN = state.posts.filter(function(p){ return !!ui.openThreads[p.id]; }).length;
  var anyOpen = openN>0;
  var h = todoBar();
  if(pinned.length){
    h += '<section class="noticecard '+(ui.pinOpen?'':'closed')+'">'
       + '<div class="nc-head"><b><span class="pindot">📌</span>고정 공지<span class="nc-n">'+pinned.length+'</span></b>'
       + '<button class="nc-toggle" data-act="pin-toggle" aria-expanded="'+(ui.pinOpen?'true':'false')+'">'
       +   (ui.pinOpen? '접기 <span class="chev">▴</span>' : '펼치기 <span class="chev">▾</span>')+'</button></div>'
       + pinned.map(pinItem).join('')
       + '</section>';
  }
  h += '<div class="feedbar">'
     +   '<button class="collapsebtn'+(anyOpen?' on':'')+'" data-act="'+(anyOpen?'collapse-all':'expand-all')+'" aria-label="'+(anyOpen?'모두 접기':'모두 펼치기')+'">'
     +     (anyOpen? '모두 접기 <span class="chev">▴</span>' : '모두 펼치기 <span class="chev">▾</span>')
     +   '</button>'
     +   '<div class="filterbar">'+kindChips()+'</div>'
     + '</div>';
  h += '<div class="feed">' + (feed.length? feed.map(function(p){ return postCard(p); }).join('')
       : '<div class="emptycard">아직 글이 없어요.<br>오른쪽 아래 <b>＋</b> 버튼으로 첫 글을 남겨보세요.</div>') + '</div>';
  return h;
}

function pinItem(p){
  var kk = kindOf(p);
  var right = '';
  if(p.reserve){
    var rs = p.reservations||[]; var dn = rs.filter(function(r){return r.done;}).length;
    if(rs.length) right = dn+'/'+rs.length+' 개통';
  } else if(p.kind==='consult'){
    right = p.done? '처리완료' : '진행 중';
  }
  var title = String(p.title || p.body || '').replace(/^상담놓침\s*[:：]\s*/,'').split('\n')[0];
  return '<button class="pin-item k-'+kk+'" data-act="open-post" data-id="'+p.id+'">'
    + '<span class="pi-kind kb-'+kk+'">'+KIND_META[kk].short+'</span>'
    + '<span class="pi-title">'+esc(title)+'</span>'
    + (right? '<span class="pi-right">'+right+'</span>' : '')
    + '</button>';
}

/* v6: 홈 피드 카드 — 기본은 제목·본문·'댓글 N개 보기'만, 누를 때만 댓글이 열립니다 */
function postCard(p, opts){
  opts = opts||{};
  var cs = p.comments||[];
  var open = !!opts.sheet || !!ui.openThreads[p.id];
  var kk = kindOf(p);
  var h = '<article class="post k-'+kk+(p.done?' isdone':'')+(open?' thread-open':'')+'" data-pid="'+p.id+'">';
  h += '<div class="post-head">'
     +   '<span class="av" style="--c:'+colorOf(p.author)+'">'+esc(initial(p.author))+'</span>'
     +   '<div class="who"><div class="wname">'+esc(p.author)+'</div>'
     +     '<div class="wmeta">'+fmtAt(p.at)+'</div></div>'
     +   '<span class="kbadge kb-'+kk+'">'+KIND_META[kk].label+'</span>'
     +   '<button class="morebtn" data-act="post-menu" data-id="'+p.id+'" aria-label="글 관리">⋯</button>'
     + '</div>';
  if(p.title) h += '<h3 class="post-title">'+esc(p.title)+'</h3>';
  if(p.body) h += '<p class="post-body">'+esc(p.body)+'</p>';
  h += photoGrid(p.photos);
  if(p.reserve) h += reserveBlock(p);
  h += '<div class="post-actions">'
     +   (opts.sheet
            ? '<span class="act cmt-act static">💬 댓글 <b class="cnt">'+cs.length+'</b></span>'
            : '<button class="act cmt-act'+(open?' on':'')+'" data-act="thread-toggle" data-id="'+p.id+'" aria-expanded="'+(open?'true':'false')+'">'
              +     (open? '💬 댓글 접기 <span class="chev">▴</span>'
                     : (cs.length? '💬 댓글 <b class="cnt">'+cs.length+'</b>개 보기 <span class="chev">▾</span>'
                                 : '💬 첫 댓글 남기기'))
              +   '</button>')
     +   (p.kind==='consult' && !p.reserve? '<button class="act done-act '+(p.done?'on':'')+'" data-act="post-done" data-id="'+p.id+'">'+(p.done?'처리완료 취소':'처리완료')+'</button>':'')
     + '</div>';
  h += threadHTML(p, 'post', open);
  h += '</article>';
  return h;
}

function photoGrid(ps, size){
  if(!ps || !ps.length) return '';
  var cls = ps.length===1?'one':(ps.length===2?'two':'');
  var out = '<div class="pgrid '+(size||'')+' '+cls+'">';
  for(var i=0;i<ps.length;i++){
    out += '<button class="pcell" data-act="photo" aria-label="사진 크게 보기"><img src="'+esc(ps[i].src)+'" alt="'+esc(ps[i].name||'첨부 사진')+'" loading="lazy"></button>';
  }
  return out+'</div>';
}

function reserveBlock(p){
  var rs = p.reservations||[];
  var done = rs.filter(function(r){return r.done;}).length;

  } else {

    rs.forEach(function(r){
      h += '<div class="ritem">';
      h += '<div class="rrow '+(r.done?'done':'')+'">'
         + '<span class="rn">'+esc(r.name)+'<span class="rm-in">'+esc(r.model||'')+'</span></span>'
         + '<span class="rp"><a href="tel:'+digits(r.phone)+'">'+esc(ui.mask?maskPhone(r.phone):r.phone)+'</a></span>'
         + '<span class="rm">'+esc(r.model||'-')+'</span>'
         + '<span class="ro">'+esc(r.owner||'-')+'</span>'
         + '<span class="rc"><label class="chk" title="개통완료"><input type="checkbox" data-act="resv-done" data-pid="'+p.id+'" data-rid="'+r.id+'" '+(r.done?'checked':'')+'><i></i></label></span>'
         + '<span class="rx"><button class="del" data-act="resv-del" data-pid="'+p.id+'" data-rid="'+r.id+'" title="예약 삭제">✕</button></span>'
         + '</div>';
      if(r.link){
        h += '<div class="lk-row">🔗 '+(r.done?'장부 자동개통완료':'장부 개통')
           + ' ('+esc(ledgerMd(r.link.date))+(r.link.owner? ' · '+esc(r.link.owner):'')+')</div>';
      }
      if(ui.resvMemo===r.id){
        h += '<div class="rmemo-edit"><input id="rmemo_'+r.id+'" data-resvmemo="'+r.id+'" data-pid="'+p.id+'"'
           + ' value="'+esc(r.memo||'')+'" placeholder="메모 한 줄 (예) 오전 10시 재통화" enterkeyhint="done" autocomplete="off">'
           + '<button class="mini-ok" data-act="resv-memo-save" data-pid="'+p.id+'" data-rid="'+r.id+'">저장</button>'
           + '<button class="mini-x" data-act="resv-memo-cancel" aria-label="취소">✕</button></div>';
      } else {
        h += '<button class="rmemo '+(r.memo?'':'quiet')+'" data-act="resv-memo" data-pid="'+p.id+'" data-rid="'+r.id+'"'
           + ' aria-label="'+esc((r.name||'예약자')+' 메모 수정')+'">'
           + '<span class="rmi">📝</span><span class="rmt">'+esc(r.memo||'메모 한 줄 추가')+'</span></button>';

  h += '</div><div class="resv-foot"><button class="btn ghost sm" data-act="resv-add" data-id="'+p.id+'">＋ 예약자 추가</button></div></div>';

/* v5: 글 댓글(1단계)은 고객 상태 선택 가능 · 대댓글은 상태 없이 진행 내용만 */
function cmtModeOf(item, ctx){
  if(ctx==='cust') return 'req';
  return 'opt';
}
function fmtReady(key, mode){
  var text = String(ui.drafts[key]||'').trim();
  var st = ui.cmtStatus[key]||'';
  if(mode==='req') return !!(text && st);
  if(mode==='opt') return !!(text || st);
  return !!text;
}
function statusPickHTML(key, mode){
  var sel = ui.cmtStatus[key]||'';
  var tip = mode==='req'? '상태를 골라야 등록돼요' : '통화 결과를 함께 남겨보세요';
  var h = '<div class="stpick"><div class="stpick-top">'
        + '<span class="stpick-lbl">통화 상태'+(mode==='req'?'<em>필수</em>':'<em class="opt">선택</em>')+'</span>'
        + '<span class="stpick-tip"'+(sel?' data-st="'+esc(sel)+'"':'')+' data-tip="'+esc(tip)+'">'+(sel? esc(stLabel(sel))+' 선택됨' : tip)+'</span>'
        + '</div><div class="stpick-chips">';
  ST_BTNS.forEach(function(s){
    h += '<button type="button" class="st-chip sm '+(sel===s?'on':'')+'" data-st="'+s+'" data-act="cmt-st" data-key="'+key+'" data-st-for="'+s+'">'+esc(stLabel(s))+'</button>';
  });

function threadHTML(item, ctx, open){
  if(!open) return '';
  var cs = item.comments||[];
  var key = ctx+':'+item.id;
  var att = ui.attach[key]||[];
  var mode = cmtModeOf(item, ctx);
  var h = '<div class="thread open">';
  if(!cs.length) h += '<div class="cmts"><div class="empty">아직 댓글이 없어요. 첫 댓글을 남겨보세요.</div></div>';

    var fold = cs.length>=CMT_FOLD_AT && !ui.openCmts[item.id];

    cs.forEach(function(c, ci){ if(fold && ci>=2) return; h += cmtHTML(c, item.id, ctx, mode); });
    h += '</ul>';
    if(cs.length>=CMT_FOLD_AT){
      h += '<button class="rep-toggle cmt-more" data-act="cmts-toggle" data-key="'+item.id+'" aria-expanded="'+(fold?'false':'true')+'">'

             : '댓글 접기 <span class="chev">▴</span>')
         + '</button>';
    }
  }
  if(att.length){
    h += '<div class="attach">';

     + '<input name="text" data-draft="'+key+'" value="'+esc(ui.drafts[key]||'')+'" placeholder="'+ph+'" autocomplete="off">'
     + '<label class="icobtn" title="사진 첨부">📷<input type="file" accept="image/*" data-photo="cmt" data-key="'+key+'" hidden></label>'
     + '<button class="send" type="submit"'+(fmtReady(key,mode)?'':' disabled')+'>등록</button>'
     + '</div></form>';

function cmtHTML(c, parentId, ctx, mode){
  var reps = c.replies||[];
  var isPost = ctx==='post' && !c.sys;   /* v5: 글의 1단계 댓글만 상태 관리 */
  var rOpen = ui.replyOpen===c.id;
  var rExp = !!ui.openReplies[c.id];
  var h = '<li class="cmt '+(c.sys?'sys':'')+(isPost && isDoneSt(c.st)?' cmt-done':'')+'">'
        + '<div class="cmt-head"><span class="av xs" style="--c:'+colorOf(c.author)+'">'+esc(initial(c.author))+'</span>'
        + '<b>'+esc(c.author)+'</b><time>'+fmtAt(c.at)+'</time>'
        + (!isPost && c.st? '<span class="cst" data-st="'+esc(c.st)+'">'+esc(stLabel(c.st))+'</span>' : '')
        + (c.sys?'':'<button class="replybtn" data-act="reply-open" data-cid="'+c.id+'">답글</button>')+'</div>';
  if(c.text) h += '<p>'+esc(c.text)+'</p>';
  h += photoGrid(c.photos, 'sm');
  if(isPost) h += csegHTML(c, parentId);
  if(reps.length){
    h += '<button class="rep-toggle" data-act="rep-toggle" data-cid="'+c.id+'" aria-expanded="'+(rExp?'true':'false')+'">'
       + (rExp? '답글 접기 <span class="chev">▴</span>' : '답글 '+reps.length+'개 보기 <span class="chev">▾</span>')
       + '</button>';
    if(rExp){
      h += '<ul class="replies">';
      reps.forEach(function(r){
        h += '<li><span class="rav">↳</span><b>'+esc(r.author)+'</b>'
           + (r.st? '<i class="rst" data-st="'+esc(r.st)+'">'+esc(stLabel(r.st))+'</i>' : '')
           + '<span>'+esc(r.text)+'</span><time>'+fmtAt(r.at)+'</time>'
           + photoGrid(r.photos,'sm')+'</li>';
      });
      h += '</ul>';
    }
  }
  if(rOpen){
    var rk = 'rp:'+c.id;
    /* v5: 대댓글은 직원 진행 보고 — 상태 칩 없이 내용만 */
    h += '<form class="cbar reply" data-form="reply" data-id="'+parentId+'" data-cid="'+c.id+'" data-ctx="'+ctx+'" data-key="'+rk+'" data-mode="">'

       + '</div></form>';

/* ---------- band view ---------- */
function custMatch(c){
  if(ui.year!=='all' && String(c.day).slice(0,4)!==ui.year) return false;
  if(ui.month!=='all' && String(c.day).slice(5,7)!==ui.month) return false;
  if(ui.filter.indexOf('b:')===0){ if(c.bucket!==ui.filter.slice(2)) return false; }
  else if(ui.filter.indexOf('s:')===0){ if(c.status!==ui.filter.slice(2)) return false; }
  if(ui.q){
    var q = ui.q.replace(/[\s-]+/g,'').toLowerCase();
    var hay = (c.name+' '+digits(c.phone)+' '+(c.memo||'')+' '+custTextOf(c)).toLowerCase();
    /* v7: 이름·번호·메모·통화 기록·답글까지 검색 (띄어쓰기·하이픈은 무시하고 한 번 더 비교) */
    if(hay.indexOf(q)<0 && hay.replace(/[\s-]+/g,'').indexOf(q)<0) return false;
  }
  return true;
}
/* 고객의 통화 기록(댓글·답글) 글자를 한 줄로 */
function custTextOf(c){
  var out = [];
  (c.comments||[]).forEach(function(x){
    if(x.text) out.push(x.text);
    (x.replies||[]).forEach(function(r){ if(r.text) out.push(r.text); });
  });
  return out.join(' ');
}
/* v8: 날짜 카드가 많아서(최근 3개월 85일 + 과거 713일) 한 번에 다 그리지 않는다.
   기본은 최근 6일만, '이전 날짜 더 보기'로 늘리고, 기간(연/월)을 골랐거나 검색 중이면 결과를 넉넉히(40일) 보여준다. */
function dayLimit(){
  /* 기간·검색은 40일까지 한 번에, 기본은 최근 6일 — '이전 날짜 더 보기'로 늘어난 만큼은 어디서든 지킨다 */
  var base = (periodActive() || ui.q) ? 40 : 6;
  return Math.max(base, ui.dayShown || 6);
}
function listDays(idx){
  if(!periodActive()) return idx.days;
  return idx.days.filter(function(d){
    if(ui.year!=='all' && d.slice(0,4)!==ui.year) return false;
    if(ui.month!=='all' && d.slice(5,7)!==ui.month) return false;
    return true;
  });
}
function dayHasMatch(day){
  var list = custsOfDay(day);
  for(var i=0;i<list.length;i++){ if(custMatch(list[i])) return true; }
  return false;
}
function custListHTML(){
  var days = listDays(custIndex());
  var limit = dayLimit();
  var hits = [], i;
  for(i=0;i<days.length;i++){ if(dayHasMatch(days[i])) hits.push(days[i]); }
  var cards = hits.slice(0, limit).map(dayCard).filter(Boolean).join('');
  if(!cards){
    if(!arch.ready && (ui.year!=='all' || ui.q)){
      return '<div class="emptycard">과거 명단을 불러오는 중이에요…<br>잠시 뒤 다시 보여드릴게요.</div>';
    }
    return '<div class="emptycard">조건에 맞는 명단이 없어요.<br>오른쪽 아래 <b>＋</b> 버튼으로 고객을 추가해보세요.</div>';
  }
  if(hits.length > limit){
    cards += '<button class="morebar" data-act="more-days">이전 날짜 더 보기 <b>'+(hits.length-limit)+'</b>일 <span class="chev">▾</span></button>';
  }
  return cards;
}
function periodActive(){ return ui.year!=='all' || ui.month!=='all'; }
function periodCustomers(){
  if(!periodActive()) return custsOfDay(todayStr());
  var all = custIndex().all;
  return all.filter(function(c){
    if(ui.year!=='all' && String(c.day).slice(0,4)!==ui.year) return false;

var SORT_RANK = {'미통화':0,'부재':1,'예약':2,'완료':3,'개통완료':4};
var BUCKET_RANK = {'730':0,'550':1,'3년':2};
function sortCust(a,b){
  var ba = BUCKET_RANK[a.bucket], bb = BUCKET_RANK[b.bucket];
  var br = (ba==null?9:ba)-(bb==null?9:bb);
  if(br) return br;
  var r = (SORT_RANK[a.status]||0)-(SORT_RANK[b.status]||0);
  if(r) return r;
  return String(a.name).localeCompare(String(b.name));
}
function lastAtOf(c){
  var at = c.at||'';
  (c.comments||[]).forEach(function(x){ if(String(x.at||'')>at) at = String(x.at); });
  return at;
}
function keepList(){
  return state.customers.filter(function(c){ return c.status==='부재' || c.keep; }).sort(function(a,b){
    if(a.day!==b.day) return String(b.day).localeCompare(String(a.day));
    var la = lastAtOf(a), lb = lastAtOf(b);
    if(la!==lb) return lb.localeCompare(la);
    return String(a.name).localeCompare(String(b.name));
  });
}
function lastMemoOf(c){
  var m = String(c.memo||'').trim();
  if(m) return m;
  var cs = c.comments||[];
  for(var i=cs.length-1;i>=0;i--){ if(cs[i].text && !cs[i].sys) return cs[i].text; }
  return '';
}

/* ================= photos ================= */
function compressImage(file, maxSide, targetKB){
  maxSide = maxSide || 1200;
  targetKB = targetKB || 150;
  return new Promise(function(resolve, reject){
    if(!file || !/^image\//.test(file.type)){ reject(new Error('이미지 파일이 아니에요')); return; }
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      try{
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxSide/Math.max(w,h));
        w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        var q = 0.74, data = cv.toDataURL('image/jpeg', q);
        while(data.length > targetKB*1400 && q > 0.34){
          q -= 0.08;
          data = cv.toDataURL('image/jpeg', q);
        }
        URL.revokeObjectURL(url);
        resolve({src:data, name:file.name||'사진'});
      }catch(err){ URL.revokeObjectURL(url); reject(err); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('사진을 읽지 못했어요')); };
    img.src = url;
  });
}
function handleFiles(input){
  var files = [];
  try{ files = Array.prototype.slice.call(input.files||[]); }catch(e){}
  if(!files.length) return;
  toast('사진 처리 중…');
  var jobs = files.slice(0,10).map(function(f){ return compressImage(f).catch(function(){ return null; }); });
  Promise.all(jobs).then(function(list){
    var out = list.filter(Boolean);
    if(!out.length){ toast('사진을 읽지 못했어요. 다른 사진으로 시도해 주세요.', true); return; }
    if(input.getAttribute('data-photo')==='composer'){
      ui.composer.photos = (ui.composer.photos||[]).concat(out);
    } else {
      var key = input.getAttribute('data-key');
      ui.attach[key] = (ui.attach[key]||[]).concat(out);
    }
    input.value = '';
    render();
    toast(out.length+'장 첨부했어요');
  });
}

function applyCustStatus(c, st){
  if(!c || !st || c.status===st) return false;
  var prev = c.status || '미통화';
  c.status = st;
  if(c.link) c.linkOff = (st !== '개통완료');
  c.comments = c.comments || [];
  c.comments.push(sysCmt('통화상태 '+stLabel(prev)+' → '+stLabel(st)));
  /* v8(#16959): 상태가 바뀌면 알림 훅 — 전용 APK가 있으면 시스템 알림으로 띄운다 */
  notifyBridge('통화 상태 · '+stLabel(st), (c.name||'고객')+' · '+stLabel(prev)+' → '+stLabel(st));
  return true;
}
function keepStatus(id, st){
  var c = ensureCust(id);
  if(!c) return;
  if(st==='미통화'){
    if(c.status==='부재') applyCustStatus(c, '미통화');
    c.keep = false;
    save(); render();
    toast('부재중 킵에서 뺐어요');
    return;
  }
  applyCustStatus(c, st);
  c.keep = false;
  save(); render();
  toast(c.name+' · '+stLabel(st)+' 표시했어요');
}
function keepTry(id){
  var c = ensureCust(id);
  if(!c) return;
  var prev = c.status;
  c.tries = (c.tries||0)+1;
  c.comments = c.comments||[];
  if(prev!=='부재'){
    c.status = '부재';
    if(c.link) c.linkOff = true;
    c.comments.push(sysCmt('통화상태 '+stLabel(prev)+' → 부재'));
  }
  c.comments.push(sysCmt('부재 통화 '+c.tries+'회차 — 재통화 필요'));
  save(); render();
  toast(c.name+' · 부재 '+c.tries+'회 기록');

  switch(act){
    case 'tab': setTab(el.getAttribute('data-tab')); break;
    case 'compose': compose(); break;
    case 'menu': openSheet({type:'menu'}); break;
    case 'admin': openSheet({type:'admin'}); break;
    case 'admin-off': setAdmin(false); closeSheet(); break;
    case 'close': closeSheet(); break;
    case 'staff-switch':
      closeSheet(); setAdmin(false, true); session=null; saveSession(null);
      $('app').hidden = true; $('login').hidden = false;
      clearPin(); renderLogin();
      break;
    case 'logout': logout(); break;
    case 'export': exportData(); break;
    case 'reset': resetData(); break;
    case 'pin-toggle': ui.pinOpen = !ui.pinOpen; render(); break;
    case 'collapse-all':
      collapseAll(); render();
      toast('모든 글의 댓글을 접었어요');
      break;
    case 'expand-all':
      expandAll(); render();
      toast('댓글이 있는 글을 모두 펼쳤어요');
      break;
    case 'filter':
      var f = el.getAttribute('data-f');
      if(f==='all' && ui.tab==='notice'){
        /* v6: '전체'를 누르면 글들의 댓글을 한 번에 접기 (고정 공지는 그대로) */
        ui.filter = 'all';
        ui.dayShown = 6;
        collapseAll(); render();
        toast('피드 댓글을 모두 접었어요');
        break;
      }
      ui.filter = (ui.filter===f && f!=='all')? 'all' : f;
      ui.dayShown = 6;
      render(); break;
    case 'ledger-sync': ledgerSync(true); break;
    case 'mask': ui.mask = !ui.mask; render(); toast(ui.mask?'번호를 가렸어요':'번호를 표시해요'); break;
    case 'more-days':
      ui.dayShown = dayLimit() + 10;
      render();
      break;
    case 'arch-load':
      closeSheet();
      toast('과거 명단을 새로 받아옵니다…');
      archFetch().then(function(n){ toast('과거 명단 '+archNum(n)+'건을 불러왔어요'); },
                       function(e){ arch.err = (e && e.message) || '불러오기 실패'; archRefreshUI();
                                    toast('과거 명단을 불러오지 못했어요 — '+arch.err, true); });
      break;
    case 'period-clear':
      ui.year = 'all'; ui.month = 'all'; render();
      toast('기간을 초기화했어요'); break;
    case 'thread-toggle':
      var tid = el.getAttribute('data-id');
      if(ui.openThreads[tid]) delete ui.openThreads[tid]; else ui.openThreads[tid]=true;
      render(); break;
    case 'cmts-toggle':
      var cmk = el.getAttribute('data-key');
      if(ui.openCmts[cmk]) delete ui.openCmts[cmk]; else ui.openCmts[cmk] = true;
      render();
      break;
    case 'open-post': openSheet({type:'post', id: el.getAttribute('data-id')}); break;
    case 'post-menu': openSheet({type:'postmenu', id: el.getAttribute('data-id')}); break;
    case 'post-done':
      var pd = findPost(el.getAttribute('data-id'));
      if(pd){
        pd.done = !pd.done; save();
        if(sheetSpec && sheetSpec.type==='postmenu') closeSheet();
        render();
        toast(pd.done?'처리완료로 표시했어요':'처리완료를 취소했어요');
      }
      break;
    case 'post-pin':
      var pp = findPost(el.getAttribute('data-id'));
      if(pp){
        pp.pinned = !pp.pinned; save();
        if(sheetSpec && sheetSpec.type==='postmenu') closeSheet();
        render();
        toast(pp.pinned?'맨 위 공지로 고정했어요':'고정을 해제했어요');
      }
      break;
    case 'photo':
      var img = el.querySelector('img') || el;
      openLB(img.getAttribute('src'));
      break;
    case 'close-lb': closeLB(); break;
    case 'reply-open':
      var roc = el.getAttribute('data-cid');
      ui.replyOpen = roc;
      ui.openReplies[roc] = true;
      render();
      setTimeout(function(){
        var f2 = document.querySelector('form[data-form="reply"] input');
        if(f2) try{ f2.focus({preventScroll:true}); }catch(e){}
      }, 60);
      break;
    case 'rep-toggle':
      var rtc = el.getAttribute('data-cid');
      if(ui.openReplies[rtc]) delete ui.openReplies[rtc]; else ui.openReplies[rtc] = true;
      render(); break;
    case 'reply-close': ui.replyOpen = null; render(); break;
    case 'cust': openSheet({type:'cust', id: el.getAttribute('data-id')}); break;
    case 'keep-open': openSheet({type:'keep'}); break;
    case 'keep-toggle':
      var kc = findCust(el.getAttribute('data-id'));
      if(kc){
        kc.keep = !kc.keep; save(); render();
        toast(kc.keep? kc.name+'님을 부재중 킵에 꽂았어요' : '킵을 해제했어요');
      }
      break;
    case 'keep-status': keepStatus(el.getAttribute('data-id'), el.getAttribute('data-st')); break;
    case 'keep-try': keepTry(el.getAttribute('data-id')); break;
    case 'keep-memo':
      ui.keepMemo = el.getAttribute('data-id'); render();
      setTimeout(function(){
        var km = $('kmemo_'+ui.keepMemo);
        if(km) try{ km.focus({preventScroll:true}); km.setSelectionRange(km.value.length, km.value.length); }catch(e){}
      }, 60);
      break;
    case 'keep-memo-cancel': ui.keepMemo = null; render(); break;
    case 'keep-memo-save': saveKeepMemo(el.getAttribute('data-id')); break;
    case 'cmt-st':
      var sk = el.getAttribute('data-key'), sv = el.getAttribute('data-st-for');
      if(ui.cmtStatus[sk]===sv) delete ui.cmtStatus[sk]; else ui.cmtStatus[sk] = sv;
      var curSt = ui.cmtStatus[sk]||'';
      var sf = el.closest('form');
      if(sf){
        var schips = sf.querySelectorAll('.st-chip.sm');
        for(var si=0; si<schips.length; si++) schips[si].classList.toggle('on', schips[si].getAttribute('data-st-for')===curSt);
        var stip = sf.querySelector('.stpick-tip');
        if(stip){
          if(curSt){ stip.textContent = curSt+' 선택됨'; stip.setAttribute('data-st', curSt); }
          else { stip.textContent = stip.getAttribute('data-tip')||''; stip.removeAttribute('data-st'); }
        }
        syncFormBtn(sf);
      }
      break;
    case 'status-menu': openSheet({type:'status', id: el.getAttribute('data-id')}); break;
    case 'status':
      var sEl = el, sId = el.getAttribute('data-id'), sSt = el.getAttribute('data-st');
      if(sEl.classList.contains('seg-b') && sEl.closest('.cust')) inlineStatus(sId, sSt, sEl);
      else changeStatus(sId, sSt);
      break;
    case 'status-pick':
      changeStatus(el.getAttribute('data-id'), el.getAttribute('data-st'));
      closeSheet();
      break;
    case 'memo-edit':
      ui.memoEdit = el.getAttribute('data-id'); render();
      setTimeout(function(){
        var m = $('memo_'+ui.memoEdit);
        if(m) try{ m.focus({preventScroll:true}); m.setSelectionRange(m.value.length, m.value.length); }catch(e){}
      }, 60);
      break;
    case 'memo-save': saveMemo(el.getAttribute('data-id')); break;
    case 'memo-cancel': ui.memoEdit = null; render(); break;
    case 'add-cust': openSheet({type:'custadd', day: el.getAttribute('data-day') || todayStr()}); break;
    case 'resv-add': openSheet({type:'resv', id: el.getAttribute('data-id')}); break;
    case 'resv-del':
      var rp = findPost(el.getAttribute('data-pid'));
      if(rp){
        var rid = el.getAttribute('data-rid');
        var target = (rp.reservations||[]).filter(function(r){ return r.id===rid; })[0];
        if(!target) break;
        if(!confirm((target.name||'이 예약')+' 님 예약을 명단에서 지울까요?')) break;
        rp.reservations = (rp.reservations||[]).filter(function(r){ return r.id!==rid; });
        save(); render(); toast('예약을 삭제했어요');
      }
      break;
    case 'attach-del':
      var k = el.getAttribute('data-key'), ix = +el.getAttribute('data-i');
      if(ui.attach[k]){ ui.attach[k].splice(ix,1); if(!ui.attach[k].length) delete ui.attach[k]; }
      render(); break;
    case 'cmp-photo-del':
      ui.composer.photos.splice(+el.getAttribute('data-i'),1); render(); break;
    case 'cmp-kind':
      var nk = el.getAttribute('data-k');
      if(ui.composer.kind!==nk){
        ui.composer.kind = nk;
        ui.composer.pin = (nk==='reserve');   /* 사전예약 공지는 기본 상단 고정 */
      }
      render(); break;
    case 'cmt-status':
      setCmtStatus(el.getAttribute('data-pid'), el.getAttribute('data-cid'), el.getAttribute('data-st'), el);
      break;
    case 'resv-memo': openResvMemo(el.getAttribute('data-pid'), el.getAttribute('data-rid')); break;
    case 'resv-memo-save': saveResvMemo(el.getAttribute('data-pid'), el.getAttribute('data-rid')); break;
    case 'resv-memo-cancel': ui.resvMemo = null; render(); break;
    case 'submit-post': submitPost(); break;
    case 'staff':
      ui.loginStaff = el.getAttribute('data-name');
      renderLogin(); break;
    case 'key': pressKey(el.getAttribute('data-k')); break;
    case 'pin-focus':
      var pi = $('pinInput'); if(pi) try{ pi.focus({preventScroll:true}); }catch(e){}
      break;
  }
});

document.addEventListener('focusout', function(e){
  var t = e.target;
  if(!t || !t.getAttribute) return;
  if(!(t.getAttribute('data-memo') || t.getAttribute('data-resvmemo') || t.getAttribute('data-keepmemo'))) return;
  setTimeout(function(){
    if(document.activeElement === t) return;
    var ae = document.activeElement;
    if(ae && ae.closest && ae.closest('.c-edit,.rmemo-edit,.k-edit')) return;  /* 저장·취소 버튼으로 이동 */
    cancelInlineEdit();
  }, 220);
});

/* v7: 검색어 입력 — 입력창(#custSearch)은 그대로 두고 목록 영역만 갱신한다(안드로이드 한글 IME 조합 보호) */
function updateCustList(){
  var body = $('custListBody');
  if(!body){ render(); return; }
  body.innerHTML = custListHTML();
}
document.addEventListener('input', function(e){
  var t = e.target;
  if(t.id==='custSearch'){ ui.q = t.value; updateCustList(); return; }
  var dk = t.getAttribute && t.getAttribute('data-draft');
  if(dk){ ui.drafts[dk] = t.value; }
  if(t.name==='text'){
    var frm = t.closest('form[data-form]');
    if(frm) syncFormBtn(frm);
  }
});
/* v7: 한글 조합 중에는 목록 갱신만 하고 입력창은 건드리지 않는다 */
document.addEventListener('compositionstart', function(e){
  var t = e.target;
  if(t && t.id==='custSearch') ui.composing = true;
});
document.addEventListener('compositionend', function(e){
  var t = e.target;
  if(t && t.id==='custSearch'){
    ui.composing = false;
    ui.q = t.value;
    updateCustList();
  }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if(t.type==='file' && t.getAttribute('data-photo')){ handleFiles(t); return; }
  if(t.id==='cPin'){ ui.composer.pin = !!t.checked; return; }
  if(t.getAttribute && t.getAttribute('data-act')==='fyear'){
    ui.year = t.value;
    if(ui.year!=='all' && ui.month!=='all'){
      var hasM = custIndex().days.some(function(d){ return d.slice(0,4)===ui.year && d.slice(5,7)===ui.month; });
      if(!hasM) ui.month = 'all';
    }
    render();
    toast(ui.year==='all'? '전체 연도로 봅니다' : ui.year+'년만 봅니다');
    return;
  }
  if(t.getAttribute && t.getAttribute('data-act')==='fmonth'){
    ui.month = t.value;
    render();
    toast(ui.month==='all'? '전체 월로 봅니다' : (+ui.month)+'월만 봅니다');
    return;
  }
  if(t.getAttribute && t.getAttribute('data-act')==='owner'){
    var c = ensureCust(t.getAttribute('data-id'));
    if(c && c.owner!==t.value){
      c.comments = c.comments||[];
      c.comments.push(sysCmt('담당자 '+(c.owner||'미지정')+' → '+t.value));
      c.owner = t.value;
      save(); render(); toast('담당자를 '+t.value+'님으로 바꿨어요');
    }
    return;
  }
  if(t.getAttribute && t.getAttribute('data-act')==='resv-done'){
    var p = findPost(t.getAttribute('data-pid'));
    if(p){
      var rid = t.getAttribute('data-rid');
      (p.reservations||[]).forEach(function(r){ if(r.id===rid){ r.done = !!t.checked; if(r.link) r.linkOff = !r.done;
        if(t.checked) notifyBridge('사전예약 개통완료', (r.name||'예약자')+' · '+(r.model||''));
      } });
      save(); render(); toast(t.checked?'개통완료로 체크했어요':'개통 체크를 해제했어요');
    }
    return;
  }
});

document.addEventListener('submit', function(e){
  var f = e.target.closest('form[data-form]');
  if(!f) return;
  e.preventDefault();
  var kind = f.getAttribute('data-form');

  if(kind==='login'){ doLogin(); return; }

  /* v8.1(#16813): 관리자 PIN — 맞으면 이 앱의 화면 캡처를 10분 동안 허용 */
  if(kind==='adminpin'){
    var pin = String(new FormData(f).get('pin')||'').trim();
    if(!pin){ toast('관리자 PIN 을 넣어 주세요.', true); return; }
    if(hash('ktband-admin:'+pin) !== ADMIN_HASH){
      toast('관리자 PIN 이 맞지 않아요.', true);
      try{ var inp = f.querySelector('input[name="pin"]'); inp.value=''; inp.focus(); }catch(e){}
      return;
    }
    setAdmin(true);
    closeSheet();
    return;
  }

  if(kind==='cmt' || kind==='reply'){
    var fd = new FormData(f);
    var text = String(fd.get('text')||'').trim();
    var id = f.getAttribute('data-id');
    var ctx = f.getAttribute('data-ctx');
    var mode = f.getAttribute('data-mode')||'';
    var fkey = f.getAttribute('data-key') || (ctx+':'+id);
    var st = ui.cmtStatus[fkey]||'';
    var item = ctx==='cust'? ensureCust(id) : findPost(id);
    if(!item){ toast('대상을 찾지 못했어요.', true); return; }
    if(!text && st) text = st;
    if(mode==='req'){
      if(!st){ toast('통화 상태를 먼저 골라주세요.', true); return; }
      if(!text){ toast('상담 내용을 적어주세요.', true); return; }
    }

    if(kind==='cmt'){
      var photos = ui.attach[fkey]||[];
      if(!text && !photos.length){ toast('내용을 입력해 주세요.', true); return; }
      item.comments = item.comments||[];
      if(ctx==='cust') applyCustStatus(item, st);
      item.comments.push({id:uid('c'), author:session.staff, at:nowAt(), text:text, st:st, photos:photos.slice(), replies:[]});
      ui.openCmts[item.id] = true;
      delete ui.drafts[fkey]; delete ui.attach[fkey]; delete ui.cmtStatus[fkey];
      save(); render();
      toast((ctx==='cust'? '통화 기록을 남겼어요' : '댓글을 남겼어요') + (st? ' · '+stLabel(st) : ''));
      notifyBridge(ctx==='cust'? '통화 기록' : '댓글 등록',
                   (ctx==='cust'? (item.name||'고객') : (item.author||'글'))+' · '+shortText(text, 60));
    } else {
      var cid = f.getAttribute('data-cid');
      var parent = (item.comments||[]).filter(function(c){ return c.id===cid; })[0];
      if(!parent){ toast('댓글을 찾지 못했어요.', true); return; }
      if(!text){ toast('답글 내용을 입력해 주세요.', true); return; }
      parent.replies = parent.replies||[];
      if(ctx==='cust') applyCustStatus(item, st);
      parent.replies.push({id:uid('r'), author:session.staff, at:nowAt(), text:text, st:st, photos:[]});
      ui.replyOpen = null;
      ui.openReplies[cid] = true;
      delete ui.drafts[fkey]; delete ui.cmtStatus[fkey];
      save(); render();
      toast('답글을 남겼어요' + (st? ' · '+stLabel(st) : ''));
      notifyBridge('답글 등록', (ctx==='cust'? (item.name||'고객') : (parent.author||'글'))+' · '+shortText(text, 60));
    }
    return;
  }

  if(kind==='custadd'){
    var d = new FormData(f);
    var name = String(d.get('name')||'').trim();
    var phone = String(d.get('phone')||'').trim();
    var day = String(d.get('day')||todayStr());
    if(!name){ toast('고객명을 입력해 주세요.', true); return; }
    var c = {
      id: uid('c'), day: day, name: name, phone: phone,
      bucket: String(d.get('bucket')||'730'),
      owner: String(d.get('owner')||session.staff),
      status: '미통화',
      memo: String(d.get('memo')||'').trim(),
      comments: []
    };
    state.customers.push(c);
    custIdxDirty();
    var autoDone = ledgerApply();
    save(); closeSheet(); render();
    toast(autoDone? name+'님 — 장부에서 개통 확인, 개통완료로 표시했어요' : name+'님을 명단에 추가했어요');
    notifyBridge('명단 추가', name+' · '+day+' · '+c.bucket);
    return;
  }

  if(kind==='resvadd'){
    var rd = new FormData(f);
    var rname = String(rd.get('name')||'').trim();
    if(!rname){ toast('고객명을 입력해 주세요.', true); return; }
    var post = findPost(f.getAttribute('data-id'));
    if(!post){ toast('공지를 찾지 못했어요.', true); return; }
    post.reservations = post.reservations||[];
    post.reservations.push({
      id: uid('r'), name: rname,
      phone: String(rd.get('phone')||'').trim(),
      model: String(rd.get('model')||'').trim(),
      owner: String(rd.get('owner')||session.staff),
      memo: String(rd.get('memo')||'').trim(),
      at: nowAt(),
      done: false
    });
    ledgerApply();
    save();
    sheetSpec = {type:'post', id:post.id};
    render();
    toast(rname+'님 사전예약을 추가했어요');
    return;
  }

  if(kind==='memo'){
    var md = new FormData(f);
    var cc = ensureCust(f.getAttribute('data-id'));
    if(cc){
      cc.memo = String(md.get('memo')||'').trim();
      save();
      if(sheetSpec && sheetSpec.type==='cust'){ render(); }
      else { closeSheet(); render(); }
      toast('메모를 저장했어요');
      notifyBridge('메모 저장', (cc.name||'고객')+' · '+shortText(cc.memo||'', 60));
    }
    return;
  }
});

document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    if($('lightbox').classList.contains('on')){ closeLB(); }
    else if(ui.resvMemo){ ui.resvMemo = null; render(); }
    else if(ui.memoEdit){ ui.memoEdit = null; render(); }
    else if(sheetSpec){ closeSheet(); }
    return;
  }
  if(e.target && e.target.getAttribute && e.target.getAttribute('data-memo') && e.key==='Enter'){
    e.preventDefault();
    saveMemo(e.target.getAttribute('data-memo'));
    return;
  }
  if(e.target && e.target.getAttribute && e.target.getAttribute('data-resvmemo')){
    if(e.key==='Enter'){
      e.preventDefault();
      saveResvMemo(e.target.getAttribute('data-pid'), e.target.getAttribute('data-resvmemo'));
      return;
    }
    if(e.key==='Escape'){
      e.preventDefault();
      ui.resvMemo = null; render();
      return;
    }
  }
  if(e.target && e.target.getAttribute && e.target.getAttribute('data-keepmemo') && e.key==='Enter'){
    e.preventDefault();
    saveKeepMemo(e.target.getAttribute('data-keepmemo'));
    return;
  }
  if(e.key==='Enter' && e.target && e.target.tagName==='INPUT' && e.target.name==='text'){
    var form = e.target.closest('form[data-form="cmt"],form[data-form="reply"]');
    if(form){ e.preventDefault(); if(form.requestSubmit) form.requestSubmit(); else form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true})); }
  }
  if(e.target && e.target.id==='pinInput' && e.key==='Enter'){
    e.preventDefault(); doLogin();
  }
});

/* ================= init ================= */
function registerSW(){
  if('serviceWorker' in navigator && location.protocol!=='file:'){
    try{
      navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(function(reg){
        try{ reg.update(); }catch(e){}
      }).catch(function(){});
    }catch(e){}
  }
}
function init(){
  session = loadSession();
  state = loadState();
  ledgerLoad();
  archInit();   /* v8: 과거 전체 명단(archive.json)을 백그라운드로 받아 IndexedDB에 */
  if(session){
    /* 저장해 둔 장부 캐시로 먼저 대조 — 네트워크 없이도 바로 반영 */
    if(ledgerApply()) save();
    ledger.lastNew = 0;
  }
  renderLogin();
  if(session){
    $('login').hidden = true;
    $('app').hidden = false;
    ui.loginStaff = session.staff;
    render();
    var pi = $('pinInput'); if(pi) try{ pi.blur(); }catch(e){}
    ledgerSync(false);
  } else {
    $('login').hidden = false;
    $('app').hidden = true;
    var p2 = $('pinInput');
    if(p2) try{ p2.focus({preventScroll:true}); }catch(e){}
  }
  /* v8.1(#16813): 전용 앱에는 지금이 '직원 화면 = 캡처 차단'임을 먼저 알린다.
     관리자 PIN 을 넣어 관리자 모드가 되면 setAdmin(true) 가 다시 허용으로 바꾼다. */
  applyCapture();
  setInterval(adminTick, 20 * 1000);
  setInterval(function(){ if(session && !document.hidden) ledgerSync(false); }, 5*60*1000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ adminTick(); ledgerSync(false); } });
  registerSW();
}
init();

})();
</script>
