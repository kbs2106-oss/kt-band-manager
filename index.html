<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KT 충주 KT대리점 칠금점 · 가망고객 밴드</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="충주 KT대리점 칠금점 가망고객 밴드 — 공지·상담놓침·730/550/3년 명단·사전예약을 직원끼리 공유하는 웹앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="칠금점 밴드">
<style>
  :root{
    --blue:#3182F6; --blue-deep:#1B64DA; --blue-weak:#E8F3FF;
    --ink:#191F28; --ink-2:#4E5968; --sub:#6B7684; --hint:#8B95A1; --faint:#B0B8C1;
    --line:#EAEEF4; --line-soft:#F1F5F9; --bg:#F5F7FA; --card:#FFFFFF;
    --green:#0E7C5A; --green-bg:#E7F7EF; --amber:#B45309; --amber-bg:#FFF4E5;
    --violet:#5B3FC4; --violet-bg:#EEEBFF; --red:#D14343; --gray-bg:#F2F4F6;
    --no-call:#EF4444; --no-call-ink:#B91C1C; --no-call-bg:#FEE2E2; --no-call-line:#FCA5A5; --no-call-tint:#FFF5F5;
    --absent:#F59E0B; --absent-ink:#B45309; --absent-bg:#FEF3C7; --absent-line:#FCD34D; --absent-tint:#FFFBF2;
    --kt-blue:#0B57D0; --done-ink:#0E7C5A;
    --r:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
  }
  body.lock{overflow:hidden}
  [hidden]{display:none !important}
  h1,h2,h3,p,ul,ol{margin:0}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
  ::selection{background:#CFE0FF}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;
    border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink-2);
    font-size:14.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;transition:background .14s,border-color .14s}
  .btn:hover{background:#FAFBFC;border-color:#DFE5EC}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.primary:hover{background:var(--blue-deep);border-color:var(--blue-deep)}
  .btn.ghost{background:var(--gray-bg);border-color:transparent;color:var(--ink-2)}
  .btn.ghost:hover{background:#E9EDF2}
  .btn.sm{height:40px;padding:0 13px;font-size:13.5px;border-radius:10px}
  .btn.lg{height:52px;font-size:16px;border-radius:14px;width:100%}
  .linkbtn{background:none;border:0;padding:0;color:var(--blue);font-size:13px;font-weight:700}
  .linkbtn:hover{text-decoration:underline}
  .pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:8px;background:var(--gray-bg);
    color:var(--sub);font-size:11.5px;font-weight:700;letter-spacing:-.01em}
  .hide-xs{display:inline}

  /* ---------- login ---------- */
  .login{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:18px;overflow:auto;background:var(--bg)}
  .login-card{width:100%;max-width:400px;background:#fff;border-radius:24px;border:1px solid var(--line);overflow:hidden}
  .login-top{padding:34px 24px 22px;text-align:center}
  .lmark{width:52px;height:52px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;
    background:var(--blue);color:#fff;font-weight:800;font-size:19px;letter-spacing:-.05em}
  .login-top h1{font-size:20px;font-weight:800;letter-spacing:-.03em}
  .login-top p{margin-top:5px;font-size:13px;color:var(--hint);font-weight:600}
  .login-body{padding:4px 22px 24px}
  .lbl{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:12px 0 8px}
  .staff-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .staff-chip{height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;
    font-size:15px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:7px;transition:.14s}
  .staff-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c,#B0B8C1)}
  .staff-chip.on{background:var(--blue-weak);border-color:#8FB6F0;color:var(--blue-deep)}
  .pindots{display:flex;justify-content:center;gap:16px;padding:6px 0 16px}
  .pindots i{width:12px;height:12px;border-radius:50%;background:#E5E8EB;transition:.12s}
  .pindots i.on{background:var(--blue);transform:scale(1.06)}
  .pininput{position:absolute;opacity:0;width:1px;height:1px;border:0;padding:0}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
  .keypad button{height:52px;border-radius:12px;border:0;background:var(--gray-bg);font-size:20px;font-weight:600;color:var(--ink)}
  .keypad button:active{background:#E5E8EB}
  .keypad button.fn{font-size:14px;font-weight:700;color:var(--sub)}
  .lerr{min-height:18px;margin-top:10px;text-align:center;font-size:13px;font-weight:700;color:var(--red)}
  .shake{animation:shake .32s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  .login-note{margin-top:12px;text-align:center;font-size:12px;color:var(--faint);line-height:1.6}

  /* ---------- topbar ---------- */
  .topbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line-soft)}
  .topbar-inner{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:9px;height:58px;padding:0 18px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 auto}
  .brand-mark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;
    background:var(--blue);color:#fff;font-weight:800;font-size:12px;letter-spacing:-.05em}
  .brand-text{min-width:0}
  .brand-text h1{font-size:16px;font-weight:700;letter-spacing:-.03em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topacts{display:flex;align-items:center;gap:6px;flex:none}
  .who{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 5px;border-radius:999px;
    border:0;background:#fff;font-size:14px;font-weight:600;color:var(--ink-2)}
  .who:hover{background:var(--gray-bg)}
  .av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--c,#3182F6);
    color:#fff;font-weight:700;font-size:14px;letter-spacing:-.02em}
  .av.xs{width:26px;height:26px;font-size:11px}
  .tabs{max-width:1040px;margin:0 auto;padding:0 18px;display:flex;gap:26px}
  .tab{position:relative;height:46px;padding:0;border:0;background:none;display:inline-flex;align-items:center;gap:6px;
    font-size:15px;font-weight:600;color:var(--hint);letter-spacing:-.02em;transition:color .14s}
  .tab:hover{color:var(--ink-2)}
  .tab.on{color:var(--ink);font-weight:700}
  .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
  .tab .n{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 6px;
    border-radius:999px;background:var(--gray-bg);color:var(--sub);font-size:11.5px;font-weight:700}
  .tab .n:empty{display:none}
  .tab.on .n{background:var(--blue-weak);color:var(--blue-deep)}

  /* ---------- layout ---------- */
  .page{max-width:1040px;margin:0 auto;padding:18px 18px 110px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:start}
  main{min-width:0;max-width:720px;margin:0 auto;width:100%}
  @media (min-width:1080px){
    .page{grid-template-columns:minmax(0,1fr) 300px}
    main{margin:0}
    .rail{position:sticky;top:130px;display:grid;gap:12px}
  }
  @media (max-width:1079px){ .rail{display:none} }
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}

  /* ---------- home: pinned notice ---------- */
  .noticecard{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
  .nc-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
  .nc-head b{font-size:12.5px;font-weight:700;color:var(--hint);letter-spacing:.01em}
  .nc-toggle{background:none;border:0;padding:0 4px;height:36px;color:var(--faint);font-size:13px;font-weight:600}
  .nc-toggle:hover{color:var(--sub)}
  .pin-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
    padding:16px;border-top:1px solid var(--line-soft);transition:background .12s;min-height:56px}
  .pin-item:hover{background:#FAFBFC}
  .pi-kind{flex:none;font-size:11.5px;font-weight:700;color:var(--blue);min-width:26px}
  .pi-title{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pi-right{flex:none;font-size:13px;font-weight:600;color:var(--hint);white-space:nowrap}
  .noticecard.closed .pin-item{display:none}

  /* ---------- home: filter + feed ---------- */
  .filterbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 16px}
  .filterbar::-webkit-scrollbar{display:none}
  .fchip{flex:none;height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;
    color:var(--ink-2);font-size:13.5px;font-weight:600;white-space:nowrap;transition:.12s}
  .fchip:hover{border-color:#DFE5EC}
  .fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .feed{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}

  .post{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 0}
  .post.isdone{background:#FCFDFD}
  .post-head{display:flex;align-items:center;gap:10px}
  .post-head .who{display:block;flex:1;min-width:0;background:none;border:0;height:auto;padding:0;border-radius:0;text-align:left}
  .wname{font-size:14.5px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
  .wmeta{margin-top:2px;font-size:12.5px;color:var(--hint);font-weight:500}
  .morebtn{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--hint);
    font-size:19px;line-height:1;display:grid;place-items:center;letter-spacing:0}
  .morebtn:hover{background:var(--gray-bg);color:var(--ink-2)}
  .post-title{margin:14px 0 0;font-size:16px;font-weight:700;letter-spacing:-.025em;line-height:1.45}
  .post-body{margin:6px 0 0;font-size:14.5px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
  .post-body:empty{display:none}

  .pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:14px}
  .pgrid.one{grid-template-columns:minmax(0,1fr)}
  .pgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pgrid.one .pcell img{aspect-ratio:16/10;max-height:300px}
  .pcell{position:relative;padding:0;border:0;border-radius:12px;overflow:hidden;background:var(--line-soft);display:block;width:100%}
  .pcell img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
  .pgrid.sm{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pgrid.sm .pcell{width:76px;border-radius:10px}

  .post-actions{display:flex;align-items:center;gap:8px;margin-top:14px;padding:6px 0;border-top:1px solid var(--line-soft)}
  .act{background:none;border:0;padding:11px 8px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--sub);
    display:inline-flex;align-items:center;gap:5px;letter-spacing:-.01em}
  .act:hover{color:var(--ink-2)}
  .act.on{color:var(--blue)}
  .act .cnt{color:var(--hint);font-weight:600}
  .act.on .cnt{color:var(--blue)}

  /* ---------- threads ---------- */
  .thread{padding:0 0 14px}
  .thread.open{border-top:1px solid var(--line-soft);padding-top:4px}
  .cmts{list-style:none;padding:0;margin:0}
  .cmts li.empty{padding:14px 0;font-size:13.5px;color:var(--faint);font-weight:500}
  .cmt{padding:11px 0;border-bottom:1px solid var(--line-soft)}
  .cmt:last-child{border-bottom:0}
  .cmt-head{display:flex;align-items:center;gap:7px;font-size:13px;flex-wrap:wrap}
  .cmt-head b{font-weight:700;letter-spacing:-.01em}
  .cmt-head time{color:var(--faint);font-size:12px;font-weight:500}
  .replybtn{margin-left:auto;background:none;border:0;padding:0 2px;font-size:12px;font-weight:700;color:var(--faint)}
  .replybtn:hover{color:var(--blue)}
  .cmt p{margin:4px 0 0 0;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--ink-2)}
  .cmt.sys p{color:var(--hint);font-size:13px}
  .cmt.sys .cmt-head b{color:var(--hint)}
  .rep-toggle{display:inline-flex;align-items:center;gap:5px;margin:8px 0 0;padding:0 11px;height:32px;border-radius:999px;
    border:1px solid #D6E4F8;background:#F4F8FF;color:var(--blue-deep);font-size:12.5px;font-weight:700;letter-spacing:-.01em}
  .rep-toggle:hover{background:#E9F1FE;border-color:#BFD8FB}
  .rep-toggle .chev{font-size:9px;line-height:1;color:var(--blue)}
  .replies{list-style:none;margin:6px 0 0;padding:0 0 0 12px;border-left:2px solid var(--line)}
  .replies li{font-size:13.5px;line-height:1.6;padding:3px 0;color:var(--ink-2);word-break:break-word}
  .replies li b{font-weight:700;margin-right:5px}
  .replies li time{color:var(--faint);font-size:11.5px;margin-left:6px;font-weight:500}
  .rav{color:var(--faint);font-weight:700;margin-right:4px}

  .cbar{display:block;margin-top:12px}
  .cbar-row{display:flex;align-items:center;gap:8px}
  .cbar input{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid transparent;background:var(--line-soft);
    padding:0 14px;font-size:14px}
  .cbar input::placeholder{color:var(--faint)}
  .cbar input:focus{outline:none;border-color:var(--blue);background:#fff}
  .stpick{margin:0 0 9px;padding:10px 12px;border-radius:12px;background:#F7F9FC;border:1px solid var(--line)}
  .cbar.reply .stpick{padding:9px 10px;margin-top:2px}
  .stpick-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .stpick-lbl{font-size:12px;font-weight:800;color:var(--ink-2);letter-spacing:-.01em;white-space:nowrap}
  .stpick-lbl em{font-style:normal;font-size:10px;font-weight:800;color:#fff;background:var(--no-call);border-radius:5px;padding:2px 5px;margin-left:4px;vertical-align:1px}
  .stpick-lbl em.opt{background:#E4E9F0;color:var(--sub)}
  .stpick-tip{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--hint)}
  .stpick-tip[data-st="미통화"]{color:var(--no-call-ink)}
  .stpick-tip[data-st="부재"]{color:var(--absent-ink)}
  .stpick-tip[data-st="예약"]{color:var(--kt-blue)}
  .stpick-tip[data-st="완료"]{color:var(--done-ink)}
  .stpick-chips{display:flex;gap:6px;flex-wrap:wrap}
  .st-chip.sm{display:inline-flex;align-items:center;justify-content:center;height:36px;min-width:0;padding:0 13px;font-size:12.5px;border-radius:10px}
  .st-chip.sm.on{box-shadow:inset 0 0 0 2px currentColor;background:#fff}
  .cbar .send[disabled]{opacity:.4;cursor:not-allowed}
  .cst,.rst{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:800;
    font-style:normal;letter-spacing:-.01em;line-height:1}
  .rst{margin-right:5px}
  .cst[data-st="미통화"],.rst[data-st="미통화"]{background:var(--no-call-bg);color:var(--no-call-ink)}
  .cst[data-st="부재"],.rst[data-st="부재"]{background:var(--absent-bg);color:var(--absent-ink)}
  .cst[data-st="예약"],.rst[data-st="예약"]{background:#E8F0FE;color:var(--kt-blue)}
  .cst[data-st="완료"],.rst[data-st="완료"]{background:#E9F6EF;color:var(--done-ink)}
  .cbar .send{height:42px;padding:0 14px;border-radius:12px;border:0;background:var(--blue);
    color:#fff;font-size:13.5px;font-weight:700;flex:none}
  .cbar .send.ghost{background:var(--gray-bg);color:var(--sub)}
  .cbar .av{display:none}
  .icobtn{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:12px;border:0;
    background:var(--line-soft);font-size:16px;cursor:pointer;color:var(--sub)}
  .icobtn:hover{background:#E9EDF2}
  .attach{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .athumb{position:relative;display:block;width:66px;height:66px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .athumb img{width:100%;height:100%;object-fit:cover}
  .athumb button{position:absolute;top:2px;right:2px;width:19px;height:19px;border-radius:50%;border:0;background:rgba(25,31,40,.7);
    color:#fff;font-size:11px;line-height:1;padding:0}

  /* ---------- reservation table ---------- */
  .resv{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .resv-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;
    background:#FAFBFC;border-bottom:1px solid var(--line-soft)}
  .resv-head b{font-size:13.5px;font-weight:700;letter-spacing:-.02em}
  .rrow{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.15fr) minmax(0,.85fr) minmax(0,.65fr) 34px 22px;
    grid-template-areas:"n p m o c x";gap:3px 8px;align-items:center;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--line-soft)}
  .rrow:last-of-type{border-bottom:0}
  .rrow.rhead{font-size:11.5px;font-weight:700;color:var(--hint);padding:8px 14px;border-bottom:1px solid var(--line-soft)}
  .rrow .rn{grid-area:n;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rrow .rp{grid-area:p;color:var(--sub);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rrow .rm{grid-area:m;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rrow .ro{grid-area:o;color:var(--hint);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rrow .rc{grid-area:c;justify-self:center}
  .rrow .rx{grid-area:x;justify-self:end}
  .rm-in{display:none}
  .rrow.done .rn,.rrow.done .rp,.rrow.done .rm{color:var(--faint);text-decoration:line-through;text-decoration-color:#DDE2E8}
  .rrow .del{background:none;border:0;color:#D3D8DE;font-size:13px;padding:2px}
  .rrow .del:hover{color:var(--red)}
  .chk{display:inline-grid;place-items:center;width:24px;height:24px;cursor:pointer}
  .chk input{position:absolute;opacity:0;width:1px;height:1px}
  .chk i{width:20px;height:20px;border-radius:50%;border:1.5px solid #DDE2E8;background:#fff;display:block;position:relative}
  .chk input:checked + i{background:var(--blue);border-color:var(--blue)}
  .chk input:checked + i::after{content:"";position:absolute;left:6px;top:2.5px;width:4.5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .resv-foot{padding:10px 14px}

  /* ---------- home: todo bar ---------- */
  .todobar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .todo{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;border:1px solid var(--line);
    border-radius:var(--r);background:#fff;text-align:left;transition:.12s}
  .todo:hover{border-color:#DDE5F0;background:#FBFCFE}
  .todo span{font-size:12.5px;font-weight:600;color:var(--hint);letter-spacing:-.01em}
  .todo b{font-size:26px;font-weight:700;letter-spacing:-.04em;line-height:1.15;color:var(--ink)}
  .todo em{font-style:normal;font-size:12px;font-weight:600;color:var(--faint)}
  .todo:first-child b{color:#D14343}
  .todo:last-child b{color:var(--blue-deep)}
  .todo.keep{grid-column:1/-1;flex-direction:row;align-items:center;gap:9px;border-color:#FBD8A8;background:#FFFDF8}
  .todo.keep:hover{background:#FFF7E8;border-color:#F5B96A}
  .todo.keep span{font-size:13px;font-weight:800;color:var(--absent-ink)}
  .todo.keep em{flex:1;text-align:left;color:var(--hint)}
  .todo.keep b{font-size:22px;color:#D97706;margin-left:auto}

  /* ---------- band: summary ---------- */
  .statstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid var(--line);
    border-radius:var(--r);overflow:hidden;margin-bottom:14px}
  .sstat{padding:14px 16px 12px;border:0;border-left:1px solid var(--line-soft);background:#fff;text-align:left;
    display:block;font-family:inherit;transition:.12s;min-height:72px}
  .sstat:first-child{border-left:0}
  .sstat:hover{background:#FAFBFC}
  .sstat.on{background:var(--blue-weak)}
  .sstat span{display:block;font-size:12.5px;font-weight:600;color:var(--hint);letter-spacing:-.01em;white-space:nowrap}
  .sstat b{display:block;margin-top:3px;font-size:24px;font-weight:700;letter-spacing:-.04em;line-height:1.15}
  .sstat.done b{color:var(--blue-deep)}
  .sstat[data-st="미통화"] b{color:var(--no-call)}
  .sstat[data-st="부재"] b{color:#D97706}
  .sstat[data-st="예약"] b{color:var(--kt-blue)}
  .sstat[data-st="완료"] b{color:#7B8794}
  .sstat.hot{background:#FFF7F7}
  .sstat.warm{background:#FFFCF3}
  .sstat.hot span{color:var(--no-call-ink);font-weight:700}
  .sstat.warm span{color:var(--absent-ink);font-weight:700}
  .sstat.hot span::before,.sstat.warm span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:2px}
  .sstat.hot span::before{background:var(--no-call)}
  .sstat.warm span::before{background:var(--absent)}
  .sstat.on span{color:var(--blue-deep)}
  .sstat.on{background:var(--blue-weak);box-shadow:inset 0 0 0 2px #BBD7FA}
  .sstat.rate{padding:12px 14px 10px;display:flex;flex-direction:column;justify-content:center}
  .sstat.rate b{font-size:21px}
  .sstat.rate small{font-size:12px;font-weight:700;margin-left:1px;color:var(--hint)}
  @media (max-width:520px){
    .sstat{padding:12px 11px 10px;min-height:66px}
    .sstat b{font-size:21px}
    .sstat span{font-size:11.5px}
    .todo{padding:12px 13px}
    .todo b{font-size:23px}
  }

  /* ---------- band: filters ---------- */
  .keepbar{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 14px;padding:11px 14px;
    border:1px solid #FBD8A8;border-radius:14px;background:linear-gradient(180deg,#FFF9EF,#FFFDF8);text-align:left;transition:.12s}
  .keepbar:hover{border-color:#F5B96A;background:#FFF7E8}
  .keepbar .kb-ico{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#FDEFD8;font-size:17px}
  .keepbar .kb-txt{display:block;flex:1;min-width:0}
  .keepbar .kb-txt b{display:block;font-size:14px;font-weight:800;letter-spacing:-.02em;color:#8A4B0B}
  .keepbar .kb-txt small{display:block;font-size:11.5px;font-weight:600;color:#B0722F;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .keepbar .kb-n{flex:none;min-width:28px;height:28px;padding:0 7px;border-radius:9px;background:var(--no-call);color:#fff;
    font-size:14px;font-weight:800;display:grid;place-items:center}
  .keepbar .kb-go{flex:none;font-size:12.5px;font-weight:800;color:var(--absent-ink)}
  .keepbar.zero .kb-n{background:#E9DCC8;color:#8A6A45}
  @media (max-width:430px){
    .keepbar{padding:10px 12px;gap:9px}
    .keepbar .kb-txt small{font-size:11px}
  }

  .keepnote{margin:0 0 10px;font-size:12.5px;font-weight:600;color:var(--hint)}
  .keepnote b{color:var(--ink)}
  .klist{display:grid;gap:10px}
  .krow{padding:12px 13px 11px;border:1px solid var(--line);border-left:4px solid #E5E8EB;border-radius:14px;background:#fff}
  .krow[data-st="부재"]{border-left-color:var(--absent);background:#FFFDF8}
  .krow[data-st="미통화"]{border-left-color:var(--no-call);background:#FFF9F9}
  .krow[data-st="예약"]{border-left-color:var(--kt-blue);background:#F9FBFF}
  .krow[data-st="완료"]{border-left-color:#CBD5E1;background:#FAFBFC}
  .k-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .k-name{font-size:15.5px;font-weight:800;letter-spacing:-.02em}
  .k-day{font-size:11.5px;font-weight:600;color:var(--hint)}
  .k-tries{font-size:11px;font-weight:800;color:var(--absent-ink);background:var(--absent-bg);border-radius:6px;padding:2px 6px}
  .k-top .kpin{margin-left:auto}
  .k-mid{display:flex;align-items:center;gap:8px;margin-top:6px}
  .k-phone{flex:1;min-width:0;font-size:14.5px;font-weight:700;color:var(--ink-2);letter-spacing:.01em;padding:6px 0}
  .k-phone:hover{color:var(--blue-deep)}
  .k-phone.quiet{color:var(--faint);font-weight:500}
  .k-memo{display:block;width:100%;text-align:left;margin-top:4px;padding:7px 9px;border-radius:9px;border:0;background:var(--line-soft);
    font-size:13px;font-weight:600;color:var(--sub);white-space:normal;line-height:1.45}
  .k-memo.quiet{color:var(--faint)}
  .k-memo:hover{background:#E9EDF2;color:var(--ink-2)}
  .k-edit{display:flex;align-items:center;gap:6px;margin-top:6px}
  .k-edit input{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--blue);padding:0 11px;font-size:13.5px}
  .k-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .kact{height:38px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:#fff;
    font-size:13px;font-weight:800;color:var(--ink-2);letter-spacing:-.01em}
  .kact:hover{background:#FAFBFC}
  .kact.res{border-color:#A8C7FA;background:#E8F0FE;color:var(--kt-blue)}
  .kact.done{border-color:#BBE5D2;background:#E9F6EF;color:var(--done-ink)}
  .kact.ghost{background:var(--gray-bg);border-color:transparent}
  .kpin{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid transparent;background:transparent;
    font-size:14px;line-height:1;color:#C6CDD6;display:grid;place-items:center;filter:grayscale(1);opacity:.75}
  .kpin:hover{background:var(--line-soft)}
  .kpin.on{background:#FFF3DC;border-color:#F7CE8E;filter:none;opacity:1}

  .filters{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .periodbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .pb-lbl{font-size:12px;font-weight:800;color:var(--hint);letter-spacing:-.01em;margin-right:1px}
  .psel{position:relative;display:inline-flex;align-items:center;height:36px;padding:0 9px 0 11px;border-radius:10px;
    border:1px solid var(--line);background:#fff}
  .psel::after{content:"▾";font-size:9px;color:#9AA3AE;margin-left:5px;pointer-events:none}
  .psel select{border:0;background:none;outline:none;appearance:none;-webkit-appearance:none;padding:0;margin:0;
    font-size:12.5px;font-weight:800;color:var(--ink-2);letter-spacing:-.01em}
  .pb-on{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 9px 0 10px;border:1px solid #BFD8FB;border-radius:9px;
    background:var(--blue-weak);color:var(--blue-deep);font-size:11.5px;font-weight:800;letter-spacing:-.01em}
  .pb-on:hover{background:#DCEBFF}
  .pb-x{font-size:10px;color:#5B8FDC;font-weight:700}
  .filters .sep{flex:none;width:1px;height:18px;background:var(--line);margin:0 3px}
  .ftools{display:flex;align-items:center;gap:7px;flex:none}
  .qbox{flex:none;display:flex;align-items:center;gap:5px;height:40px;padding:0 12px;border-radius:999px;
    border:1px solid var(--line);background:#fff;color:var(--hint);font-size:13px}
  .qbox input{border:0;outline:none;background:none;font-size:13.5px;width:78px;min-width:0;color:var(--ink)}
  .qbox input::placeholder{color:var(--faint)}
  .maskbtn{flex:none;height:40px;width:40px;border-radius:999px;border:1px solid var(--line);background:#fff;
    font-size:14px;color:var(--sub);display:grid;place-items:center}
  .maskbtn.on{background:var(--gray-bg)}

  /* ---------- band: day cards / customers ---------- */
  .daylist{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
  .day{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .day-head{display:flex;align-items:center;gap:8px;padding:15px 16px 10px}
  .dh-date{display:flex;align-items:center;gap:7px;font-size:15.5px;font-weight:700;letter-spacing:-.03em}
  .dh-done{font-size:13px;font-weight:600;color:var(--hint);white-space:nowrap;margin-left:auto}
  .dh-done b{color:#D14343;font-weight:700;margin-left:1px}
  .dh-done.all-done{color:var(--blue-deep)}
  .day-add{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--line-soft);color:var(--sub);
    font-size:17px;display:grid;place-items:center;line-height:1}
  .day-add:hover{background:#E9EDF2}
  .cust-list{display:block;padding:0 0 6px}
  .cust{position:relative;padding:12px 16px 10px 21px;border-top:1px solid var(--line-soft)}
  .cust::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#E5E8EB}
  .cust[data-st="미통화"]{background:var(--no-call-tint)}
  .cust[data-st="미통화"]::before{background:var(--no-call)}
  .cust[data-st="부재"]{background:var(--absent-tint)}
  .cust[data-st="부재"]::before{background:var(--absent)}
  .cust[data-st="예약"]::before{background:var(--kt-blue)}
  .cust[data-st="완료"]::before{background:#CBD5E1}
  .cust.is-done{background:#F8FAFB;opacity:.6}
  .cust.is-done .c-name{color:var(--hint)}
  .c-top{display:flex;align-items:center;gap:8px}
  .c-name{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700;letter-spacing:-.02em;min-width:0;color:var(--ink);flex:1}
  .c-name .bk{flex:none}
  .cust .bk{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--gray-bg);color:var(--sub);letter-spacing:-.01em}
  .st-chip{flex:none;height:44px;min-width:70px;padding:0 12px;border-radius:11px;border:1.5px solid transparent;background:var(--gray-bg);color:var(--ink-2);
    font-size:13px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
  .st-chip:active{transform:scale(.98)}
  .st-chip[data-st="미통화"]{background:var(--no-call-bg);color:var(--no-call-ink);border-color:var(--no-call-line);font-weight:800}
  .st-chip[data-st="부재"]{background:var(--absent-bg);color:var(--absent-ink);border-color:var(--absent-line);font-weight:800}
  .st-chip[data-st="예약"]{background:#E8F0FE;color:var(--kt-blue);border-color:#A8C7FA}
  .st-chip[data-st="완료"]{background:#E9F6EF;color:var(--done-ink);border-color:#BBE5D2}
  .cust.is-done .st-chip{opacity:.85}
  .c-mid{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
  .c-phone{font-size:14.5px;font-weight:600;color:var(--ink-2);letter-spacing:.01em;padding:10px 0;display:inline-block;min-height:44px}
  .c-phone:hover{color:var(--blue-deep)}
  .c-phone.quiet{color:var(--faint);font-weight:500}
  .c-cmt{flex:none;height:44px;min-width:54px;padding:0 10px;border-radius:11px;border:0;background:#fff;color:var(--hint);
    font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
  .c-cmt:hover{background:var(--line-soft);color:var(--sub)}
  .c-bottom{display:flex;align-items:center;gap:8px;margin-top:2px}
  .c-owner{flex:none;display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 9px;border-radius:10px;background:var(--line-soft)}
  .c-owner::after{content:"▾";font-size:9px;color:#9AA3AE;margin-left:-4px;pointer-events:none}
  .c-owner select{border:0;background:none;outline:none;font-size:12.5px;font-weight:700;color:var(--ink-2);
    appearance:none;-webkit-appearance:none;padding:0;margin:0;max-width:76px}
  .c-memo{flex:1;min-width:0;text-align:left;background:none;border:0;font-size:13.5px;font-weight:500;color:var(--sub);
    line-height:1.45;padding:12px 0;min-height:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .c-memo.quiet{color:var(--faint)}
  .c-memo:hover{color:var(--blue-deep)}
  .c-edit{display:flex;align-items:center;gap:6px;margin-top:6px}
  .c-edit input{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid var(--blue);padding:0 12px;font-size:14px}
  .c-edit input:focus{outline:none}
  .mini-ok{flex:none;height:42px;padding:0 14px;border-radius:10px;border:0;background:var(--blue);color:#fff;font-size:13.5px;font-weight:700}
  .mini-x{flex:none;width:42px;height:42px;border-radius:10px;border:0;background:var(--gray-bg);color:var(--sub);font-size:14px}
  .day-empty{padding:22px 16px;text-align:center;font-size:13.5px;color:var(--faint)}
  @media (max-width:430px){
    .cust{padding:11px 15px 12px 19px}
    .c-name{font-size:15.5px}
    .c-phone{font-size:14px}
    .day-add{width:32px;height:32px}
  }

  /* ---------- composer (sheet) ---------- */
  .cmp-tabs{display:flex;gap:7px;margin-bottom:16px}
  .cmp-tabs .fchip{height:32px;font-size:13px}
  .inp,textarea.inp{width:100%;border:0;border-radius:0;background:#fff;padding:12px 0;font-size:15px;line-height:1.65;color:var(--ink)}
  .inp:focus,textarea.inp:focus{outline:none}
  .inp-title{font-size:17px;font-weight:700;letter-spacing:-.02em;padding:4px 0 10px;border-bottom:1px solid var(--line-soft)}
  .inp-title::placeholder{font-weight:700;color:var(--faint)}
  textarea.inp{resize:none;min-height:150px;display:block}
  textarea.inp::placeholder{color:var(--faint)}
  .cmp-photos{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 4px}
  .cmp-photos .athumb{width:78px;height:78px;border-radius:12px}
  .cmp-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding:12px 0;border-top:1px solid var(--line-soft)}
  .cmp-tools .grow{flex:1}
  .cmp-submit{width:100%;margin-top:10px}
  .switch{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap}
  .switch input{appearance:none;width:38px;height:22px;border-radius:99px;background:#DDE2E8;position:relative;transition:.16s;margin:0;cursor:pointer}
  .switch input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(25,31,40,.22);transition:.16s}
  .switch input:checked{background:var(--blue)}
  .switch input:checked::after{transform:translateX(16px)}
  .photobtns{display:flex;gap:7px;flex-wrap:wrap}

  /* ---------- rail ---------- */
  .rail-card{padding:16px}
  .rail-card h3{font-size:13px;font-weight:700;color:var(--hint);letter-spacing:0;margin-bottom:10px}
  .rstaff{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13.5px}
  .rstaff .av{width:26px;height:26px;font-size:11px}
  .rstaff b{font-weight:600;flex:1;letter-spacing:-.01em;color:var(--ink-2)}
  .rstaff span{font-size:12.5px;font-weight:600;color:var(--faint)}
  .rstaff span b{color:var(--blue-deep);font-size:13px;font-weight:700}
  .rail-note{font-size:12px;color:var(--faint);line-height:1.6;margin-top:8px}
  .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .qgrid .btn{height:38px;font-size:13px;border-radius:10px;justify-content:center;padding:0 8px}

  /* ---------- sheet / modal ---------- */
  .sheet{position:fixed;inset:0;z-index:60;display:none}
  .sheet.on{display:block}
  .sheet-backdrop{position:absolute;inset:0;background:rgba(25,31,40,.42)}
  .sheet-panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;
    max-height:92vh;display:flex;flex-direction:column;animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(18px);opacity:.5}to{transform:none;opacity:1}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px;flex:none}
  .sheet-head b{font-size:17px;font-weight:700;letter-spacing:-.02em}
  .sheet-head .x{background:none;border:0;height:32px;padding:0 4px;font-size:14px;font-weight:600;color:var(--hint)}
  .sheet-head .x:hover{color:var(--ink-2)}
  .sheet-body{padding:0 18px calc(24px + env(safe-area-inset-bottom));overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  @media (min-width:700px){
    .sheet-panel{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:560px;max-height:86vh;border-radius:20px;animation:pop .18s ease-out}
    @keyframes pop{from{transform:translate(-50%,-46%) scale(.98);opacity:.6}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
    .sheet-body{padding-bottom:22px}
  }
  .sheet-full{max-height:96vh;height:96vh;border-radius:22px 22px 0 0}
  @media (min-width:700px){ .sheet-full{height:auto;max-height:86vh} }
  .menu-list{display:grid;gap:0;padding:2px 0 6px}
  .menu-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;
    padding:15px 2px;border:0;border-top:1px solid var(--line-soft);background:none;font-size:15px;font-weight:600;color:var(--ink)}
  .menu-item:first-child{border-top:0}
  .menu-item:hover{color:var(--blue-deep)}
  .menu-item.danger{color:var(--red)}
  .menu-item small{display:block;font-size:12.5px;font-weight:500;color:var(--hint);margin-top:2px}
  .menu-item .arw{color:var(--faint);font-weight:600;font-size:16px}
  .menu-item.static{cursor:default}
  .menu-item.static:hover{color:var(--ink)}

  /* forms */
  .form{display:grid;gap:14px;padding-top:2px}
  .form label{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--sub);letter-spacing:0}
  .form input,.form select,.form textarea{height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 14px;font-size:15px;font-weight:500}
  .form textarea{height:auto;padding:12px 14px;resize:none;line-height:1.6}
  .form input::placeholder,.form textarea::placeholder{color:var(--faint);font-weight:500}
  .form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--blue)}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .formfoot{display:flex;gap:8px;margin-top:4px}
  .formfoot .btn{flex:1}
  .hint{font-size:12.5px;color:var(--faint);font-weight:500;line-height:1.6}

  /* cust detail sheet */
  .cd-head{padding:4px 0 14px;border-bottom:1px solid var(--line-soft)}
  .cd-name{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:700;letter-spacing:-.03em}
  .cd-phone{display:inline-block;margin-top:6px;font-size:15px;font-weight:500;color:var(--sub)}
  .cd-row{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
  .cd-row > span:first-child{flex:none;width:52px;font-size:13px;font-weight:700;color:var(--hint)}
  .cd-status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;flex:1}
  .cd-status .st-chip{height:36px;font-size:13px}
  .cd-owner{display:flex;align-items:center;gap:7px;flex:1}

function loadState(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var d = JSON.parse(raw);
      if(d && Array.isArray(d.posts) && Array.isArray(d.customers)) return d;
    }
  }catch(e){}
  var s = seed();
  try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){}
  return s;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('저장 공간이 부족해요. 사진을 줄이거나 내보내기 후 초기화해 주세요.', true); }
}
function findPost(id){ for(var i=0;i<state.posts.length;i++){ if(state.posts[i].id===id) return state.posts[i]; } return null; }
function findCust(id){ for(var i=0;i<state.customers.length;i++){ if(state.customers[i].id===id) return state.customers[i]; } return null; }
function sysCmt(text){

}

/* ================= toast / lightbox / sheet ================= */
function toast(msg, isErr){
  var el = $('toast');
  el.textContent = msg;
  el.className = 'toast on' + (isErr?' err':'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.className = 'toast'; }, 2500);
}
function openLB(src){
  if(!src) return;
  $('lbImg').src = src;
  $('lightbox').classList.add('on');
  document.body.classList.add('lock');
}
function closeLB(){
  $('lightbox').classList.remove('on');
  $('lbImg').removeAttribute('src');
  if(!sheetSpec) document.body.classList.remove('lock');
}
function sheetPanel(){ return document.querySelector('.sheet-panel'); }
function openSheet(spec){
  sheetSpec = spec;
  ui.replyOpen = null;
  renderSheet();
  $('sheet').classList.add('on');
  $('sheet').setAttribute('aria-hidden','false');
  document.body.classList.add('lock');
  var b = $('sheetBody'); if(b) b.scrollTop = 0;
  if(spec && spec.type==='compose'){
    setTimeout(function(){
      var el = $('cBody');
      if(el) try{ el.focus({preventScroll:true}); }catch(e){}
    }, 240);
  }
}
function closeSheet(){
  sheetSpec = null;
  ui.resvMemo = null;
  $('sheet').classList.remove('on');
  $('sheet').setAttribute('aria-hidden','true');
  $('sheetBody').innerHTML = '';
  var p = sheetPanel(); if(p) p.classList.remove('sheet-full');
  document.body.classList.remove('lock');
}
function renderSheet(){
  if(!sheetSpec) return;
  var b = $('sheetBody'), ttl = $('sheetTitle');
  var panel = sheetPanel();
  var sc = b.scrollTop;
  var type = sheetSpec.type, id = sheetSpec.id;

  if(panel) panel.classList.toggle('sheet-full', type==='compose');

  if(type==='post'){
    var p = findPost(id);
    if(!p){ closeSheet(); return; }
    ttl.textContent = p.reserve?'사전예약 공지':(KIND_LABEL[p.kind]||'글');
    b.innerHTML = postCard(p, {sheet:true});
  } else if(type==='compose'){
    ttl.textContent = '새 글';
    b.innerHTML = composerHTML();
  } else if(type==='cust'){
    var c = findCust(id);
    if(!c){ closeSheet(); return; }
    ttl.textContent = '고객 정보';
    b.innerHTML = custSheetHTML(c);
  } else if(type==='keep'){
    ttl.textContent = '부재중 킵';
    b.innerHTML = keepSheetHTML();
  } else if(type==='custadd'){
    ttl.textContent = '명단 추가';
    b.innerHTML = custAddForm(sheetSpec.day);
  } else if(type==='resv'){
    var pp = findPost(id);
    if(!pp){ closeSheet(); return; }
    ttl.textContent = '사전예약 추가';
    b.innerHTML = resvForm(pp.id);
  } else if(type==='postmenu'){
    var pm = findPost(id);
    if(!pm){ closeSheet(); return; }
    ttl.textContent = '글 관리';
    b.innerHTML = postMenuHTML(pm);
  } else if(type==='status'){
    var cs = findCust(id);
    if(!cs){ closeSheet(); return; }
    ttl.textContent = '통화 상태';
    b.innerHTML = statusMenuHTML(cs);
  } else if(type==='memo'){
    var mc = findCust(id);
    if(!mc){ closeSheet(); return; }
    ttl.textContent = '메모 · ' + mc.name;
    b.innerHTML = '<form class="form" data-form="memo" data-id="'+mc.id+'">'
      + '<label>메모<textarea name="memo" rows="3" placeholder="상담 내용 · 재통화 약속 · 전달사항">'+esc(mc.memo||'')+'</textarea></label>'
      + '<div class="formfoot"><button class="btn primary" type="submit">저장</button>'
      + '<button class="btn ghost" type="button" data-act="close">취소</button></div></form>';
  } else if(type==='menu'){
    ttl.textContent = '설정';
    b.innerHTML = menuHTML();
  }
  b.scrollTop = sc;
}

/* ================= login ================= */
function renderLogin(){
  var g = $('staffGrid');
  g.innerHTML = STAFF.map(function(n){
    return '<button type="button" class="staff-chip '+(ui.loginStaff===n?'on':'')+'" data-act="staff" data-name="'+esc(n)+'">'
      + '<span class="dot" style="--c:'+colorOf(n)+'"></span>'+esc(n)+'</button>';
  }).join('');
  updateDots();
}
function updateDots(){
  var v = ($('pinInput')||{}).value || '';
  var dots = $('pindots').children;
  for(var i=0;i<dots.length;i++) dots[i].className = i<v.length?'on':'';
}
function clearPin(){ var p=$('pinInput'); if(p) p.value=''; updateDots(); }
function loginErr(msg){
  $('loginErr').textContent = msg||'';
  var card = document.querySelector('.login-card');
  card.classList.remove('shake');
  void card.offsetWidth;
  card.classList.add('shake');
}
function doLogin(){
  var pin = ($('pinInput').value||'').trim();
  if(!ui.loginStaff){ loginErr('직원을 선택해 주세요.'); return; }
  if(!pin){ loginErr('비밀번호를 입력해 주세요.'); return; }
  if(hash('ktband:'+pin) !== PIN_HASH){ loginErr('비밀번호가 맞지 않아요.'); clearPin(); return; }
  session = {staff:ui.loginStaff, at:nowAt()};
  saveSession(session);
  $('loginErr').textContent = '';
  $('login').hidden = true;
  $('app').hidden = false;
  render();
  toast(session.staff+'님, 반갑습니다!');
}
function pressKey(k){
  var p = $('pinInput');
  if(k==='clear'){ p.value=''; updateDots(); return; }
  if(k==='back'){ p.value = p.value.slice(0,-1); updateDots(); return; }
  if(p.value.length>=4) return;
  p.value = p.value + k;
  updateDots();
  if(p.value.length===4) setTimeout(doLogin, 120);
}

function kindChips(){
  var sets = [
    {k:'all', t:'전체'},
    {k:'consult', t:'상담놓침'},
    {k:'notice', t:'매장 공지'},
    {k:'reserve', t:'사전예약'}
  ];
  return sets.map(function(f){
    return '<button class="fchip '+(ui.filter===f.k?'on':'')+'" data-act="filter" data-f="'+f.k+'">'+f.t+'</button>';
  }).join('');
}
function postMatch(p){
  if(ui.filter==='all') return true;
  if(ui.filter==='consult') return p.kind==='consult';
  if(ui.filter==='notice') return p.kind==='notice' && !p.reserve;
  if(ui.filter==='reserve') return !!p.reserve;
  if(ui.filter==='memo') return p.kind==='memo';
  return true;
}
function byAtDesc(a,b){ return String(b.at||'').localeCompare(String(a.at||'')); }

    h += '<button type="button" class="cseg-b'+(on?' on':'')+'" data-act="cmt-status" data-pid="'+pid+'" data-cid="'+c.id+'"'

       : '<div class="emptycard">아직 글이 없어요.<br>오른쪽 아래 <b>＋</b> 버튼으로 첫 글을 남겨보세요.</div>') + '</div>';
  return h;
}

function pinItem(p){
  var kind = p.reserve? '예약' : (p.kind==='consult'? '상담' : (p.kind==='notice'? '공지' : '메모'));
  var right = '';
  if(p.reserve){
    var rs = p.reservations||[]; var dn = rs.filter(function(r){return r.done;}).length;
    if(rs.length) right = dn+'/'+rs.length+' 개통';

    right = p.done? '완료' : '진행 중';
  }
  var title = String(p.title || p.body || '').replace(/^상담놓침\s*[:：]\s*/,'').split('\n')[0];
  return '<button class="pin-item" data-act="open-post" data-id="'+p.id+'">'
    + '<span class="pi-kind">'+kind+'</span>'
    + '<span class="pi-title">'+esc(title)+'</span>'
    + (right? '<span class="pi-right">'+right+'</span>' : '')
    + '</button>';
}

function postCard(p, opts){
  opts = opts||{};
  var cs = p.comments||[];
  var open = !!opts.sheet || !!ui.openThreads[p.id];
  var kindLabel = p.reserve? '사전예약' : (KIND_LABEL[p.kind]||'글');
  var h = '<article class="post '+(p.done?'isdone':'')+'">';
  h += '<div class="post-head">'
     +   '<span class="av" style="--c:'+colorOf(p.author)+'">'+esc(initial(p.author))+'</span>'
     +   '<div class="who"><div class="wname">'+esc(p.author)+'</div>'
     +     '<div class="wmeta">'+fmtAt(p.at)+' · '+kindLabel+'</div></div>'
     +   '<button class="morebtn" data-act="post-menu" data-id="'+p.id+'" aria-label="글 관리">⋯</button>'
     + '</div>';

  h += photoGrid(p.photos);
  if(p.reserve) h += reserveBlock(p);

function photoGrid(ps, size){
  if(!ps || !ps.length) return '';
  var cls = ps.length===1?'one':(ps.length===2?'two':'');
  var out = '<div class="pgrid '+(size||'')+' '+cls+'">';
  for(var i=0;i<ps.length;i++){
    out += '<button class="pcell" data-act="photo" aria-label="사진 크게 보기"><img src="'+esc(ps[i].src)+'" alt="'+esc(ps[i].name||'첨부 사진')+'" loading="lazy"></button>';
  }
  return out+'</div>';
}

function reserveBlock(p){

    h += '<div class="rrow rhead"><span class="rn">고객</span><span class="rp">연락처</span><span class="rm">희망기종</span><span class="ro">담당</span><span class="rc">개통</span><span class="rx"></span></div>';
    rs.forEach(function(r){
      h += '<div class="ritem">';
      h += '<div class="rrow '+(r.done?'done':'')+'">'

         + '<span class="rp"><a href="tel:'+digits(r.phone)+'">'+esc(ui.mask?maskPhone(r.phone):r.phone)+'</a></span>'
         + '<span class="rm">'+esc(r.model||'-')+'</span>'
         + '<span class="ro">'+esc(r.owner||'-')+'</span>'
         + '<span class="rc"><label class="chk" title="개통 완료"><input type="checkbox" data-act="resv-done" data-pid="'+p.id+'" data-rid="'+r.id+'" '+(r.done?'checked':'')+'><i></i></label></span>'
         + '<span class="rx"><button class="del" data-act="resv-del" data-pid="'+p.id+'" data-rid="'+r.id+'" title="예약 삭제">✕</button></span>'
         + '</div>';
      if(ui.resvMemo===r.id){
        h += '<div class="rmemo-edit"><input id="rmemo_'+r.id+'" data-resvmemo="'+r.id+'" data-pid="'+p.id+'"'
           + ' value="'+esc(r.memo||'')+'" placeholder="메모 한 줄 (예) 오전 10시 재통화" enterkeyhint="done" autocomplete="off">'
           + '<button class="mini-ok" data-act="resv-memo-save" data-pid="'+p.id+'" data-rid="'+r.id+'">저장</button>'
           + '<button class="mini-x" data-act="resv-memo-cancel" aria-label="취소">✕</button></div>';
      } else {
        h += '<button class="rmemo '+(r.memo?'':'quiet')+'" data-act="resv-memo" data-pid="'+p.id+'" data-rid="'+r.id+'"'

           + '<span class="rmi">📝</span><span class="rmt">'+esc(r.memo||'메모 한 줄 추가')+'</span></button>';

  h += '</div><div class="resv-foot"><button class="btn ghost sm" data-act="resv-add" data-id="'+p.id+'">＋ 예약자 추가</button></div></div>';

/* v5: 글 댓글(1단계)은 고객 상태 선택 가능 · 대댓글은 상태 없이 진행 내용만 */
function cmtModeOf(item, ctx){
  if(ctx==='cust') return 'req';
  return 'opt';
}
function fmtReady(key, mode){
  var text = String(ui.drafts[key]||'').trim();
  var st = ui.cmtStatus[key]||'';
  if(mode==='req') return !!(text && st);
  if(mode==='opt') return !!(text || st);
  return !!text;
}
function statusPickHTML(key, mode){
  var sel = ui.cmtStatus[key]||'';
  var tip = mode==='req'? '상태를 골라야 등록돼요' : '통화 결과를 함께 남겨보세요';
  var h = '<div class="stpick"><div class="stpick-top">'
        + '<span class="stpick-lbl">통화 상태'+(mode==='req'?'<em>필수</em>':'<em class="opt">선택</em>')+'</span>'
        + '<span class="stpick-tip"'+(sel?' data-st="'+esc(sel)+'"':'')+' data-tip="'+esc(tip)+'">'+(sel? esc(sel)+' 선택됨' : tip)+'</span>'
        + '</div><div class="stpick-chips">';
  STATUSES.forEach(function(s){
    h += '<button type="button" class="st-chip sm '+(sel===s?'on':'')+'" data-st="'+s+'" data-act="cmt-st" data-key="'+key+'" data-st-for="'+s+'">'+s+'</button>';
  });
  return h+'</div></div>';
}

function threadHTML(item, ctx, open){
  if(!open) return '';
  var cs = item.comments||[];
  var key = ctx+':'+item.id;
  var att = ui.attach[key]||[];
  var mode = cmtModeOf(item, ctx);
  var h = '<div class="thread open">';
  if(!cs.length) h += '<div class="cmts"><div class="empty">아직 댓글이 없어요. 첫 댓글을 남겨보세요.</div></div>';
  else {
    var fold = cs.length>=CMT_FOLD_AT && !ui.openCmts[item.id];
    h += '<ul class="cmts">';
    cs.forEach(function(c, ci){ if(fold && ci>=2) return; h += cmtHTML(c, item.id, ctx, mode); });
    h += '</ul>';
    if(cs.length>=CMT_FOLD_AT){
      h += '<button class="rep-toggle cmt-more" data-act="cmts-toggle" data-key="'+item.id+'" aria-expanded="'+(fold?'false':'true')+'">'
         + (fold
             ? '💬 댓글 '+(cs.length-2)+'개 더 보기 <span class="chev">▾</span>'
             : '댓글 접기 <span class="chev">▴</span>')
         + '</button>';
    }
  }
  if(att.length){
    h += '<div class="attach">';
    att.forEach(function(a,i){
      h += '<span class="athumb"><img src="'+esc(a.src)+'" alt=""><button data-act="attach-del" data-key="'+key+'" data-i="'+i+'" aria-label="첨부 취소">×</button></span>';
    });
    h += '</div>';
  }
  var ph = ctx==='cust'
    ? '부재중·재통화 예정·상담 내용을 적어주세요'
    : '1단계 댓글 — 고객 번호·생년월일(예: 01037795774/970114)이나 상담 내용';
  h += '<form class="cbar" data-form="cmt" data-id="'+item.id+'" data-ctx="'+ctx+'" data-key="'+key+'" data-mode="'+mode+'">'
     + (mode? statusPickHTML(key, mode) : '')
     + '<div class="cbar-row">'
     + '<input name="text" data-draft="'+key+'" value="'+esc(ui.drafts[key]||'')+'" placeholder="'+ph+'" autocomplete="off">'
     + '<label class="icobtn" title="사진 첨부">📷<input type="file" accept="image/*" data-photo="cmt" data-key="'+key+'" hidden></label>'
     + '<button class="send" type="submit"'+(fmtReady(key,mode)?'':' disabled')+'>등록</button>'
     + '</div></form>';
  h += '</div>';
  return h;
}

function cmtHTML(c, parentId, ctx, mode){
  var reps = c.replies||[];
  var isPost = ctx==='post' && !c.sys;   /* v5: 글의 1단계 댓글만 상태 관리 */
  var rOpen = ui.replyOpen===c.id;
  var rExp = !!ui.openReplies[c.id];
  var h = '<li class="cmt '+(c.sys?'sys':'')+(isPost && c.st==='완료'?' cmt-done':'')+'">'
        + '<div class="cmt-head"><span class="av xs" style="--c:'+colorOf(c.author)+'">'+esc(initial(c.author))+'</span>'
        + '<b>'+esc(c.author)+'</b><time>'+fmtAt(c.at)+'</time>'
        + (!isPost && c.st? '<span class="cst" data-st="'+esc(c.st)+'">'+esc(c.st)+'</span>' : '')
        + (c.sys?'':'<button class="replybtn" data-act="reply-open" data-cid="'+c.id+'">답글</button>')+'</div>';
  if(c.text) h += '<p>'+esc(c.text)+'</p>';
  h += photoGrid(c.photos, 'sm');
  if(isPost) h += csegHTML(c, parentId);
  if(reps.length){
    h += '<button class="rep-toggle" data-act="rep-toggle" data-cid="'+c.id+'" aria-expanded="'+(rExp?'true':'false')+'">'
       + (rExp? '답글 접기 <span class="chev">▴</span>' : '답글 '+reps.length+'개 보기 <span class="chev">▾</span>')
       + '</button>';
    if(rExp){
      h += '<ul class="replies">';
      reps.forEach(function(r){
        h += '<li><span class="rav">↳</span><b>'+esc(r.author)+'</b>'
           + (r.st? '<i class="rst" data-st="'+esc(r.st)+'">'+esc(r.st)+'</i>' : '')
           + '<span>'+esc(r.text)+'</span><time>'+fmtAt(r.at)+'</time>'
           + photoGrid(r.photos,'sm')+'</li>';
      });
      h += '</ul>';
    }
  }
  if(rOpen){
    var rk = 'rp:'+c.id;
    /* v5: 대댓글은 직원 진행 보고 — 상태 칩 없이 내용만 */
    h += '<form class="cbar reply" data-form="reply" data-id="'+parentId+'" data-cid="'+c.id+'" data-ctx="'+ctx+'" data-key="'+rk+'" data-mode="">'
       + '<div class="cbar-row">'
       + '<input name="text" data-draft="'+rk+'" value="'+esc(ui.drafts[rk]||'')+'" placeholder="'+esc(c.author)+'님에게 진행 내용·사진 남기기" autocomplete="off">'
       + '<button class="send" type="submit"'+(fmtReady(rk,'')?'':' disabled')+'>등록</button>'
       + '<button class="send ghost" type="button" data-act="reply-close">취소</button>'
       + '</div></form>';
  }
  return h+'</li>';
}

/* ---------- band view ---------- */
function custMatch(c){
  if(ui.year!=='all' && String(c.day).slice(0,4)!==ui.year) return false;
  if(ui.month!=='all' && String(c.day).slice(5,7)!==ui.month) return false;
  if(ui.filter.indexOf('b:')===0){ if(c.bucket!==ui.filter.slice(2)) return false; }
  else if(ui.filter.indexOf('s:')===0){ if(c.status!==ui.filter.slice(2)) return false; }
  if(ui.q){
    var q = ui.q.replace(/\s+/g,'').toLowerCase();
    var hay = (c.name+' '+digits(c.phone)+' '+(c.memo||'')).toLowerCase();
    if(hay.indexOf(q)<0) return false;
  }
  return true;
}
function periodActive(){ return ui.year!=='all' || ui.month!=='all'; }
function periodCustomers(){
  if(!periodActive()) return state.customers.filter(function(c){ return c.day===todayStr(); });
  return state.customers.filter(function(c){
    if(ui.year!=='all' && String(c.day).slice(0,4)!==ui.year) return false;
    if(ui.month!=='all' && String(c.day).slice(5,7)!==ui.month) return false;
    return true;
  });
}
function periodLabel(){
  return (ui.year==='all'? '전체 연도' : ui.year+'년') + ' ' + (ui.month==='all'? '전체 월' : (+ui.month)+'월');
}
function periodHTML(){
  var years = {};
  state.customers.forEach(function(c){ years[String(c.day).slice(0,4)] = 1; });
  var yl = Object.keys(years).sort().reverse();
  var months = {};
  state.customers.forEach(function(c){
    if(ui.year!=='all' && String(c.day).slice(0,4)!==ui.year) return;
    months[String(c.day).slice(5,7)] = 1;
  });
  var ml = Object.keys(months).sort();
  var h = '<div class="periodbar"><span class="pb-lbl">📅 기간</span>'
        + '<label class="psel"><select data-act="fyear" aria-label="연도 선택">'
        +   '<option value="all"'+(ui.year==='all'?' selected':'')+'>전체 연도</option>'
        +   yl.map(function(y){ return '<option value="'+y+'"'+(ui.year===y?' selected':'')+'>'+y+'년</option>'; }).join('')
        + '</select></label>'
        + '<label class="psel"><select data-act="fmonth" aria-label="월 선택">'
        +   '<option value="all"'+(ui.month==='all'?' selected':'')+'>전체 월</option>'
        +   ml.map(function(m){ return '<option value="'+m+'"'+(ui.month===m?' selected':'')+'>'+(+m)+'월</option>'; }).join('')
        + '</select></label>';
  if(periodActive()){
    h += '<button class="pb-on" data-act="period-clear" aria-label="기간 초기화">'+periodLabel()+' 기준 <span class="pb-x">✕</span></button>';
  }
  return h+'</div>';
}
var SORT_RANK = {'미통화':0,'부재':1,'예약':2,'완료':3};
var BUCKET_RANK = {'730':0,'550':1,'3년':2};
function sortCust(a,b){
  var ba = BUCKET_RANK[a.bucket], bb = BUCKET_RANK[b.bucket];
  var br = (ba==null?9:ba)-(bb==null?9:bb);
  if(br) return br;
  var r = (SORT_RANK[a.status]||0)-(SORT_RANK[b.status]||0);
  if(r) return r;
  return String(a.name).localeCompare(String(b.name));
}
function lastAtOf(c){
  var at = c.at||'';
  (c.comments||[]).forEach(function(x){ if(String(x.at||'')>at) at = String(x.at); });
  return at;
}
function keepList(){
  return state.customers.filter(function(c){ return c.status==='부재' || c.keep; }).sort(function(a,b){
    if(a.day!==b.day) return String(b.day).localeCompare(String(a.day));
    var la = lastAtOf(a), lb = lastAtOf(b);
    if(la!==lb) return lb.localeCompare(la);
    return String(a.name).localeCompare(String(b.name));
  });
}
function lastMemoOf(c){
  var m = String(c.memo||'').trim();
  if(m) return m;
  var cs = c.comments||[];
  for(var i=cs.length-1;i>=0;i--){ if(cs[i].text && !cs[i].sys) return cs[i].text; }
  return '';
}

function bandView(){
  var t = todayStr();
  var todays = periodCustomers();
  var cnt = {};
  STATUSES.forEach(function(s){ cnt[s] = todays.filter(function(c){return c.status===s;}).length; });
  var done = cnt['완료'], total = todays.length;

  var days = [];
  state.customers.forEach(function(c){ if(days.indexOf(c.day)<0) days.push(c.day); });
  days.sort().reverse();

  var h = '<div class="statstrip">';
  STATUSES.forEach(function(s){
    var cls = (s==='완료'?'done':'');
    if(s==='미통화' && cnt[s]) cls += ' hot';
    if(s==='부재' && cnt[s]) cls += ' warm';
    h += '<button class="sstat '+cls+(ui.filter==='s:'+s?' on':'')+'" data-st="'+s+'" data-act="filter" data-f="s:'+s+'">'
       + '<span>'+s+'</span><b>'+cnt[s]+'</b></button>';
  });
  h += '</div>';

  var keeps = keepList();
  h += '<button class="keepbar '+(keeps.length?'':'zero')+'" data-act="keep-open">'
     +   '<span class="kb-ico">📵</span>'
     +   '<span class="kb-txt"><b>부재중 킵</b><small>부재중·킵 고객만 모아 바로 통화</small></span>'
     +   '<span class="kb-n">'+keeps.length+'</span>'
     +   '<span class="kb-go">열기 ›</span></button>';

  h += periodHTML();

  h += '<div class="filters">';
  FILTERS.forEach(function(f){
    var bcls = f.k.indexOf('b:')===0? ' '+bkCls(f.k.slice(2)) : '';
    h += '<button class="fchip'+bcls+' '+(ui.filter===f.k?'on':'')+'" data-act="filter" data-f="'+f.k+'">'+f.t+'</button>';
  });
  h += '<div class="ftools">'
     +   '<label class="qbox">🔍<input id="q" data-q placeholder="이름·번호" value="'+esc(ui.q)+'" autocomplete="off"></label>'
     +   '<button class="maskbtn '+(ui.mask?'on':'')+'" data-act="mask" aria-label="번호 가림">'+(ui.mask?'🔓':'🔒')+'</button>'
     + '</div>';
  h += '</div>';

  var cards = days.map(function(d){ return dayCard(d); }).filter(Boolean).join('');
  h += '<div class="daylist">'+(cards || '<div class="emptycard">조건에 맞는 명단이 없어요.<br>오른쪽 아래 <b>＋</b> 버튼으로 고객을 추가해보세요.</div>')+'</div>';
  return h;
}

function dayCard(day){
  var all = state.customers.filter(function(c){return c.day===day;});
  var list = all.filter(custMatch).sort(sortCust);
  if(!list.length) return '';
  var done = all.filter(function(c){return c.status==='완료';}).length;
  var left = all.length - done;
  var isToday = day===todayStr();
  var tag = isToday? '<span class="bk">오늘</span>' : (day===shiftDay(-1)? '<span class="bk">어제</span>':'');
  var h = '<section class="day" data-day="'+day+'">'
        + '<div class="day-head">'
        +   '<div class="dh-date"><b>'+fmtDayLabel(day)+'</b>'+tag+'</div>'
        +   '<div class="dh-done '+(left?'':'all-done')+'">'+(left? '남은 <b>'+left+'</b>' : '모두 완료')+'</div>'
        +   '<button class="day-add" data-act="add-cust" data-day="'+day+'" aria-label="이 날짜에 명단 추가">＋</button>'
        + '</div><div class="cust-list">'
        + list.map(custRow).join('')
        + '</div></section>';
  return h;
}

function custRow(c){
  var n = (c.comments||[]).length;
  var editing = ui.memoEdit===c.id;
  var ownerOpts = STAFF.map(function(s){ return '<option '+(c.owner===s?'selected':'')+'>'+esc(s)+'</option>'; }).join('')
    + (STAFF.indexOf(c.owner)<0? '<option selected>'+esc(c.owner||'미지정')+'</option>':'');
  var h = '<div class="cust '+(c.status==='완료'?'is-done':'')+'" data-id="'+c.id+'" data-st="'+esc(c.status)+'">';
  h += '<div class="c-top"><span class="c-name">'+esc(c.name)+bkBadge(c.bucket)+'</span>'
     +   '<button class="kpin '+(c.keep?'on':'')+'" data-act="keep-toggle" data-id="'+c.id+'" title="부재중 킵" aria-label="부재중 킵">📌</button>'
     + '</div>';
  h += segHTML(c);
  h += '<div class="c-mid">'
     +   (digits(c.phone)

/* ================= photos ================= */
function compressImage(file, maxSide, targetKB){
  maxSide = maxSide || 1200;
  targetKB = targetKB || 150;
  return new Promise(function(resolve, reject){
    if(!file || !/^image\//.test(file.type)){ reject(new Error('이미지 파일이 아니에요')); return; }
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      try{
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxSide/Math.max(w,h));
        w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        var q = 0.74, data = cv.toDataURL('image/jpeg', q);
        while(data.length > targetKB*1400 && q > 0.34){
          q -= 0.08;
          data = cv.toDataURL('image/jpeg', q);
        }
        URL.revokeObjectURL(url);
        resolve({src:data, name:file.name||'사진'});
      }catch(err){ URL.revokeObjectURL(url); reject(err); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('사진을 읽지 못했어요')); };
    img.src = url;
  });
}
function handleFiles(input){
  var files = [];
  try{ files = Array.prototype.slice.call(input.files||[]); }catch(e){}
  if(!files.length) return;
  toast('사진 처리 중…');
  var jobs = files.slice(0,10).map(function(f){ return compressImage(f).catch(function(){ return null; }); });
  Promise.all(jobs).then(function(list){
    var out = list.filter(Boolean);
    if(!out.length){ toast('사진을 읽지 못했어요. 다른 사진으로 시도해 주세요.', true); return; }
    if(input.getAttribute('data-photo')==='composer'){
      ui.composer.photos = (ui.composer.photos||[]).concat(out);
    } else {
      var key = input.getAttribute('data-key');
      ui.attach[key] = (ui.attach[key]||[]).concat(out);
    }
    input.value = '';
    render();
    toast(out.length+'장 첨부했어요');
  });
}

function applyCustStatus(c, st){
  if(!c || !st || c.status===st) return false;
  var prev = c.status;
  c.status = st;
  c.comments = c.comments||[];
  c.comments.push(sysCmt('통화상태 '+prev+' → '+st));
  return true;
}
function keepStatus(id, st){
  var c = findCust(id);
  if(!c) return;
  if(st==='미통화'){
    if(c.status==='부재') applyCustStatus(c, '미통화');
    c.keep = false;
    save(); render();
    toast('부재중 킵에서 뺐어요');
    return;
  }
  applyCustStatus(c, st);
  c.keep = false;
  save(); render();
  toast(c.name+' · '+st+'으로 넘겼어요');
}
function keepTry(id){
  var c = findCust(id);
  if(!c) return;
  var prev = c.status;
  c.tries = (c.tries||0)+1;
  c.comments = c.comments||[];
  if(prev!=='부재'){
    c.status = '부재';
    c.comments.push(sysCmt('통화상태 '+prev+' → 부재'));
  }
  c.comments.push(sysCmt('부재 통화 '+c.tries+'회차 — 재통화 필요'));
  save(); render();
  toast(c.name+' · 부재 '+c.tries+'회 기록');
}

  if(isRes){

    p.reservations = [];
    if(!title) p.title = '사전예약 접수 명단';
  }
  state.posts.push(p);
  ui.drafts['cmp:title'] = '';
  ui.drafts['cmp:body'] = '';
  ui.composer = {kind:'consult', photos:[], pin:false};
  ui.tab = 'notice';
  save();
  closeSheet();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
  if(isRes){
    openSheet({type:'post', id:p.id});
    toast(p.pinned? '사전예약 공지를 상단 고정으로 올렸어요 — 예약자를 바로 추가하세요' : '사전예약 공지를 올렸어요 — 예약자를 바로 추가하세요');
  } else {
    toast(p.pinned? '공지로 등록했어요' : '글을 등록했어요');
  }
}
/* v5: 1단계 댓글(고객) 상태를 1탭으로 — 완료면 그 댓글 블록을 회색으로 마감 */
function setCmtStatus(pid, cid, st, el){
  var p = findPost(pid);
  if(!p) return;
  var c = null;
  (p.comments||[]).forEach(function(x){ if(x.id===cid) c = x; });
  if(!c || c.st===st) return;
  c.st = st; c.stBy = session.staff; c.stAt = nowAt();
  save();
  var li = el && el.closest? el.closest('.cmt') : null;
  if(li){
    li.classList.toggle('cmt-done', st==='완료');
    var bs = li.querySelectorAll('.cseg-b');
    for(var i=0;i<bs.length;i++){
      var on = bs[i].getAttribute('data-st')===st;
      bs[i].classList.toggle('on', on);
      bs[i].setAttribute('aria-pressed', on? 'true':'false');
    }
  }
  toast('댓글 상태 · '+st);
}
/* v5: 사전예약 예약자 한 줄 메모 */
function saveResvMemo(pid, rid){
  var p = findPost(pid);
  if(!p){ toast('공지를 찾지 못했어요.', true); return; }
  var r = (p.reservations||[]).filter(function(x){ return x.id===rid; })[0];
  if(!r){ toast('예약자를 찾지 못했어요.', true); return; }
  var el = $('rmemo_'+rid);
  if(el) r.memo = String(el.value||'').trim();
  ui.resvMemo = null;
  save(); render();
  toast(r.memo? '메모를 저장했어요' : '메모를 지웠어요');
}
function openResvMemo(pid, rid){
  ui.resvMemo = rid;
  render();
  setTimeout(function(){
    var el = $('rmemo_'+rid);
    if(el) try{ el.focus({preventScroll:true}); el.setSelectionRange(el.value.length, el.value.length); }catch(e){}
  }, 70);
}
function changeStatus(id, st){
  var c = findCust(id);
  if(!c || c.status===st) return;
  var prev = c.status;
  c.status = st;
  c.comments = c.comments||[];
  c.comments.push(sysCmt('통화상태 '+prev+' → '+st));
  save(); render();
  toast(c.name+' · '+st);
}
/* v4: 명단 안 4칸 세그먼트를 누를 때 — 화면 그 자리에서 바로 바꿔 명단 순서가 튀지 않게 */
function inlineStatus(id, st, el){
  var c = findCust(id);
  if(!c || c.status===st) return;
  var prev = c.status;
  c.status = st;
  c.comments = c.comments||[];
  c.comments.push(sysCmt('통화상태 '+prev+' → '+st));
  save();
  var row = el && el.closest? el.closest('.cust') : null;
  if(!row) row = document.querySelector('.cust[data-id="'+id+'"]');
  if(row){
    row.setAttribute('data-st', st);
    row.classList.toggle('is-done', st==='완료');
    var bs = row.querySelectorAll('.seg-b');
    for(var i=0;i<bs.length;i++){
      var on = bs[i].getAttribute('data-st')===st;
      bs[i].classList.toggle('on', on);
      bs[i].setAttribute('aria-pressed', on? 'true':'false');
    }
    var cnt = row.querySelector('.c-cmt');
    if(cnt) cnt.textContent = '💬 '+(c.comments||[]).length;
  }
  updateCounts();
  toast(c.name+' · '+st);
}
function updateCounts(){
  if(!session) return;
  var list = periodCustomers();
  var n = {};
  STATUSES.forEach(function(s){ n[s] = list.filter(function(c){ return c.status===s; }).length; });
  var stats = document.querySelectorAll('.sstat');
  for(var i=0;i<stats.length;i++){
    var s = stats[i].getAttribute('data-st');
    var b = stats[i].querySelector('b');
    if(b && n[s]!=null) b.textContent = n[s];
  }
  var left = list.filter(function(c){ return c.status!=='완료'; }).length;
  var t2 = $('t2n'); if(t2) t2.textContent = left? left : '';
  var kb = document.querySelector('.keepbar .kb-n');
  if(kb) kb.textContent = keepList().length;
  var days = document.querySelectorAll('.day[data-day]');
  for(var j=0;j<days.length;j++){
    var day = days[j].getAttribute('data-day');
    var all = state.customers.filter(function(c){ return c.day===day; });
    var dn = all.filter(function(c){ return c.status==='완료'; }).length;
    var rest = all.length - dn;
    var hd = days[j].querySelector('.dh-done');
    if(hd){
      hd.innerHTML = rest? '남은 <b>'+rest+'</b>' : '모두 완료';
      hd.classList.toggle('all-done', !rest);
    }
  }
}
function saveMemo(id){
  var c = findCust(id);
  if(!c) return;
  var el = $('memo_'+id);
  if(el) c.memo = String(el.value||'').trim();
  ui.memoEdit = null;
  save(); render();
  toast('메모를 저장했어요');
}
function exportData(){
  var payload = {app:'kt-band-manager', store:'충주 KT대리점 칠금점', exportedAt:new Date().toISOString(), data:state};
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '칠금점-가망고객밴드-'+todayStr()+'.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1200);
  toast('JSON 파일로 내보냈어요');
}
function resetData(){
  if(!confirm('샘플 데이터로 초기화할까요?\n지금까지 적은 글·댓글·명단이 모두 사라집니다. (먼저 내보내기로 백업할 수 있어요)')) return;
  state = seed();
  ui.openThreads = {};

  ui.openReplies = {};
  ui.openCmts = {};
  ui.replyOpen = null;
  ui.drafts = {};
  ui.attach = {};
  ui.memoEdit = null;
  ui.resvMemo = null;
  save(); closeSheet(); render();
  toast('샘플 데이터로 초기화했어요');
}
function logout(){
  session = null;
  saveSession(null);
  closeSheet();
  $('app').hidden = true;
  $('login').hidden = false;
  ui.loginStaff = '김태양';

/* ================= events ================= */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var act = el.getAttribute('data-act');

  switch(act){
    case 'tab': setTab(el.getAttribute('data-tab')); break;
    case 'compose': compose(); break;
    case 'menu': openSheet({type:'menu'}); break;
    case 'close': closeSheet(); break;
    case 'staff-switch':
      closeSheet(); session=null; saveSession(null);
      $('app').hidden = true; $('login').hidden = false;
      clearPin(); renderLogin();
      break;
    case 'logout': logout(); break;
    case 'export': exportData(); break;
    case 'reset': resetData(); break;
    case 'pin-toggle': ui.pinOpen = !ui.pinOpen; render(); break;
    case 'filter':
      var f = el.getAttribute('data-f');
      ui.filter = (ui.filter===f && f!=='all')? 'all' : f;
      render(); break;
    case 'mask': ui.mask = !ui.mask; render(); toast(ui.mask?'번호를 가렸어요':'번호를 표시해요'); break;
    case 'period-clear':
      ui.year = 'all'; ui.month = 'all'; render();
      toast('기간을 초기화했어요'); break;
    case 'thread-toggle':
      var tid = el.getAttribute('data-id');
      if(ui.openThreads[tid]) delete ui.openThreads[tid]; else ui.openThreads[tid]=true;
      render(); break;
    case 'cmts-toggle':
      var cmk = el.getAttribute('data-key');
      if(ui.openCmts[cmk]) delete ui.openCmts[cmk]; else ui.openCmts[cmk] = true;
      render();
      break;
    case 'open-post': openSheet({type:'post', id: el.getAttribute('data-id')}); break;
    case 'post-menu': openSheet({type:'postmenu', id: el.getAttribute('data-id')}); break;
    case 'post-done':
      var pd = findPost(el.getAttribute('data-id'));
      if(pd){
        pd.done = !pd.done; save();
        if(sheetSpec && sheetSpec.type==='postmenu') closeSheet();
        render();
        toast(pd.done?'완료 처리했어요':'완료를 취소했어요');
      }
      break;
    case 'post-pin':
      var pp = findPost(el.getAttribute('data-id'));
      if(pp){
        pp.pinned = !pp.pinned; save();
        if(sheetSpec && sheetSpec.type==='postmenu') closeSheet();
        render();
        toast(pp.pinned?'맨 위 공지로 고정했어요':'고정을 해제했어요');
      }
      break;
    case 'photo':
      var img = el.querySelector('img') || el;
      openLB(img.getAttribute('src'));
      break;
    case 'close-lb': closeLB(); break;
    case 'reply-open':
      var roc = el.getAttribute('data-cid');
      ui.replyOpen = roc;
      ui.openReplies[roc] = true;
      render();
      setTimeout(function(){
        var f2 = document.querySelector('form[data-form="reply"] input');
        if(f2) try{ f2.focus({preventScroll:true}); }catch(e){}
      }, 60);
      break;
    case 'rep-toggle':
      var rtc = el.getAttribute('data-cid');
      if(ui.openReplies[rtc]) delete ui.openReplies[rtc]; else ui.openReplies[rtc] = true;
      render(); break;
    case 'reply-close': ui.replyOpen = null; render(); break;
    case 'cust': openSheet({type:'cust', id: el.getAttribute('data-id')}); break;
    case 'keep-open': openSheet({type:'keep'}); break;
    case 'keep-toggle':
      var kc = findCust(el.getAttribute('data-id'));
      if(kc){
        kc.keep = !kc.keep; save(); render();
        toast(kc.keep? kc.name+'님을 부재중 킵에 꽂았어요' : '킵을 해제했어요');
      }
      break;
    case 'keep-status': keepStatus(el.getAttribute('data-id'), el.getAttribute('data-st')); break;
    case 'keep-try': keepTry(el.getAttribute('data-id')); break;
    case 'keep-memo':
      ui.keepMemo = el.getAttribute('data-id'); render();
      setTimeout(function(){
        var km = $('kmemo_'+ui.keepMemo);
        if(km) try{ km.focus({preventScroll:true}); km.setSelectionRange(km.value.length, km.value.length); }catch(e){}
      }, 60);
      break;
    case 'keep-memo-cancel': ui.keepMemo = null; render(); break;
    case 'keep-memo-save': saveKeepMemo(el.getAttribute('data-id')); break;
    case 'cmt-st':
      var sk = el.getAttribute('data-key'), sv = el.getAttribute('data-st-for');
      if(ui.cmtStatus[sk]===sv) delete ui.cmtStatus[sk]; else ui.cmtStatus[sk] = sv;
      var curSt = ui.cmtStatus[sk]||'';
      var sf = el.closest('form');
      if(sf){
        var schips = sf.querySelectorAll('.st-chip.sm');
        for(var si=0; si<schips.length; si++) schips[si].classList.toggle('on', schips[si].getAttribute('data-st-for')===curSt);
        var stip = sf.querySelector('.stpick-tip');
        if(stip){
          if(curSt){ stip.textContent = curSt+' 선택됨'; stip.setAttribute('data-st', curSt); }
          else { stip.textContent = stip.getAttribute('data-tip')||''; stip.removeAttribute('data-st'); }
        }
        syncFormBtn(sf);
      }
      break;
    case 'status-menu': openSheet({type:'status', id: el.getAttribute('data-id')}); break;
    case 'status':
      var sEl = el, sId = el.getAttribute('data-id'), sSt = el.getAttribute('data-st');
      if(sEl.classList.contains('seg-b') && sEl.closest('.cust')) inlineStatus(sId, sSt, sEl);
      else changeStatus(sId, sSt);
      break;
    case 'status-pick':
      changeStatus(el.getAttribute('data-id'), el.getAttribute('data-st'));
      closeSheet();
      break;
    case 'memo-edit':
      ui.memoEdit = el.getAttribute('data-id'); render();
      setTimeout(function(){
        var m = $('memo_'+ui.memoEdit);
        if(m) try{ m.focus({preventScroll:true}); m.setSelectionRange(m.value.length, m.value.length); }catch(e){}
      }, 60);
      break;
    case 'memo-save': saveMemo(el.getAttribute('data-id')); break;
    case 'memo-cancel': ui.memoEdit = null; render(); break;
    case 'add-cust': openSheet({type:'custadd', day: el.getAttribute('data-day') || todayStr()}); break;
    case 'resv-add': openSheet({type:'resv', id: el.getAttribute('data-id')}); break;
    case 'resv-del':
      var rp = findPost(el.getAttribute('data-pid'));
      if(rp){
        var rid = el.getAttribute('data-rid');
        var target = (rp.reservations||[]).filter(function(r){ return r.id===rid; })[0];
        if(!target) break;
        if(!confirm((target.name||'이 예약')+' 님 예약을 명단에서 지울까요?')) break;
        rp.reservations = (rp.reservations||[]).filter(function(r){ return r.id!==rid; });
        save(); render(); toast('예약을 삭제했어요');
      }
      break;
    case 'attach-del':
      var k = el.getAttribute('data-key'), ix = +el.getAttribute('data-i');
      if(ui.attach[k]){ ui.attach[k].splice(ix,1); if(!ui.attach[k].length) delete ui.attach[k]; }
      render(); break;
    case 'cmp-photo-del':
      ui.composer.photos.splice(+el.getAttribute('data-i'),1); render(); break;
    case 'cmp-kind':
      var nk = el.getAttribute('data-k');
      if(ui.composer.kind!==nk){
        ui.composer.kind = nk;
        ui.composer.pin = (nk==='reserve');   /* 사전예약 공지는 기본 상단 고정 */
      }
      render(); break;
    case 'cmt-status':
      setCmtStatus(el.getAttribute('data-pid'), el.getAttribute('data-cid'), el.getAttribute('data-st'), el);
      break;
    case 'resv-memo': openResvMemo(el.getAttribute('data-pid'), el.getAttribute('data-rid')); break;
    case 'resv-memo-save': saveResvMemo(el.getAttribute('data-pid'), el.getAttribute('data-rid')); break;
    case 'resv-memo-cancel': ui.resvMemo = null; render(); break;
    case 'submit-post': submitPost(); break;
    case 'staff':
      ui.loginStaff = el.getAttribute('data-name');
      renderLogin(); break;
    case 'key': pressKey(el.getAttribute('data-k')); break;
    case 'pin-focus':
      var pi = $('pinInput'); if(pi) try{ pi.focus({preventScroll:true}); }catch(e){}
      break;
  }
});

document.addEventListener('input', function(e){

  if(t.id==='q'){ ui.q = t.value; render(); return; }
  var dk = t.getAttribute && t.getAttribute('data-draft');
  if(dk){ ui.drafts[dk] = t.value; }
