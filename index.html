<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KT 충주 KT대리점 칠금점 · 가망고객 밴드</title>
<meta name="theme-color" content="#0B57D0">
<meta name="description" content="충주 KT대리점 칠금점 가망고객 밴드 — 공지·상담놓침·730/550/3년 명단·사전예약을 직원끼리 공유하는 웹앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="칠금점 밴드">
<style>
  :root{
    --blue-800:#083A8C; --blue-700:#0A45A8; --blue-600:#0B57D0; --blue-500:#2F7BE5; --blue-100:#D9E7FF; --blue-50:#EEF4FF;
    --ink:#0F172A; --slate-700:#334155; --slate-600:#475569; --slate-500:#64748B; --slate-400:#94A3B8;
    --line:#E3EAF3; --line-strong:#D2DCEA; --bg:#F4F7FB; --card:#FFFFFF;
    --green:#0E7C5A; --green-bg:#E6F6EF; --amber:#9A5B00; --amber-bg:#FFF3DC; --red:#B42318; --red-bg:#FDECE9;
    --violet:#5B3FC4; --violet-bg:#EFEBFF; --teal:#0F766E; --teal-bg:#E6F5F3; --pink:#C2185B; --pink-bg:#FDEBF3;
    --radius:16px;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 12px 28px -22px rgba(15,23,42,.45);
    --shadow-lg:0 24px 60px -24px rgba(15,23,42,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
  }
  body.lock{overflow:hidden}
  [hidden]{display:none !important}
  h1,h2,h3,p,ul,ol{margin:0}
  button{font-family:inherit;cursor:pointer}
  a{color:var(--blue-700);text-decoration:none}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
  ::selection{background:#CFE0FF}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;
    border-radius:11px;border:1px solid var(--line-strong);background:#fff;color:var(--slate-700);
    font-size:13.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;transition:.14s}
  .btn:hover{border-color:#B9C9E0;background:#FBFDFF}
  .btn.primary{background:linear-gradient(180deg,#1A66DE,#0B57D0);border-color:#0B57D0;color:#fff;box-shadow:0 10px 20px -14px rgba(11,87,208,.9)}
  .btn.primary:hover{background:linear-gradient(180deg,#1E6EE8,#0A4EBC)}
  .btn.ghost{background:#F7F9FC;border-color:var(--line);color:var(--slate-600)}
  .btn.sm{height:34px;padding:0 11px;font-size:12.5px;border-radius:9px}
  .btn.lg{height:50px;font-size:15.5px;border-radius:13px;width:100%}
  .mini{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:8px;border:1px solid var(--line-strong);
    background:#fff;color:var(--slate-500);font-size:11.5px;font-weight:700;white-space:nowrap}
  .mini:hover{border-color:#B9C9E0;color:var(--slate-700)}
  .mini.on{background:var(--green-bg);border-color:#B7E4D1;color:var(--green)}
  .linkbtn{background:none;border:0;padding:0;color:var(--blue-700);font-size:12.5px;font-weight:700}
  .linkbtn:hover{text-decoration:underline}
  .pill{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:999px;background:var(--blue-50);
    color:var(--blue-700);font-size:11px;font-weight:800;letter-spacing:-.01em}
  .hide-xs{display:inline}

  /* ---------- login ---------- */
  .login{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:18px;overflow:auto;
    background:radial-gradient(1200px 600px at 50% -10%,#DCE9FF 0%,#F4F7FB 55%,#F4F7FB 100%)}
  .login-card{width:100%;max-width:392px;background:#fff;border-radius:22px;box-shadow:var(--shadow-lg);overflow:hidden;
    border:1px solid #E8EFF9}
  .login-top{padding:26px 22px 20px;text-align:center;background:linear-gradient(160deg,#0B57D0,#083A8C);color:#fff}
  .lmark{width:52px;height:52px;border-radius:15px;margin:0 auto 12px;display:grid;place-items:center;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);font-weight:800;font-size:21px;letter-spacing:-.05em}
  .login-top h1{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .login-top p{margin-top:3px;font-size:12px;color:#C9DCFA;font-weight:600;letter-spacing:.01em}
  .login-body{padding:18px 18px 20px}
  .lbl{display:block;font-size:11.5px;font-weight:800;color:var(--slate-500);letter-spacing:.02em;margin:4px 0 7px}
  .staff-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
  .staff-chip{height:46px;border-radius:12px;border:1px solid var(--line-strong);background:#FBFCFE;font-weight:700;
    font-size:14px;color:var(--slate-600);display:flex;align-items:center;justify-content:center;gap:7px;transition:.14s}
  .staff-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,#94A3B8)}
  .staff-chip.on{background:var(--blue-50);border-color:#8FB6F0;color:var(--blue-700);box-shadow:inset 0 0 0 1px #8FB6F0}
  .pindots{display:flex;justify-content:center;gap:14px;padding:8px 0 12px}
  .pindots i{width:13px;height:13px;border-radius:50%;background:#E6ECF5;border:1px solid #D8E2F0;transition:.12s}
  .pindots i.on{background:var(--blue-600);border-color:var(--blue-600);transform:scale(1.08)}
  .pininput{position:absolute;opacity:0;width:1px;height:1px;border:0;padding:0}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .keypad button{height:50px;border-radius:12px;border:1px solid var(--line);background:#F8FAFD;font-size:19px;font-weight:700;color:var(--slate-700)}
  .keypad button:active{background:var(--blue-50);border-color:#A9C6F1}
  .keypad button.fn{font-size:13px;font-weight:800;color:var(--slate-500)}
  .lerr{min-height:16px;margin-top:9px;text-align:center;font-size:12px;font-weight:700;color:var(--red)}
  .shake{animation:shake .32s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  .login-note{margin-top:10px;text-align:center;font-size:11px;color:var(--slate-400);line-height:1.6}

  /* ---------- topbar ---------- */
  .topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:9px 16px 7px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 auto}
  .brand-mark{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff;font-weight:800;
    font-size:15px;letter-spacing:-.05em;background:linear-gradient(160deg,#2F7BE5,#083A8C);box-shadow:0 8px 16px -10px rgba(11,87,208,.95)}
  .brand-text{min-width:0}
  .brand-text h1{font-size:15px;font-weight:800;letter-spacing:-.03em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-text p{margin-top:2px;font-size:10.5px;font-weight:700;color:var(--slate-500);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topacts{display:flex;align-items:center;gap:7px;flex:none}
  .who{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 9px 0 5px;border-radius:999px;border:1px solid var(--line);
    background:#fff;font-size:12.5px;font-weight:800;color:var(--slate-700)}
  .who:hover{border-color:#B9C9E0}
  .av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--c,#0B57D0);
    color:#fff;font-weight:800;font-size:13px;letter-spacing:-.02em}
  .av.xs{width:24px;height:24px;border-radius:8px;font-size:10.5px}
  .tabbar{max-width:1180px;margin:0 auto;padding:0 16px 9px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:1 1 0;min-width:max-content;height:42px;padding:0 12px;border-radius:11px;border:1px solid var(--line);
    background:#F7F9FC;color:var(--slate-600);font-size:13px;font-weight:700;letter-spacing:-.02em;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.14s}
  .tab:hover{border-color:#C7D5E8}
  .tab.on{background:#fff;border-color:#9DBDF0;color:var(--blue-700);box-shadow:0 8px 18px -15px rgba(11,87,208,.9)}
  .tab .n{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:18px;padding:0 5px;
    border-radius:999px;background:var(--blue-600);color:#fff;font-size:10.5px;font-weight:800}
  .tab .n:empty{display:none}
  .tab.on .n{background:var(--blue-600)}
  .tab.t2 .n{background:var(--red)}
  @media (min-width:760px){ .tab{flex:0 0 auto;min-width:168px;padding:0 18px} }

  /* ---------- layout ---------- */
  .page{max-width:1180px;margin:0 auto;padding:14px 16px 70px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
  @media (min-width:1080px){
    .page{grid-template-columns:minmax(0,1fr) 312px;gap:20px}
    .rail{position:sticky;top:112px;display:grid;gap:12px}
  }
  @media (max-width:1079px){ .rail{display:none} }
  main{min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

  /* ---------- view head ---------- */
  .viewhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:11px;flex-wrap:wrap}
  .viewhead h2{font-size:17px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:6px}
  .viewhead p{margin-top:3px;font-size:12px;color:var(--slate-500);font-weight:600}
  .vactions{display:flex;gap:6px;align-items:center}

  /* ---------- chips ---------- */
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:#fff;color:var(--slate-600);
    font-size:12px;font-weight:700;white-space:nowrap}
  .chip:hover{border-color:#B9C9E0}
  .chip.on{background:var(--blue-600);border-color:var(--blue-600);color:#fff;box-shadow:0 8px 16px -12px rgba(11,87,208,.95)}
  .chip .c{opacity:.7;font-weight:800;margin-left:4px;font-size:11px}
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}

  /* ---------- notice pin block ---------- */
  .pinblock{background:linear-gradient(180deg,#FFF9EC 0%,#FFFDF8 100%);border:1px solid #F4E2B8;border-radius:18px;
    padding:12px 12px 13px;margin-bottom:13px;box-shadow:0 12px 26px -24px rgba(154,91,0,.6)}
  .pin-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
  .pin-head h2{font-size:14px;font-weight:800;letter-spacing:-.03em;color:#7A4700;display:flex;align-items:center;gap:6px}
  .pin-head .pill{background:#FFEFC9;color:#8A5200}
  .pin-list{margin-top:9px;display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
  .pinblock.closed .pin-list{display:none}
  .pin-item{width:100%;text-align:left;background:#fff;border:1px solid #F1DFB9;border-radius:13px;padding:10px 11px;
    display:grid;gap:4px;transition:.13s}
  .pin-item:hover{border-color:#E4C98E;box-shadow:0 10px 20px -20px rgba(154,91,0,.7)}
  .pi-top{display:flex;align-items:center;gap:6px;min-width:0}
  .pi-title{font-size:13px;font-weight:800;letter-spacing:-.02em;color:#3B2A10;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .pi-meta{font-size:11.5px;color:#8A7350;font-weight:600;display:flex;gap:6px;flex-wrap:wrap}
  .pi-right{display:flex;align-items:center;gap:6px;flex:none}
  .pcount{font-size:10.5px;font-weight:800;color:#8A5200;background:#FFF1D2;border-radius:6px;padding:2px 6px;white-space:nowrap}

  /* ---------- badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 7px;border-radius:6px;font-size:10.5px;font-weight:800;letter-spacing:-.01em;flex:none}
  .b-consult{background:var(--red-bg);color:#9A2A16}
  .b-notice{background:var(--amber-bg);color:#8A5200}
  .b-memo{background:var(--teal-bg);color:var(--teal)}
  .b-reserve{background:var(--pink-bg);color:var(--pink)}
  .b-done{background:var(--green-bg);color:var(--green)}
  .pinbadge{font-size:9.5px;font-weight:800;color:#8A5200;background:#FFF1D2;border-radius:5px;padding:1px 5px}
  .donebadge{font-size:9.5px;font-weight:800;color:var(--green);background:var(--green-bg);border-radius:5px;padding:1px 5px}
  .bk{display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:6px;font-size:10.5px;font-weight:800;flex:none;letter-spacing:-.01em}
  .bk-730{background:var(--blue-50);color:var(--blue-700)}
  .bk-550{background:var(--teal-bg);color:var(--teal)}
  .bk-3y{background:var(--violet-bg);color:var(--violet)}
  .tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;background:var(--blue-50);
    color:var(--blue-700);font-size:10.5px;font-weight:800}
  .tag.today{background:var(--red-bg);color:#9A2A16}

  /* ---------- posts ---------- */
  .feed{display:grid;grid-template-columns:minmax(0,1fr);gap:11px}
  .post{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:13px;box-shadow:var(--shadow)}
  .post.isdone{background:#FCFEFD;border-color:#DFEEE7}
  .post-head{display:flex;align-items:flex-start;gap:9px}
  .post-head .who{display:block;flex:1;min-width:0;background:none;border:0;height:auto;padding:0;border-radius:0}
  .wname{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;letter-spacing:-.02em}
  .wmeta{margin-top:2px;font-size:11.5px;color:var(--slate-500);font-weight:600}
  .post-title{margin:9px 0 0;font-size:14.5px;font-weight:800;letter-spacing:-.025em;line-height:1.4}
  .post-body{margin:5px 0 0;font-size:13.5px;line-height:1.62;color:var(--slate-700);white-space:pre-wrap;word-break:break-word}
  .post-title + .post-body{margin-top:4px}
  .post-body:empty{display:none}
  .post-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}

  .pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:9px}
  .pgrid.one{grid-template-columns:minmax(0,1fr)}
  .pgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pgrid.one .pcell img{aspect-ratio:16/10;max-height:260px}
  .pcell{position:relative;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#F1F5F9;display:block;width:100%}
  .pcell img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
  .pgrid.sm .pcell{width:74px;border-radius:8px}
  .pgrid.sm .pcell img{aspect-ratio:1}
  .pgrid.sm{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

  /* ---------- threads ---------- */
  .thread{margin-top:9px;border-top:1px solid var(--line)}
  .cmts{list-style:none;padding:0;margin:0}
  .cmts li.empty{padding:11px 2px;font-size:12.5px;color:var(--slate-400);font-weight:600}
  .cmt{padding:9px 0;border-bottom:1px dashed #EDF2F8;position:relative}
  .cmt:last-child{border-bottom:0}
  .cmt-head{display:flex;align-items:center;gap:6px;font-size:12px;flex-wrap:wrap}
  .cmt-head b{font-weight:800;letter-spacing:-.01em}
  .cmt-head time{color:var(--slate-400);font-size:11px;font-weight:700}
  .replybtn{margin-left:auto;background:none;border:0;padding:0 2px;font-size:11px;font-weight:800;color:var(--slate-400)}
  .replybtn:hover{color:var(--blue-700)}
  .cmt p{margin:3px 0 0 0;font-size:13px;line-height:1.58;white-space:pre-wrap;word-break:break-word;color:var(--slate-700)}
  .cmt.sys p{color:var(--slate-500);font-size:12px;font-style:normal}
  .cmt.sys .cmt-head b{color:var(--slate-500)}
  .replies{list-style:none;margin:5px 0 0;padding:2px 0 0 10px;border-left:2px solid var(--line-strong)}
  .replies li{font-size:12.5px;line-height:1.55;padding:3px 0;color:var(--slate-700);word-break:break-word}
  .replies li b{font-weight:800;margin-right:4px}
  .replies li time{color:var(--slate-400);font-size:10.5px;margin-left:5px;font-weight:700}
  .rav{color:var(--slate-400);font-weight:800;margin-right:4px}
  .more{display:block;width:100%;margin:8px 0 0;padding:6px 0;border:1px dashed var(--line-strong);border-radius:9px;
    background:#FBFCFE;color:var(--slate-500);font-size:11.5px;font-weight:800}
  .more:hover{color:var(--blue-700);border-color:#B9CFEF}

  .cbar{display:flex;align-items:center;gap:5px;margin-top:8px}
  .cbar input{flex:1;min-width:0;height:37px;border-radius:10px;border:1px solid var(--line-strong);background:#FBFCFE;
    padding:0 10px;font-size:13px}
  .cbar input:focus{outline:none;border-color:#8FB6F0;background:#fff;box-shadow:0 0 0 3px #EAF2FF}
  .cbar .send{height:37px;padding:0 12px;border-radius:10px;border:1px solid var(--blue-600);background:var(--blue-600);
    color:#fff;font-size:12.5px;font-weight:800;flex:none}
  .cbar .send.ghost{background:#fff;color:var(--slate-500);border-color:var(--line-strong)}
  .cbar.reply{padding-left:10px}
  .icobtn{width:37px;height:37px;flex:none;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line-strong);
    background:#F8FAFD;font-size:15px;cursor:pointer}
  .icobtn:hover{border-color:#B9C9E0}
  .attach{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .athumb{position:relative;display:block;width:60px;height:60px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .athumb img{width:100%;height:100%;object-fit:cover}
  .athumb button{position:absolute;top:1px;right:1px;width:17px;height:17px;border-radius:50%;border:0;background:rgba(15,23,42,.72);
    color:#fff;font-size:10px;line-height:1;padding:0}

  /* ---------- reservation table ---------- */
  .resv{margin-top:10px;border:1px solid #F3D9E5;border-radius:13px;background:#FFFBFD;padding:10px 10px 11px}
  .resv-head{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap}
  .resv-head b{font-size:12.5px;font-weight:800;color:#8E1B4E;letter-spacing:-.02em}
  .resv-head .prog{flex:1;min-width:60px;height:6px;border-radius:99px;background:#F7E3EC;overflow:hidden}
  .resv-head .prog i{display:block;height:100%;background:linear-gradient(90deg,#F0629F,#C2185B);border-radius:99px}
  .rtable{border-top:1px solid #F3E2EA}
  .rrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.25fr) minmax(0,.9fr) minmax(0,.7fr) 46px 26px;
    grid-template-areas:"n p m o c x";gap:3px 7px;align-items:center;padding:7px 1px;font-size:12px;border-bottom:1px solid #F7EAF0}
  .rrow:last-child{border-bottom:0}
  .rrow.rhead{font-size:10.5px;font-weight:800;color:#A9728D;letter-spacing:.02em;padding:6px 1px}
  .rrow .rn{grid-area:n;font-weight:800;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rrow .rp{grid-area:p;color:var(--slate-600);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rrow .rp a{color:inherit}
  .rrow .rm{grid-area:m;color:var(--slate-600);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ================= utils ================= */
function $(id){ return document.getElementById(id); }
function pad(n){ return (n<10?'0':'')+n; }
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function uid(p){ return (p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function hash(s){ var v=5381,i; for(i=0;i<s.length;i++){ v=((v*33)+s.charCodeAt(i))>>>0; } return ('0000000'+v.toString(16)).slice(-8); }
function todayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function shiftDay(n){ var d=new Date(); d.setDate(d.getDate()+n); return todayStr(d); }
function nowAt(){ var d=new Date(); return todayStr(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }
function minsAgo(m){ var d=new Date(Date.now()-m*60000); return todayStr(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }
function atOf(day,hh,mm){ return day+'T'+pad(hh)+':'+pad(mm); }
function fmtAt(at){
  if(!at) return '';
  var day=at.slice(0,10), t=at.slice(11,16);
  if(day===todayStr()) return '오늘 '+t;
  if(day===shiftDay(-1)) return '어제 '+t;
  return day.slice(5,7)+'-'+day.slice(8,10)+' '+t;
}
function fmtDayLabel(day){
  var d=new Date(day+'T00:00:00');
  var w='일월화수목금토'[d.getDay()];
  return (+day.slice(5,7))+'월 '+(+day.slice(8,10))+'일 ('+w+')';
}
function digits(p){ return String(p||'').replace(/[^0-9]/g,''); }
function maskPhone(p){
  var s=String(p||''); var m=s.match(/^(\d{3})-?(\d{3,4})-?(\d{4})$/);
  if(!m) return s;
  return m[1]+'-'+(ui.mask?'****':m[2])+'-'+m[3];
}
function bucketCls(b){ return b==='3년'?'bk-3y':(b==='550'?'bk-550':'bk-730'); }
function initial(n){ return String(n||'').slice(0,1); }
function colorOf(n){ return SC[n]||'#64748B'; }
function pct(n,total){ return total? Math.round(n/total*100) : 0; }

function loadState(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var d = JSON.parse(raw);
      if(d && Array.isArray(d.posts) && Array.isArray(d.customers)) return d;
    }
  }catch(e){}
  var s = seed();
  try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){}
  return s;
}

/* ================= toast / lightbox / sheet ================= */
function toast(msg, isErr){
  var el = $('toast');
  el.textContent = msg;
  el.className = 'toast on' + (isErr?' err':'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.className = 'toast'; }, 2500);
}
function openLB(src){
  if(!src) return;
  $('lbImg').src = src;
  $('lightbox').classList.add('on');
  document.body.classList.add('lock');
}
function closeLB(){
  $('lightbox').classList.remove('on');
  $('lbImg').removeAttribute('src');
  if(!sheetSpec) document.body.classList.remove('lock');
}
function openSheet(spec){
  sheetSpec = spec;
  renderSheet();
  $('sheet').classList.add('on');
  $('sheet').setAttribute('aria-hidden','false');
  document.body.classList.add('lock');
}
function closeSheet(){
  sheetSpec = null;
  $('sheet').classList.remove('on');
  $('sheet').setAttribute('aria-hidden','true');
  $('sheetBody').innerHTML = '';
  document.body.classList.remove('lock');
}
function renderSheet(){
  if(!sheetSpec) return;
  var b = $('sheetBody'), ttl = $('sheetTitle');
  var sc = b.scrollTop;
  if(sheetSpec.type==='post'){
    var p = findPost(sheetSpec.id);
    if(!p){ closeSheet(); return; }
    ttl.textContent = p.reserve?'사전예약 공지':(KIND_LABEL[p.kind]||'글');
    b.innerHTML = postCard(p, {sheet:true});
  } else if(sheetSpec.type==='custadd'){
    ttl.textContent = '명단 추가';
    b.innerHTML = custAddForm(sheetSpec.day);
  } else if(sheetSpec.type==='resv'){
    var pp = findPost(sheetSpec.id);
    if(!pp){ closeSheet(); return; }
    ttl.textContent = 'S26 사전예약 추가';
    b.innerHTML = resvForm(pp.id);
  } else if(sheetSpec.type==='memo'){
    var c = findCust(sheetSpec.id);
    if(!c){ closeSheet(); return; }
    ttl.textContent = '메모 · ' + c.name;
    b.innerHTML = '<form class="form" data-form="memo" data-id="'+c.id+'">'
      + '<label>메모<textarea name="memo" rows="3" placeholder="상담 내용·재통화 약속·전달사항">'+esc(c.memo||'')+'</textarea></label>'
      + '<p class="hint">고객 · 담당자 · 연락처는 명단에서 바로 바꿀 수 있어요.</p>'
      + '<div class="formfoot"><button class="btn primary" type="submit">저장</button>'
      + '<button class="btn ghost" type="button" data-act="close">취소</button></div></form>';
  } else if(sheetSpec.type==='menu'){
    ttl.textContent = '설정';
    b.innerHTML = menuHTML();
  }
  b.scrollTop = sc;
}

/* ================= login ================= */
function renderLogin(){
  var g = $('staffGrid');
  g.innerHTML = STAFF.map(function(n){
    return '<button type="button" class="staff-chip '+(ui.loginStaff===n?'on':'')+'" data-act="staff" data-name="'+esc(n)+'">'
      + '<span class="dot" style="--c:'+colorOf(n)+'"></span>'+esc(n)+'</button>';
  }).join('');
  updateDots();
}
function updateDots(){
  var v = ($('pinInput')||{}).value || '';
  var dots = $('pindots').children;
  for(var i=0;i<dots.length;i++) dots[i].className = i<v.length?'on':'';
}
function clearPin(){ var p=$('pinInput'); if(p) p.value=''; updateDots(); }
function loginErr(msg){
  $('loginErr').textContent = msg||'';
  var card = document.querySelector('.login-card');
  card.classList.remove('shake');
  void card.offsetWidth;
  card.classList.add('shake');
}
function doLogin(){
  var pin = ($('pinInput').value||'').trim();
  if(!ui.loginStaff){ loginErr('직원을 선택해 주세요.'); return; }
  if(!pin){ loginErr('비밀번호를 입력해 주세요.'); return; }
  if(hash('ktband:'+pin) !== PIN_HASH){ loginErr('비밀번호가 맞지 않아요.'); clearPin(); return; }
  session = {staff:ui.loginStaff, at:nowAt()};
  saveSession(session);
  $('loginErr').textContent = '';
  $('login').hidden = true;
  $('app').hidden = false;
  render();
  toast(session.staff+'님, 반갑습니다!');
}
function pressKey(k){
  var p = $('pinInput');
  if(k==='clear'){ p.value=''; updateDots(); return; }
  if(k==='back'){ p.value = p.value.slice(0,-1); updateDots(); return; }
  if(p.value.length>=4) return;
  p.value = p.value + k;
  updateDots();
  if(p.value.length===4) setTimeout(doLogin, 120);
}

/* ================= views ================= */
function viewHTML(){
  if(ui.tab==='band') return bandView();
  if(ui.tab==='write') return writeView();
  return noticeView();
}

function kindChips(){
  var sets = [
    {k:'all', t:'전체'},
    {k:'consult', t:'상담놓침'},
    {k:'notice', t:'매장 공지'},
    {k:'reserve', t:'사전예약'}
  ];
  return sets.map(function(f){
    return '<button class="chip '+(ui.filter===f.k?'on':'')+'" data-act="filter" data-f="'+f.k+'">'+f.t+'</button>';
  }).join('');
}
function postMatch(p){
  if(ui.filter==='all') return true;
  if(ui.filter==='consult') return p.kind==='consult';
  if(ui.filter==='notice') return p.kind==='notice' && !p.reserve;
  if(ui.filter==='reserve') return !!p.reserve;
  if(ui.filter==='memo') return p.kind==='memo';
  return true;
}
function byAtDesc(a,b){ return String(b.at||'').localeCompare(String(a.at||'')); }

function noticeView(){
  var pinned = state.posts.filter(function(p){ return p.pinned; }).sort(byAtDesc);
  var feed = state.posts.filter(function(p){ return !p.pinned && postMatch(p); }).sort(byAtDesc);
  var openConsult = state.posts.filter(function(p){ return p.kind==='consult' && !p.done; }).length;
  var html = '';
  html += '<div class="viewhead"><div><h2>📌 공지 · 상담 놓침</h2>'
        + '<p>고정 공지 + 상담놓침 + 사전예약 명단을 한 곳에서</p></div>'
        + '<div class="vactions"><button class="btn primary sm" data-act="compose">＋ 글쓰기</button></div></div>';

  html += '<section class="pinblock '+(ui.pinOpen?'':'closed')+'">'
        + '<div class="pin-head"><h2>📌 고정 공지 <span class="pill">'+pinned.length+'건</span></h2>'
        + '<button class="linkbtn" data-act="pin-toggle">'+(ui.pinOpen?'접기 ▲':'펼치기 ▼')+'</button></div>'
        + '<div class="pin-list">'+pinned.map(pinItem).join('')+'</div></section>';

  html += '<div class="toolbar"><div class="chips">'+kindChips()+'</div>'
        + (openConsult? '<span class="pill" style="margin-left:auto">미완료 '+openConsult+'건</span>':'')
        + '</div>';
  html += '<div class="feed">' + (feed.length? feed.map(function(p){ return postCard(p); }).join('')
        : '<div class="emptycard">해당하는 글이 없어요. 오른쪽 위 <b>＋ 글쓰기</b>로 새 글을 남겨보세요.</div>') + '</div>';
  return html;
}

function pinItem(p){
  var badge = p.reserve? '<span class="badge b-reserve">사전예약</span>'
            : p.kind==='consult'? '<span class="badge b-consult">상담놓침</span>'
            : p.kind==='notice'? '<span class="badge b-notice">매장공지</span>'
            : '<span class="badge b-memo">메모</span>';
  var bits = [p.author, fmtAt(p.at)];
  if(p.photos && p.photos.length) bits.push('사진 '+p.photos.length+'장');
  var right = '';
  if(p.reserve){
    var rs = p.reservations||[]; var dn = rs.filter(function(r){return r.done;}).length;
    right = '<span class="pcount">'+dn+'/'+rs.length+' 개통</span>';
  } else if(p.kind==='consult'){
    right = p.done? '<span class="badge b-done">완료</span>' : '<span class="pcount">진행중</span>';
  }

function photoGrid(ps, size){
  if(!ps || !ps.length) return '';
  var cls = ps.length===1?'one':(ps.length===2?'two':'');
  var out = '<div class="pgrid '+(size||'')+' '+cls+'">';
  for(var i=0;i<ps.length;i++){
    out += '<button class="pcell" data-act="photo" aria-label="사진 크게 보기"><img src="'+esc(ps[i].src)+'" alt="'+esc(ps[i].name||'첨부 사진')+'" loading="lazy"></button>';
  }
  return out+'</div>';
}

function cmtHTML(c, parentId, ctx){

/* ---------- band view ---------- */
function custMatch(c){
  if(ui.filter.indexOf('b:')===0){ if(c.bucket!==ui.filter.slice(2)) return false; }
  else if(ui.filter.indexOf('s:')===0){ if(c.status!==ui.filter.slice(2)) return false; }
  if(ui.q){
    var q = ui.q.replace(/\s+/g,'').toLowerCase();
    var hay = (c.name+' '+digits(c.phone)+' '+(c.memo||'')).toLowerCase();
    if(hay.indexOf(q)<0) return false;
  }
  return true;
}
var SORT_RANK = {'미통화':0,'부재':1,'예약':2,'완료':3};
function sortCust(a,b){
  var r = (SORT_RANK[a.status]||0)-(SORT_RANK[b.status]||0);
  if(r) return r;
  return String(a.name).localeCompare(String(b.name));
}

  var bc = {};
  BUCKETS.forEach(function(b){ bc[b] = all.filter(function(c){return c.bucket===b;}).length; });
  var done = all.filter(function(c){return c.status==='완료';}).length;
  var isToday = day===todayStr();
  var tag = isToday? '<span class="tag today">오늘</span>' : (day===shiftDay(-1)? '<span class="tag">어제</span>':'');
  var h = '<section class="day">'
        + '<div class="day-head">'

        +   '<div class="dh-counts">'

        +     '<span class="bk bk-550">550 '+bc['550']+'</span>'

        +   '<div class="dh-done">완료 '+done+'/'+all.length+'</div>'
        + '</div><div class="cust-list">'

        + '</div><div class="day-foot"><button class="linkbtn" data-act="add-cust" data-day="'+day+'">＋ 이 날짜에 명단 추가</button></div></section>';
  return h;
}

    + '<label>메모<textarea name="memo" rows="2" placeholder="예) S26 기변 + 인터넷 결합 상담"></textarea></label>'
    + '<div class="formfoot"><button class="btn primary" type="submit">명단에 추가</button>'
    + '<button class="btn ghost" type="button" data-act="close">취소</button></div></form>';
}
function resvForm(pid){

    + '<label>고객명<input name="name" required placeholder="예) 홍길동" autocomplete="off"></label>'
    + '<label>연락처<input name="phone" inputmode="tel" placeholder="010-1234-5678" autocomplete="off"></label>'

    + '<div class="formfoot"><button class="btn primary" type="submit">예약 추가</button>'
    + '<button class="btn ghost" type="button" data-act="close">취소</button></div></form>';

/* ================= render ================= */
function render(){
  if(!session) return;
  var y = window.scrollY;
  var activeId = document.activeElement && document.activeElement.id;
  var selStart = null, selEnd = null;
  try{ if(activeId && document.activeElement.setSelectionRange){ selStart = document.activeElement.selectionStart; selEnd = document.activeElement.selectionEnd; } }catch(e){}

  $('main').innerHTML = viewHTML();
  $('rail').innerHTML = railHTML();

  var tabs = document.querySelectorAll('#tabbar .tab');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('on', tabs[i].getAttribute('data-tab')===ui.tab);

  var openConsult = state.posts.filter(function(p){ return p.kind==='consult' && !p.done; }).length;
  var todayLeft = state.customers.filter(function(c){ return c.day===todayStr() && c.status!=='완료'; }).length;
  $('t1n').textContent = openConsult || '';
  $('t2n').textContent = todayLeft || '';
  $('t3n').textContent = '';

  $('whoName').textContent = session.staff;
  var av = $('whoAv');
  av.textContent = initial(session.staff);
  av.style.setProperty('--c', colorOf(session.staff));

  if(sheetSpec) renderSheet();

  window.scrollTo(0, y);
  if(activeId && activeId!=='q'){
    var el = $(activeId);
    if(el && el.focus){
      try{ el.focus({preventScroll:true}); if(selStart!=null){ el.setSelectionRange(selStart, selEnd); } }catch(e){}
    }
  }
  if(activeId==='q'){
    var q = $('q');
    if(q){ try{ q.focus({preventScroll:true}); q.setSelectionRange(q.value.length, q.value.length); }catch(e){} }
  }
}

/* ================= photos ================= */
function compressImage(file, maxSide, targetKB){
  maxSide = maxSide || 1200;
  targetKB = targetKB || 150;
  return new Promise(function(resolve, reject){
    if(!file || !/^image\//.test(file.type)){ reject(new Error('이미지 파일이 아니에요')); return; }
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      try{
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxSide/Math.max(w,h));
        w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        var q = 0.74, data = cv.toDataURL('image/jpeg', q);
        while(data.length > targetKB*1400 && q > 0.34){
          q -= 0.08;
          data = cv.toDataURL('image/jpeg', q);
        }
        URL.revokeObjectURL(url);
        resolve({src:data, name:file.name||'사진'});
      }catch(err){ URL.revokeObjectURL(url); reject(err); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('사진을 읽지 못했어요')); };
    img.src = url;
  });
}
function handleFiles(input){
  var files = [];
  try{ files = Array.prototype.slice.call(input.files||[]); }catch(e){}
  if(!files.length) return;
  toast('사진 처리 중…');
  var jobs = files.slice(0,10).map(function(f){ return compressImage(f).catch(function(){ return null; }); });
  Promise.all(jobs).then(function(list){
    var out = list.filter(Boolean);
    if(!out.length){ toast('사진을 읽지 못했어요. 다른 사진으로 시도해 주세요.', true); return; }
    if(input.getAttribute('data-photo')==='composer'){
      ui.composer.photos = (ui.composer.photos||[]).concat(out);
    } else {
      var key = input.getAttribute('data-key');
      ui.attach[key] = (ui.attach[key]||[]).concat(out);
    }
    input.value = '';
    render();
    toast(out.length+'장 첨부했어요');
  });
}

/* ================= actions ================= */
function setTab(tab){
  if(ui.tab===tab) return;
  ui.tab = tab;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function compose(){
  ui.tab = 'write';
  render();
  window.scrollTo({top:0, behavior:'smooth'});
  setTimeout(function(){
    var b = $('cBody');
    if(b){ try{ b.focus({preventScroll:true}); }catch(e){} }
  }, 220);
}
function submitPost(){
  var title = (ui.drafts['cmp:title']||'').trim();
  var body = (ui.drafts['cmp:body']||'').trim();
  var photos = ui.composer.photos||[];
  if(!body && !photos.length && !title){ toast('내용을 입력하거나 사진을 붙여주세요.', true); return; }
  var p = {
    id: uid('p'), kind: ui.composer.kind||'consult', pinned: !!ui.composer.pin,
    title: title, body: body, author: session.staff, at: nowAt(), done:false,
    photos: photos.slice(), comments: []
  };
  if(p.pinned) p.pinned = true;
  state.posts.push(p);
  ui.drafts['cmp:title'] = '';
  ui.drafts['cmp:body'] = '';
  ui.composer = {kind:'consult', photos:[], pin:false};
  save(); render();
  toast(p.pinned? '공지로 등록했어요' : '글을 등록했어요');
}
function changeStatus(id, st){
  var c = findCust(id);
  if(!c || c.status===st) return;
  var prev = c.status;
  c.status = st;
  c.comments = c.comments||[];
  c.comments.push(sysCmt('통화상태 '+prev+' → '+st));
  save(); render();
  toast(c.name+' · '+st);
}
function exportData(){
  var payload = {app:'kt-band-manager', store:'충주 KT대리점 칠금점', exportedAt:new Date().toISOString(), data:state};
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '칠금점-가망고객밴드-'+todayStr()+'.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1200);
  toast('JSON 파일로 내보냈어요');
}
function resetData(){
  if(!confirm('샘플 데이터로 초기화할까요?\n지금까지 적은 글·댓글·명단이 모두 사라집니다. (먼저 내보내기로 백업할 수 있어요)')) return;
  state = seed();
  ui.openThreads = {};
  ui.custThreads = {};
  ui.drafts = {};
  ui.attach = {};
  save(); closeSheet(); render();
  toast('샘플 데이터로 초기화했어요');
}
function logout(){
  session = null;
  saveSession(null);
  closeSheet();
  $('app').hidden = true;
  $('login').hidden = false;
  ui.loginStaff = '김태양';
  clearPin();
  renderLogin();
}

/* ================= events ================= */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var act = el.getAttribute('data-act');

  switch(act){
    case 'tab': setTab(el.getAttribute('data-tab')); break;
    case 'compose': compose(); break;
    case 'menu': openSheet({type:'menu'}); break;
    case 'close': closeSheet(); break;
    case 'staff-switch':
      closeSheet(); session=null; saveSession(null);
      $('app').hidden = true; $('login').hidden = false;
      clearPin(); renderLogin();
      break;
    case 'logout': logout(); break;
    case 'export': exportData(); break;
    case 'reset': resetData(); break;
    case 'pin-toggle': ui.pinOpen = !ui.pinOpen; render(); break;
    case 'filter':
      var f = el.getAttribute('data-f');
      ui.filter = (ui.filter===f && f!=='all')? 'all' : f;
      render(); break;
    case 'mask': ui.mask = !ui.mask; render(); toast(ui.mask?'번호를 가렸어요':'번호를 표시해요'); break;
    case 'thread-toggle':
      var tid = el.getAttribute('data-id');
      if(ui.openThreads[tid]) delete ui.openThreads[tid]; else ui.openThreads[tid]=true;
      render(); break;
    case 'open-post': openSheet({type:'post', id: el.getAttribute('data-id')}); break;
    case 'post-done':
      var pd = findPost(el.getAttribute('data-id'));
      if(pd){ pd.done = !pd.done; save(); render(); toast(pd.done?'완료 처리했어요':'완료를 취소했어요'); }
      break;
    case 'post-pin':
      var pp = findPost(el.getAttribute('data-id'));
      if(pp){ pp.pinned = !pp.pinned; save(); render(); toast(pp.pinned?'맨 위 공지로 고정했어요':'고정을 해제했어요'); }
      break;
    case 'photo':
      var img = el.querySelector('img') || el;
      openLB(img.getAttribute('src'));
      break;
    case 'close-lb': closeLB(); break;
    case 'reply-open': ui.replyOpen = el.getAttribute('data-cid'); render();
      setTimeout(function(){
        var f2 = document.querySelector('form[data-form="reply"] input');
        if(f2) try{ f2.focus({preventScroll:true}); }catch(e){}
      }, 60);
      break;
    case 'reply-close': ui.replyOpen = null; render(); break;
    case 'cust-thread':
      var cid = el.getAttribute('data-id');
      if(ui.custThreads[cid]) delete ui.custThreads[cid]; else ui.custThreads[cid]=true;
      render(); break;
    case 'status': changeStatus(el.getAttribute('data-id'), el.getAttribute('data-st')); break;
    case 'memo': openSheet({type:'memo', id: el.getAttribute('data-id')}); break;
    case 'add-cust': openSheet({type:'custadd', day: el.getAttribute('data-day') || todayStr()}); break;
    case 'resv-add': openSheet({type:'resv', id: el.getAttribute('data-id')}); break;
    case 'resv-del':
      var rp = findPost(el.getAttribute('data-pid'));
      if(rp){
        var rid = el.getAttribute('data-rid');
        rp.reservations = (rp.reservations||[]).filter(function(r){ return r.id!==rid; });
        save(); render(); toast('예약을 삭제했어요');
      }
      break;
    case 'attach-del':
      var k = el.getAttribute('data-key'), ix = +el.getAttribute('data-i');
      if(ui.attach[k]){ ui.attach[k].splice(ix,1); if(!ui.attach[k].length) delete ui.attach[k]; }
      render(); break;
    case 'cmp-photo-del':
      ui.composer.photos.splice(+el.getAttribute('data-i'),1); render(); break;
    case 'cmp-kind': ui.composer.kind = el.getAttribute('data-k'); render(); break;
    case 'submit-post': submitPost(); break;
    case 'staff':
      ui.loginStaff = el.getAttribute('data-name');
      renderLogin(); break;
    case 'key': pressKey(el.getAttribute('data-k')); break;
    case 'pin-focus':
      var pi = $('pinInput'); if(pi) try{ pi.focus({preventScroll:true}); }catch(e){}
      break;
  }
});

document.addEventListener('input', function(e){
  var t = e.target;
  if(t.id==='q'){ ui.q = t.value; render(); return; }
  var dk = t.getAttribute && t.getAttribute('data-draft');
  if(dk){ ui.drafts[dk] = t.value; }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if(t.type==='file' && t.getAttribute('data-photo')){ handleFiles(t); return; }
  if(t.id==='cPin'){ ui.composer.pin = !!t.checked; return; }
  if(t.getAttribute && t.getAttribute('data-act')==='owner'){
    var c = findCust(t.getAttribute('data-id'));
    if(c && c.owner!==t.value){
      c.comments = c.comments||[];
      c.comments.push(sysCmt('담당자 '+(c.owner||'미지정')+' → '+t.value));
      c.owner = t.value;
      save(); render(); toast('담당자를 '+t.value+'님으로 바꿨어요');
    }
    return;
  }
  if(t.getAttribute && t.getAttribute('data-act')==='resv-done'){
    var p = findPost(t.getAttribute('data-pid'));
    if(p){
      var rid = t.getAttribute('data-rid');
      (p.reservations||[]).forEach(function(r){ if(r.id===rid) r.done = !!t.checked; });
      save(); render(); toast(t.checked?'개통 완료로 체크했어요':'개통 체크를 해제했어요');
    }
    return;
  }
});

document.addEventListener('submit', function(e){
  var f = e.target.closest('form[data-form]');
  if(!f) return;
  e.preventDefault();
  var kind = f.getAttribute('data-form');

  if(kind==='login'){ doLogin(); return; }

  if(kind==='cmt' || kind==='reply'){
    var fd = new FormData(f);
    var text = String(fd.get('text')||'').trim();
    var id = f.getAttribute('data-id');
    var ctx = f.getAttribute('data-ctx');
    var item = ctx==='cust'? findCust(id) : findPost(id);
    if(!item){ toast('대상을 찾지 못했어요.', true); return; }

    if(kind==='cmt'){
      var key = ctx+':'+id;
      var photos = ui.attach[key]||[];
      if(!text && !photos.length){ toast('내용을 입력해 주세요.', true); return; }
      item.comments = item.comments||[];
      item.comments.push({id:uid('c'), author:session.staff, at:nowAt(), text:text, photos:photos.slice(), replies:[]});
      delete ui.drafts[key]; delete ui.attach[key];
      save(); render(); toast('댓글을 남겼어요');
    } else {
      var cid = f.getAttribute('data-cid');
      var parent = (item.comments||[]).filter(function(c){ return c.id===cid; })[0];
      if(!parent){ toast('댓글을 찾지 못했어요.', true); return; }
      if(!text){ toast('답글 내용을 입력해 주세요.', true); return; }
      parent.replies = parent.replies||[];
      parent.replies.push({id:uid('r'), author:session.staff, at:nowAt(), text:text, photos:[]});
      ui.replyOpen = null;
      save(); render(); toast('답글을 남겼어요');
    }
    return;
  }

  if(kind==='custadd'){
    var d = new FormData(f);
    var name = String(d.get('name')||'').trim();
    var phone = String(d.get('phone')||'').trim();
    var day = String(d.get('day')||todayStr());
    if(!name){ toast('고객명을 입력해 주세요.', true); return; }
    var c = {
      id: uid('c'), day: day, name: name, phone: phone,
      bucket: String(d.get('bucket')||'730'),
      owner: String(d.get('owner')||session.staff),
      status: '미통화',
      memo: String(d.get('memo')||'').trim(),
      comments: []
    };
    state.customers.push(c);
    save(); closeSheet(); render();
    toast(name+'님을 명단에 추가했어요');
    return;
  }

  if(kind==='resvadd'){
    var rd = new FormData(f);
    var rname = String(rd.get('name')||'').trim();
    if(!rname){ toast('고객명을 입력해 주세요.', true); return; }
    var post = findPost(f.getAttribute('data-id'));
    if(!post){ toast('공지를 찾지 못했어요.', true); return; }
    post.reservations = post.reservations||[];
    post.reservations.push({
      id: uid('r'), name: rname,
      phone: String(rd.get('phone')||'').trim(),
      model: String(rd.get('model')||'').trim(),
      owner: String(rd.get('owner')||session.staff),
      done: false
    });
    save();
    sheetSpec = {type:'post', id:post.id};
    render();
    toast(rname+'님 사전예약을 추가했어요');
    return;
  }

  if(kind==='memo'){
    var md = new FormData(f);
    var cc = findCust(f.getAttribute('data-id'));
    if(cc){
      cc.memo = String(md.get('memo')||'').trim();
      save(); closeSheet(); render(); toast('메모를 저장했어요');
    }
    return;
  }
});

document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    if($('lightbox').classList.contains('on')){ closeLB(); }
    else if(sheetSpec){ closeSheet(); }
    return;
  }
  if(sheetSpec && e.key==='Enter' && e.target && e.target.tagName==='INPUT' && e.target.name==='text'){
    /* 댓글 입력에서 Enter = 등록 */
    var form = e.target.closest('form[data-form="cmt"],form[data-form="reply"]');
    if(form){ e.preventDefault(); if(form.requestSubmit) form.requestSubmit(); else form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true})); }
  }
  if(e.target && e.target.id==='pinInput' && e.key==='Enter'){
    e.preventDefault(); doLogin();
  }
});

/* ================= init ================= */
function registerSW(){
  if('serviceWorker' in navigator && location.protocol!=='file:'){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
}
function init(){
  session = loadSession();
  state = loadState();
  renderLogin();
  if(session){
    $('login').hidden = true;
    $('app').hidden = false;
    ui.loginStaff = session.staff;
    render();
    var pi = $('pinInput'); if(pi) try{ pi.blur(); }catch(e){}
  } else {
    $('login').hidden = false;
    $('app').hidden = true;
    var p2 = $('pinInput');
    if(p2) try{ p2.focus({preventScroll:true}); }catch(e){}
  }
  registerSW();
}
init();

})();
