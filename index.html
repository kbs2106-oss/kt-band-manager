/* ---------- band view ---------- */
function custMatch(c){
  if(ui.year!=='all' && String(c.day).slice(0,4)!==ui.year) return false;
  if(ui.month!=='all' && String(c.day).slice(5,7)!==ui.month) return false;
  if(ui.filter.indexOf('b:')===0){ if(c.bucket!==ui.filter.slice(2)) return false; }
  else if(ui.filter.indexOf('s:')===0){ if(c.status!==ui.filter.slice(2)) return false; }
  if(ui.q){
    var q = ui.q.replace(/[\s-]+/g,'').toLowerCase();
    var hay = (c.name+' '+digits(c.phone)+' '+(c.memo||'')+' '+birthISO(c.birth)+' '+custTextOf(c)).toLowerCase();
    /* v7: 이름·번호·메모·통화 기록·답글까지 검색 (띄어쓰기·하이픈은 무시하고 한 번 더 비교) */
    if(hay.indexOf(q)<0 && hay.replace(/[\s-]+/g,'').indexOf(q)<0) return false;
  }
  return true;
}
/* 고객의 통화 기록(댓글·답글) 글자를 한 줄로 */
function custTextOf(c){
  var out = [];
  (c.comments||[]).forEach(function(x){
    if(x.text) out.push(x.text);
    (x.replies||[]).forEach(function(r){ if(r.text) out.push(r.text); });
  });
  return out.join(' ');
}
/* v8: 날짜 카드가 많아서(최근 3개월 85일 + 과거 713일) 한 번에 다 그리지 않는다.
   기본은 최근 6일만, '이전 날짜 더 보기'로 늘리고, 기간(연/월)을 골랐거나 검색 중이면 결과를 넉넉히(40일) 보여준다. */
function dayLimit(){
  /* 기간·검색은 40일까지 한 번에, 기본은 최근 6일 — '이전 날짜 더 보기'로 늘어난 만큼은 어디서든 지킨다 */
  var base = (periodActive() || ui.q) ? 40 : 6;
  return Math.max(base, ui.dayShown || 6);
}
function listDays(idx){
  if(!periodActive()) return idx.days;
  return idx.days.filter(function(d){
    if(ui.year!=='all' && d.slice(0,4)!==ui.year) return false;
    if(ui.month!=='all' && d.slice(5,7)!==ui.month) return false;
    return true;
  });
}
function dayHasMatch(day){
  var list = custsOfDay(day);
  for(var i=0;i<list.length;i++){ if(custMatch(list[i])) return true; }
  return false;
}
/* v8.4(#17983): 부재는 '오늘 기준 최근 3개월(90일)' 기준 — 명단 고객 + 상담 공지 댓글까지 한 번에 모은다.
   mode: 'absent' = 부재 상태만 · 'keep' = 부재 + 📌킵(미완료) */
function absentItems(mode){
  var cut = shiftDay(-89), out = [];
  (state.customers||[]).forEach(function(c){
    var isAbs = c.status==='부재', isKeep = !!c.keep && !isDoneSt(c.status);
    if(mode==='absent' ? !isAbs : !(isAbs || isKeep)) return;
    var day = String(c.day||'').slice(0,10), last = String(lastAtOf(c)||'').slice(0,10);
    var ref = last > day ? last : day;
    if(ref < cut) return;
    out.push({kind:'cust', id:c.id, at:ref, name:c.name, phone:c.phone, status:c.status, memo:lastMemoOf(c), c:c});
  });
  (state.posts||[]).forEach(function(p){
    (p.comments||[]).forEach(function(cm){
      if(cm.st !== '부재') return;
      var at = String(cm.at||'').slice(0,10);
      if(!at || at < cut) return;
      out.push({kind:'cmt', pid:p.id, cid:cm.id, at:at, name:cm.author||'댓글', memo:shortText(cm.text||'', 60)});
    });
  });
  out.sort(function(a,b){ return String(b.at).localeCompare(String(a.at)); });
  return out;
}
function absentCount(mode){ return absentItems(mode||'absent').length; }

/* v8.19(#20499): 예약 고객 목록 — 기본 '가까운 순'(오늘 이후 가장 임박한 예약이 맨 위, 지난 예약은 아래·최근 것부터)
   + 헤더 아래 한 줄 필터(전체·오늘·7일 이내·지난 예약) + 정렬 전환(가까운 순 ⇅ / 최근 등록순) */
var RESV_FILTERS = [['all','전체'],['today','오늘'],['7d','7일 이내'],['past','지난 예약']];
function resvF(){ return ui.resvF || 'all'; }

function resvWhen(it){
  var d = String(it.resDate||'');
  if(!d) return null;
  var t = String(it.resTime||'');
  if(!/^\d{2}:\d{2}$/.test(t)) t = '23:59';   /* 시간을 안 정한 예약은 그날 맨 뒤 */
  var ms = Date.parse(d+'T'+t+':00');
  return isNaN(ms)? null : ms;
}
function resvRegAt(it){ return String(it.stAt || it.at || ''); }
function resvSortNear(a,b){
  var now = Date.now(), A = resvWhen(a), B = resvWhen(b);
  if(A===null && B===null) return 0;
  if(A===null) return 1;
  if(B===null) return -1;
  var ap = A < now, bp = B < now;
  if(ap !== bp) return ap? 1 : -1;    /* 다가오는 예약이 항상 지난 예약보다 위 */
  return ap? (B - A) : (A - B);       /* 다가오는: 임박한 순 / 지난: 최근 것부터 */
}
function resvSortReg(a,b){
  var A = resvRegAt(a), B = resvRegAt(b);
  if(A !== B) return A < B ? 1 : -1;  /* 최근에 등록·바뀐 예약이 위 */
  return resvSortNear(a,b);
}
function resvFilterMatch(it, f){
  var d = String(it.resDate||''), t = todayStr();
  if(f==='today') return d === t;
  if(f==='7d') return !!d && d >= t && d <= shiftDay(7);
  if(f==='past') return !!d && d < t;
  return true;
}

       + ' aria-pressed="'+(f===x[0]?'true':'false')+'">'+x[1]+'</button>';
  });
  h += '</div><button class="rsort" data-act="resv-sort" aria-label="정렬 바꾸기 — 지금 '+esc(reg?'최근 등록순':'가까운 순')+'">'
     + esc(reg? '최근 등록순' : '가까운 순') + ' <span class="ric" aria-hidden="true">⇅</span></button></div>';
  return h;
}
/* v8.8(#18395): 예약 목록 = 기간과 무관하게 명단 예약 + 상담 공지 댓글 예약 전부(오늘·지난·미래 12월 등) */
function resvListHTML(){
  var all = resvAllList();
  var f = resvF(), reg = resvSortOn()==='reg';
  var list = all.filter(function(it){ return resvFilterMatch(it, f); });
  list.sort(reg? resvSortReg : resvSortNear);
  var fname = '';
  RESV_FILTERS.forEach(function(x){ if(x[0]===f) fname = x[1]; });
  var sub = '기간 무관 · ' + (reg? '최근 등록순' : '가까운 순') + (f==='all'? '' : ' · ' + fname);
  var h = flatHeadHTML('⏰', '예약 고객', list.length, sub) + resvCtlHTML();
  if(!all.length){
    return h + '<div class="emptycard">지금 예약 잡힌 고객이 없어요.<br>오른쪽 아래 <b>＋</b> 로 예약을 바로 넣거나,<br>명단에서 <b>예약</b>을 누르면 날짜·시간을 골라 여기에 모입니다.</div>';
  }
  if(!list.length){
    var msg = f==='today'? '오늘 잡힌 예약이 없어요.'
            : (f==='7d'? '오늘부터 7일 안에 잡힌 예약이 없어요.' : '지난 예약이 없어요.');
    return h + '<div class="emptycard">'+msg+'<br><button class="linkbtn" data-act="resv-f" data-f="all">예약 전체 보기</button></div>';
  }
  /* 전체 보기(가까운 순)에서만 '지난 예약' 줄을 넣어 다가오는 예약과 섞이지 않게 한다 */
  var rows = '', sep = false, now = Date.now();
  list.forEach(function(it){
    if(f==='all' && !reg){
      var w = resvWhen(it), isPast = (w!==null && w < now);
      if(isPast && !sep){ sep = true; rows += '<div class="resv-sep">지난 예약</div>'; }
    }
    rows += resvRowItem(it);
  });
  return h + '<div class="resvlist">' + rows + '</div>';
}
function resvRowItem(it){

/* v8.17: 검색할 때는 기간(연·월) 밖에 잡아 둔 직접 예약도 함께 찾아 준다 —
   예약 날짜가 다음 달·내년이어도 이름·번호로 검색하면 나온다. */
function resvSearchHTML(shownDays){
  var q0 = String(ui.q||'').replace(/[\s-]+/g,'').toLowerCase();
  if(!q0) return '';
  var out = [];
  (state.customers||[]).forEach(function(c){
    if(!c.resOnly) return;
    var day = String(c.day||'').slice(0,10);
    if(shownDays && shownDays.indexOf(day)>=0) return;      /* 기간 안 목록에 이미 나옴 */
    var hay = (c.name+' '+digits(c.phone)+' '+(c.memo||'')+' '+(c.resDate||'')).toLowerCase();
    if(hay.indexOf(q0)<0 && hay.replace(/[\s-]+/g,'').indexOf(q0)<0) return;
    out.push(c);
  });
  if(!out.length) return '';
  out.sort(function(a,b){ return resvSortKey(a).localeCompare(resvSortKey(b)); });
  return '<div class="srchresv"><b>⏰ 예약 (기간 밖) <span class="n">'+out.length+'</span></b>'
       + '<small>직접 추가한 예약 · 날짜순</small></div>'
       + '<div class="resvlist" style="margin-bottom:10px">' + out.map(resvRowHTML).join('') + '</div>';
}
function custListHTML(){
  if(ui.filter==='keep') return flatKeepHTML('keep');
  if(ui.filter==='s:부재') return flatKeepHTML('absent');
  if(ui.filter==='s:예약') return resvListHTML();
  var days = listDays(custIndex());
  var limit = dayLimit();
  var hits = [], i;
  for(i=0;i<days.length;i++){ if(dayHasMatch(days[i])) hits.push(days[i]); }
  var cards = hits.slice(0, limit).map(dayCard).filter(Boolean).join('');
  if(ui.q) cards = resvSearchHTML(hits) + cards;   /* v8.17: 기간 밖 예약도 검색에 */
  if(!cards){
    if(!arch.ready && (ui.year!=='all' || ui.q)){
      return '<div class="emptycard">과거 명단을 불러오는 중이에요…<br>잠시 뒤 다시 보여드릴게요.</div>';
    }
    if(periodActive()){
      var rn = resvAllCount();
      if(rn){
        return '<div class="emptycard">'+esc(periodLabel())+'엔 명단이 없어요.<br>'
          + '예약 <b>'+rn+'</b>건은 기간과 상관없이 상단 <b>예약</b> 칸에 모여 있어요.<br>'
          + '<button class="linkbtn" data-act="resv-filter">⏰ 예약 '+rn+'건 보기</button><br>'
          + '<button class="linkbtn" data-act="period-clear">전체 기간에서 보기</button></div>';
      }
      return '<div class="emptycard">'+esc(periodLabel())+'에 조건에 맞는 명단이 없어요.<br>'
        + '<button class="linkbtn" data-act="period-clear">전체 기간에서 보기</button></div>';
    }
    return '<div class="emptycard">조건에 맞는 명단이 없어요.<br>'
      + (isAdmin()? '오른쪽 아래 <b>＋</b> 버튼으로 고객을 추가해보세요.'
                   : '새 고객 추가는 <b>관리자 모드</b>(프로필 → 관리자 PIN)에서만 할 수 있어요.') + '</div>';
  }
  if(hits.length > limit){
    cards += '<button class="morebar" data-act="more-days">이전 날짜 더 보기 <b>'+(hits.length-limit)+'</b>일 <span class="chev">▾</span></button>';
  }
  return cards;

function periodActive(){ return ui.year!=='all' || ui.month!=='all'; }
function periodCustomers(){
  if(!periodActive()) return custsOfDay(todayStr());
  var all = custIndex().all;
  return all.filter(function(c){
    if(ui.year!=='all' && String(c.day).slice(0,4)!==ui.year) return false;
    if(ui.month!=='all' && String(c.day).slice(5,7)!==ui.month) return false;
    return true;
  });
}
function periodLabel(){
  return (ui.year==='all'? '전체 연도' : ui.year+'년') + ' ' + (ui.month==='all'? '전체 월' : (+ui.month)+'월');
}
function periodHTML(){

    if(ui.year==='all' || d.slice(0,4)===ui.year) months[d.slice(5,7)] = 1;
  });
  var yl = Object.keys(years).sort().reverse();

  var ml = ['01','02','03','04','05','06','07','08','09','10','11','12'];

  /* v8.4: 지금 고른 연·월이 자료에 없어도 드롭다운이 비지 않게 목록에 넣어 둔다 */
  if(ui.year!=='all' && yl.indexOf(ui.year)<0){ yl.push(ui.year); yl.sort().reverse(); }

        + '</select></label>'
        + '<label class="psel"><select data-act="fmonth" aria-label="월 선택">'
        +   '<option value="all"'+(ui.month==='all'?' selected':'')+'>전체 월</option>'
        +   ml.map(function(m){ return '<option value="'+m+'"'+(ui.month===m?' selected':'')+'>'+(+m)+'월</option>'; }).join('')
        + '</select></label>';
  /* v8.8(#18425): `2026년 11월 기준 ✕` 파란 알약은 띄우지 않는다 — 전체 보기는 연·월 드롭다운에서 고른다 */
  if(!arch.ready){
    h += '<div class="archline'+(arch.err?' err':'')+'">'
       + (arch.err? '📚 과거 명단을 불러오지 못했어요 · '+esc(arch.err)
                  : '📚 과거 명단(10,066건)을 불러오는 중…')

var SORT_RANK = {'미통화':0,'부재':1,'예약':2,'완료':3,'개통완료':4};
var BUCKET_RANK = {'예약':0,'730':1,'550':2,'3년':3};   /* v8.17: 그 날 예약 고객이 맨 위 */
function sortCust(a,b){
  var ba = BUCKET_RANK[a.bucket], bb = BUCKET_RANK[b.bucket];
  var br = (ba==null?9:ba)-(bb==null?9:bb);
  if(br) return br;
  var r = (SORT_RANK[a.status]||0)-(SORT_RANK[b.status]||0);
  if(r) return r;
  return String(a.name).localeCompare(String(b.name));
}
function lastAtOf(c){
  var at = c.at||'';
  (c.comments||[]).forEach(function(x){ if(String(x.at||'')>at) at = String(x.at); });
  return at;
}
function keepList(){
  return state.customers.filter(function(c){ return c.status==='부재' || c.keep; }).sort(function(a,b){
    if(a.day!==b.day) return String(b.day).localeCompare(String(a.day));
    var la = lastAtOf(a), lb = lastAtOf(b);
    if(la!==lb) return lb.localeCompare(la);
    return String(a.name).localeCompare(String(b.name));
  });
}
function lastMemoOf(c){
  var m = String(c.memo||'').trim();
  if(m) return m;
  var cs = c.comments||[];
  for(var i=cs.length-1;i>=0;i--){ if(cs[i].text && !cs[i].sys) return cs[i].text; }
  return '';
}

function dayCard(day){
  var all = custsOfDay(day);
  var list = all.filter(custMatch).sort(sortCust);
  if(!list.length) return '';
  var done = all.filter(function(c){return isDoneSt(c.status);}).length;
  var left = all.length - done;
  var isToday = day===todayStr();
  var tag = isToday? '<span class="bk">오늘</span>' : (day===shiftDay(-1)? '<span class="bk">어제</span>':'');
  var h = '<section class="day" data-day="'+day+'">'
        + '<div class="day-head">'
        +   '<div class="dh-date"><b>'+fmtDayLabel(day)+'</b>'+tag+'</div>'
        +   '<div class="dh-done '+(left?'':'all-done')+'">'+(left? '남은 <b>'+left+'</b>' : '모두 완료')+'</div>'
        +   (isAdmin()? '<button class="day-add" data-act="add-cust" data-day="'+day+'" aria-label="이 날짜에 명단 추가">＋</button>' : '')
        + '</div><div class="cust-list">'
        + list.map(custRow).join('')
        + '</div></section>';
  return h;
}

  try{ if(activeId && document.activeElement.setSelectionRange){ selStart = document.activeElement.selectionStart; selEnd = document.activeElement.selectionEnd; } }catch(e){}

  $('main').innerHTML = viewHTML();
  var rail = $('rail'); if(rail) rail.innerHTML = railHTML();

  var tabs = document.querySelectorAll('#tabbar .tab');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('on', tabs[i].getAttribute('data-tab')===ui.tab);

  var todayLeft = custsOfDay(todayStr()).filter(function(c){ return !isDoneSt(c.status); }).length;
  $('t1n').textContent = '';
  $('t2n').textContent = todayLeft || '';

  $('whoName').textContent = session.staff;
  var av = $('whoAv');
  av.textContent = initial(session.staff);
  av.style.setProperty('--c', colorOf(session.staff));

  var fab = $('fab');
  if(fab){
    /* v8.17: 730·550·3년 탭의 + 는 전 직원에게 보인다.
       · 일반 직원 → ⏰ 예약 추가  · 관리자 → ⏰ 예약 추가 / 📋 명단 추가 중 골라 입력
       (명단 추가·삭제 자체는 계속 관리자 전용) · 홈 피드는 그대로 새 글 쓰기 */
    var onBand = ui.tab==='band';

    fab.classList.toggle('fab-resv', onBand);
  }

  if(sheetSpec) renderSheet();

  window.scrollTo(0, y);
  if(activeId && activeId!=='q'){

    if(el && el.focus){
      try{ el.focus({preventScroll:true}); if(selStart!=null){ el.setSelectionRange(selStart, selEnd); } }catch(e){}
    }

  }
}

/* ================= photos ================= */
function compressImage(file, maxSide, targetKB){
  maxSide = maxSide || 1200;
  targetKB = targetKB || 150;
  return new Promise(function(resolve, reject){
    if(!file || !/^image\//.test(file.type)){ reject(new Error('이미지 파일이 아니에요')); return; }
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      try{
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxSide/Math.max(w,h));
        w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        var q = 0.74, data = cv.toDataURL('image/jpeg', q);
        while(data.length > targetKB*1400 && q > 0.34){
          q -= 0.08;
          data = cv.toDataURL('image/jpeg', q);
        }
        URL.revokeObjectURL(url);
        resolve({src:data, name:file.name||'사진'});
      }catch(err){ URL.revokeObjectURL(url); reject(err); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('사진을 읽지 못했어요')); };
    img.src = url;
  });
}
function handleFiles(input){
  var files = [];
  try{ files = Array.prototype.slice.call(input.files||[]); }catch(e){}
  if(!files.length) return;
  toast('사진 처리 중…');
  var jobs = files.slice(0,10).map(function(f){ return compressImage(f).catch(function(){ return null; }); });
  Promise.all(jobs).then(function(list){
    var out = list.filter(Boolean);
    if(!out.length){ toast('사진을 읽지 못했어요. 다른 사진으로 시도해 주세요.', true); return; }
    if(input.getAttribute('data-photo')==='composer'){
      ui.composer.photos = (ui.composer.photos||[]).concat(out);
    } else {
      var key = input.getAttribute('data-key');
      ui.attach[key] = (ui.attach[key]||[]).concat(out);
    }
    input.value = '';
    render();
    toast(out.length+'장 첨부했어요');
  });
}

var photoMenu = null, photoMenuForm = null, photoMenuAt = 0;

function openPhotoMenu(btn){
  closePhotoMenu();

  var mw = menu.offsetWidth || 172, mh = menu.offsetHeight || 104;

  if(top < 8) top = Math.max(8, Math.min(vh - mh - 8, r.bottom + 8));
  menu.style.left = Math.round(left) + 'px';
  menu.style.top = Math.round(top) + 'px';
}

/* v8.9(#18627): 상태가 이미 하나 체크돼 있으면(부재·예약·완료·개통완료) 해제·변경 전에 [취소][확인] 확인을 받는다.
   미통화(아무것도 체크 안 됨) → 부재·완료·개통완료 는 예전처럼 1탭 즉시. */
function needsDoneConfirm(prev, target){
  var p = prev || '미통화';
  if(p === '미통화') return false;
  return (target || '미통화') !== p;
}

function needResvAsk(prev){
  var p = prev || '미통화';
  return p !== '미통화' && p !== '예약';
}
function askDoneChange(name, prev, target, onOk){
  var label = target ? stLabel(target) : '미통화';
  openConfirm({
    title: '상태 변경',
    msg: (name || '고객') + ' 님은 이미 ' + stLabel(prev || '완료') + ' 상태예요. ' + label + '로 변경할까요?',
    ok: '확인', cancel: '취소',
    onOk: onOk
  });
}
function applyCustStatus(c, st){
  if(!c || !st || c.status===st) return false;
  var prev = c.status || '미통화';
  c.status = st;
  /* v8.4(#17938): 예약에서 다른 상태로 바뀌면 예약 날짜·시간을 함께 지운다(알람·예약 목록에서 즉시 빠짐) */
  if(st !== '예약'){ c.resDate = ''; c.resTime = ''; }
  if(c.link) c.linkOff = (st !== '개통완료');
  c.comments = c.comments || [];
  c.comments.push(sysCmt('통화상태 '+stLabel(prev)+' → '+stLabel(st)));
  /* v8(#16959): 상태가 바뀌면 알림 훅 — 전용 APK가 있으면 시스템 알림으로 띄운다 */
  notifyBridge('통화 상태 · '+stLabel(st), (c.name||'고객')+' · '+stLabel(prev)+' → '+stLabel(st));
  return true;
}
function keepStatus(id, st){
  var c = ensureCust(id);
  if(!c) return;
  if(st==='예약'){   /* v8.3 */
    if(needResvAsk(c.status)){ askDoneChange(c.name, c.status, '예약', function(){ openSheet({type:'resvdate', target:'cust', id:id}); }); return; }
    openSheet({type:'resvdate', target:'cust', id:id});
    return;
  }
  if(needsDoneConfirm(c.status, st)){   /* v8.9(#18627) */
    askDoneChange(c.name, c.status, st, function(){ keepStatusNow(id, st); });
    return;
  }
  keepStatusNow(id, st);
}
function keepStatusNow(id, st){
  var c = ensureCust(id);
  if(!c) return;
  if(st==='미통화'){
    if(c.status==='부재') applyCustStatus(c, '미통화');
    c.keep = false;
    save(); render();
    toast('부재중 킵에서 뺐어요');
    return;
  }
  applyCustStatus(c, st);
  c.keep = false;
  save(); render();
  toast(c.name+' · '+stLabel(st)+' 표시했어요');
}
function keepTry(id){
  var c = ensureCust(id);
  if(!c) return;
  var prev = c.status;
  c.tries = (c.tries||0)+1;
  c.comments = c.comments||[];
  if(prev!=='부재'){
    c.status = '부재';
    c.resDate = ''; c.resTime = '';   /* v8.4(#17938): 예약 → 부재면 예약 정보도 정리 */
    if(c.link) c.linkOff = true;
    c.comments.push(sysCmt('통화상태 '+stLabel(prev)+' → 부재'));
  }
  c.comments.push(sysCmt('부재 통화 '+c.tries+'회차 — 재통화 필요'));

/* ================= v8.20(#20658): 접어도 보던 글이 화면에서 튀지 않게 ================= */
/* 상단에 붙어 있는 바(.topbar + .feedbar)의 아래 끝 — 글 카드를 이 아래로 맞춘다 */
function feedBarBottom(){
  var y = 0;
  var tb = document.querySelector('.topbar');
  if(tb){ var tr = tb.getBoundingClientRect(); if(tr.height > 0 && tr.bottom > y) y = tr.bottom; }
  var fb = document.querySelector('.feedbar');
  if(fb){
    var fr = fb.getBoundingClientRect();
    /* 필터 줄이 아직 위에 붙기 전(화면 아래쪽에 있을 때)에는 쓰지 않는다 */
    if(fr.height > 0 && fr.top < Math.min(window.innerHeight * 0.45, 320)) y = Math.max(y, fr.bottom);
  }
  return y;
}
/* 지금 화면에서 읽고 있는 글 — 상단 바 아래에 처음 걸치는 카드 */
function feedPostAtTop(){
  var barB = feedBarBottom();
  var cards = document.querySelectorAll('.feed article.post[data-pid]');
  var first = null;
  for(var i = 0; i < cards.length; i++){
    if(!first) first = cards[i];
    if(cards[i].getBoundingClientRect().bottom > barB + 8) return cards[i].getAttribute('data-pid');
  }
  return first ? first.getAttribute('data-pid') : null;
}
/* 다시 그린 뒤 그 카드의 위를 상단 바 바로 아래(여유 14px)에 맞춘다 */
function keepPostInView(pid){
  if(!pid) return;
  var card = document.querySelector('.feed article.post[data-pid="' + pid + '"]');
  if(!card) return;
  var target = feedBarBottom() + 14;
  var y = window.pageYOffset + card.getBoundingClientRect().top - target;
  window.scrollTo(0, Math.max(0, Math.round(y)));
}

/* ================= v8.20(#20646): 앱을 껐다 다시 켜면 홈 피드는 접힌 기본 상태 ================= */
/* 앱 안에서 펼쳤다 접는 동작은 그대로 두고, 화면을 떠났다가 돌아올 때(홈·최근앱·잠금 해제)만 초기화한다. */
var feedAwayAt = 0;     /* 화면을 떠난 시각 */
var feedPickAt = 0;     /* 사진·파일 고르는 중이면 이 시각 기준 3분간은 건드리지 않는다 */
function feedDefault(){
  collapseAll();
  ui.feedAll = false;
  ui.dayShown = 6;
}
function feedAnyOpen(){
  var k;
  for(k in ui.openThreads){ if(ui.openThreads.hasOwnProperty(k)) return true; }
  for(k in ui.openCmts){ if(ui.openCmts.hasOwnProperty(k)) return true; }
  for(k in ui.openReplies){ if(ui.openReplies.hasOwnProperty(k)) return true; }
  return !!ui.feedAll || (+ui.dayShown || 6) > 6;
}
function feedResumeReset(){
  var away = feedAwayAt ? Date.now() - feedAwayAt : 0;
  feedAwayAt = 0;
  if(!session || !state) return;
  if(!$('app') || $('app').hidden) return;
  if(away && away < 1500) return;                 /* 잠깐 다녀온 것(알림 확인 등)은 그대로 둔다 */
  if(feedPickAt && Date.now() - feedPickAt < 180000) return;   /* 사진·파일 고르고 돌아오는 중 */
  if(sheetSpec) return;                            /* 댓글 창·입력 창이 열려 있으면 건드리지 않는다 */
  var ae = document.activeElement;
  if(ae && (/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) || ae.isContentEditable)) return;
  if(!feedAnyOpen()) return;
  /* 홈 피드에서 보고 있었을 때만 화면을 다시 그리고, 보던 글 자리를 지킨다(명단 탭이면 상태만 조용히 비운다) */
  var onFeed = (ui.tab === 'notice');
  var pid = onFeed ? feedPostAtTop() : null;
  feedDefault();
  if(!onFeed) return;
  render();
  keepPostInView(pid);
}
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ feedAwayAt = Date.now(); return; }
  feedResumeReset();
});
/* 앱(WebView)을 다녀왔을 때 visibilitychange 가 오지 않는 경우도 있어 창 포커스도 같이 본다 */
window.addEventListener('blur', function(){ if(!feedAwayAt) feedAwayAt = Date.now(); });
window.addEventListener('focus', function(){ setTimeout(feedResumeReset, 60); });
/* 브라우저가 화면을 얼려 두었다 되살린 경우(뒤로가기 캐시)도 같은 기본 상태로 */
window.addEventListener('pageshow', function(e){ if(e && e.persisted) feedResumeReset(); });
/* 사진·파일 선택창을 여는 순간을 표시 — 돌아올 때 피드를 접지 않는다 */
document.addEventListener('click', function(e){
  var t = e.target;
  if(t && t.tagName === 'INPUT' && t.type === 'file') feedPickAt = Date.now();
}, true);
document.addEventListener('change', function(e){
  var t = e.target;
  if(t && t.tagName === 'INPUT' && t.type === 'file') feedPickAt = 0;
}, true);

/* v8: 1단계 댓글(고객) 상태를 1탭으로 — 같은 칸을 한 번 더 누르면 미통화로 되돌린다 */
function setCmtStatus(pid, cid, st, el){
  var p = findPost(pid);

  (p.comments||[]).forEach(function(x){ if(x.id===cid) c = x; });

/* v5: 사전예약 예약자 한 줄 메모 */
function saveResvMemo(pid, rid){

function changeStatus(id, st){

    openSheet({type:'resvdate', target:'cust', id:id});

  }

  if(needsDoneConfirm(c.status, target)){   /* v8.9(#18627) */

  }
  return changeStatusNow(id, target);
}

function inlineStatus(id, st, el){

    return;
  }

  inlineStatusNow(id, target, el);

function inlineStatusNow(id, target, el){
  var c = ensureCust(id);
  if(!c) return;
  if(!applyCustStatus(c, target)) return;
  save();
  var row = el && el.closest? el.closest('.cust') : null;
  if(!row) row = document.querySelector('.cust[data-id="'+id+'"]');
  if(row){
    row.setAttribute('data-st', target);
    row.classList.toggle('is-done', isDoneSt(target));
    var bs = row.querySelectorAll('.seg-b');
    for(var i=0;i<bs.length;i++){
      var on = bs[i].getAttribute('data-st')===target;
      bs[i].classList.toggle('on', on);
      bs[i].setAttribute('aria-pressed', on? 'true':'false');
    }
    var cnt = row.querySelector('.c-cmt');
    if(cnt) cnt.textContent = '💬 '+(c.comments||[]).length;
    var lk = row.querySelector('.lk-badge');
    if(c.link){
      var html = ledgerBadgeHTML(c.link, isOpenSt(target) && !c.linkOff);
      if(lk) lk.outerHTML = html;
    }
    /* v8.4(#17938): 예약이 풀렸는데 카드에 '⏰ 예약 …' 줄이 남지 않도록 다시 그린다 */
    if(row.querySelector('.c-resv')){ updateCounts(); render(); toast(c.name+' · '+stLabel(target)); return; }
  }
  updateCounts();
  toast(c.name+' · '+stLabel(target));
}
function updateCounts(){
  if(!session) return;
  var list = periodCustomers();
  var n = {};
  STATUSES.forEach(function(s){ n[s] = list.filter(function(c){ return c.status===s; }).length; });
  var stats = document.querySelectorAll('.sstat');
  for(var i=0;i<stats.length;i++){
    var s = stats[i].getAttribute('data-st');
    var b = stats[i].querySelector('b');
    if(b && n[s]!=null) b.textContent = n[s];
  }
  var left = list.filter(function(c){ return !isDoneSt(c.status); }).length;
  var t2 = $('t2n'); if(t2) t2.textContent = left? left : '';
  /* v8.16: 홈·명단 상단 반반 킵 타일 숫자도 같이 새로 */
  var kk = document.querySelector('.k2-n[data-k2="keep"]');
  if(kk){ var kn = absentCount('keep'); kk.textContent = kn; var kt = kk.parentNode.parentNode; if(kt) kt.className = 'k2 k2-abs'+(kn?'':' zero'); }
  var rk = document.querySelector('.k2-n[data-k2="resv"]');
  if(rk){ var rn2 = resvAllCount(); rk.textContent = rn2; var rt = rk.parentNode.parentNode; if(rt) rt.className = 'k2 k2-resv'+(rn2?'':' zero'); }
  var days = document.querySelectorAll('.day[data-day]');
  for(var j=0;j<days.length;j++){
    var day = days[j].getAttribute('data-day');
    var all = custsOfDay(day);
    var dn = all.filter(function(c){ return isDoneSt(c.status); }).length;
    var rest = all.length - dn;
    var hd = days[j].querySelector('.dh-done');
    if(hd){
      hd.innerHTML = rest? '남은 <b>'+rest+'</b>' : '모두 완료';
      hd.classList.toggle('all-done', !rest);
    }
  }
}

function exportData(){

  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});

  var t = e.target;
  if(!t || t.tagName !== 'IMG' || !t.getAttribute || !t.getAttribute('data-thumb')) return;

      if(changeStatus(el.getAttribute('data-id'), el.getAttribute('data-st')) !== false) closeSheet();   /* v8.3: 예약은 모달을 띄우고 시트 유지 */
      break;
    case 'memo-edit':
      ui.memoEdit = el.getAttribute('data-id'); render();
      setTimeout(function(){
        var m = $('memo_'+ui.memoEdit);
        if(m) try{ m.focus({preventScroll:true}); m.setSelectionRange(m.value.length, m.value.length); }catch(e){}
      }, 60);
      break;
    case 'memo-save': saveMemo(el.getAttribute('data-id')); break;
    case 'memo-cancel': ui.memoEdit = null; render(); break;
    case 'add-cust':
      /* v8.12: 명단 추가는 관리자 모드(PIN 0525)에서만 */
      if(!isAdmin()){ toast('고객 추가는 관리자 모드에서만 할 수 있어요', true); break; }
      openSheet({type:'custadd', day: el.getAttribute('data-day') || todayStr()}); break;
    /* v8.17: 오른쪽 아래 + — 직원은 ⏰ 예약 추가, 관리자는 예약/명단 선택 창 */
    case 'staff-add':
      if(isAdmin()){ ui.addPick = 'resv'; openSheet({type:'addpick'}); }
      else openSheet({type:'resvnew'});
      break;
    case 'add-pick':
      ui.addPick = el.getAttribute('data-k')==='cust' ? 'cust' : 'resv';
      renderSheet();
      break;
    case 'resv-tquick':
      var rti = $('resvTime');
      if(rti){ rti.value = el.getAttribute('data-time')||''; }
      var tqb = el.parentNode ? el.parentNode.querySelectorAll('button') : [];
      for(var tqi=0; tqi<tqb.length; tqi++) tqb[tqi].classList.toggle('on', tqb[tqi]===el);
      updateResvWhen();
      break;
    /* v8.12: 고객 삭제 — 관리자 모드에서만, 확인 후 전 직원에게도 반영 */
    case 'cust-del':
      if(!isAdmin()){ toast('고객 삭제는 관리자 모드에서만 할 수 있어요', true); break; }
      var delId = el.getAttribute('data-id'), delC = findCust(delId);
      if(!delC) break;
      openConfirm({title:'고객 삭제',
        msg:(delC.name||'이 고객')+' 님을 명단에서 지울까요?\n전 직원 폰의 730·550·3년 명단에서도 함께 사라집니다.',
        ok:'삭제', cancel:'추소',
        onOk:function(){ deleteCust(delId); }});
      break;
    /* v8.18: 글(공지) 삭제 — 관리자 모드에서만, 확인 후 전 직원 폰에서도 함께 사라지게 */
    case 'post-del':
      if(!isAdmin()){ toast('글 삭제는 관리자 모드에서만 할 수 있어요', true); break; }
      var pdelId = el.getAttribute('data-id'), pdel = findPost(pdelId);
      if(!pdel) break;
      var pdelName = pdel.title || shortText(pdel.body || '', 24) || '이 글';
      openConfirm({title:'글 삭제',
        msg:'「'+pdelName+'」 글을 지울까요?\n전 직원 폰의 홈 피드에서도 함께 사라집니다.',
        ok:'삭제', cancel:'취소',
        onOk:function(){ deletePost(pdelId); }});
      break;
    case 'resv-add': openSheet({type:'resv', id: el.getAttribute('data-id')}); break;
    case 'resv-del':
      var rp = findPost(el.getAttribute('data-pid'));
      if(rp){
        var rid = el.getAttribute('data-rid');
        var target = (rp.reservations||[]).filter(function(r){ return r.id===rid; })[0];
        if(!target) break;
        if(!confirm((target.name||'이 예약')+' 님 예약을 명단에서 지울까요?')) break;
        rp.reservations = (rp.reservations||[]).filter(function(r){ return r.id!==rid; });
        save(); render(); toast('예약을 삭제했어요');
      }
      break;
    case 'attach-del':
      var k = el.getAttribute('data-key'), ix = +el.getAttribute('data-i');
      if(ui.attach[k]){ ui.attach[k].splice(ix,1); if(!ui.attach[k].length) delete ui.attach[k]; }
      render(); break;
    case 'cmp-photo-del':
      ui.composer.photos.splice(+el.getAttribute('data-i'),1); render(); break;
    case 'cmp-kind':
      /* v8.4(#17808): 매장 공지 · 상담 · 사전예약 */
      var nk = el.getAttribute('data-k');
      if(nk==='store' || nk==='consult' || nk==='reserve') ui.composer.kind = nk;
      if(nk==='reserve') ui.composer.pin = true;
      render(); break;
    case 'feed-all':
      ui.feedAll = !ui.feedAll; render(); break;
    case 'cmt-status':
      setCmtStatus(el.getAttribute('data-pid'), el.getAttribute('data-cid'), el.getAttribute('data-st'), el);
      break;
    case 'resv-memo': openResvMemo(el.getAttribute('data-pid'), el.getAttribute('data-rid')); break;
    case 'resv-memo-save': saveResvMemo(el.getAttribute('data-pid'), el.getAttribute('data-rid')); break;
    case 'resv-memo-cancel': ui.resvMemo = null; render(); break;
    case 'submit-post': submitPost(); break;
    case 'staff':
      ui.loginStaff = el.getAttribute('data-name');
      doLogin(); break;   /* v8.2: 이름 1탭으로 바로 입장 */
    case 'key': pressKey(el.getAttribute('data-k')); break;
    case 'pin-focus':
      var pi = $('pinInput'); if(pi) try{ pi.focus({preventScroll:true}); }catch(e){}
      break;
  }
});

document.addEventListener('focusout', function(e){
  var t = e.target;
  if(!t || !t.getAttribute) return;
  if(!(t.getAttribute('data-memo') || t.getAttribute('data-resvmemo') || t.getAttribute('data-keepmemo'))) return;
  setTimeout(function(){
    if(document.activeElement === t) return;
    var ae = document.activeElement;
    if(ae && ae.closest && ae.closest('.c-edit,.rmemo-edit,.k-edit')) return;  /* 저장·취소 버튼으로 이동 */
    cancelInlineEdit();
  }, 220);
});

/* v7: 검색어 입력 — 입력창(#custSearch)은 그대로 두고 목록 영역만 갱신한다(안드로이드 한글 IME 조합 보호) */
function updateCustList(){
  var body = $('custListBody');
  if(!body){ render(); return; }
  body.innerHTML = custListHTML();
}
document.addEventListener('input', function(e){
  var t = e.target;
  if(t.id==='custSearch'){ ui.q = t.value; updateCustList(); return; }
  /* v8.17: 예약 날짜·시간을 고르면 아래 한글 날짜 줄도 바로 바뀐다 */
  if(t.id==='resvDate' || t.id==='resvTime'){ updateResvWhen(); return; }
  var dk = t.getAttribute && t.getAttribute('data-draft');
  if(dk){ ui.drafts[dk] = t.value; }
  if(t.name==='text'){
    var frm = t.closest('form[data-form]');
    if(frm) syncFormBtn(frm);
  }
});
/* v7: 한글 조합 중에는 목록 갱신만 하고 입력창은 건드리지 않는다 */
document.addEventListener('compositionstart', function(e){
  var t = e.target;
  if(t && t.id==='custSearch') ui.composing = true;
});
document.addEventListener('compositionend', function(e){
  var t = e.target;
  if(t && t.id==='custSearch'){
    ui.composing = false;
    ui.q = t.value;
    updateCustList();
  }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if(t.id==='resvDate' || t.id==='resvTime'){ updateResvWhen(); return; }   /* v8.17 */
  if(t.type==='file' && t.getAttribute('data-photo')){ handleFiles(t); return; }
  if(t.id==='cPin'){ ui.composer.pin = !!t.checked; return; }
  if(t.getAttribute && t.getAttribute('data-act')==='fyear'){
    ui.year = t.value;   /* v8.8(#18395): 1~12월을 모두 열어 두어 고른 달을 임의로 바꾸지 않는다 */
    render();
    toast(ui.year==='all'? '전체 연도로 봅니다' : ui.year+'년만 봅니다');
    return;
  }
  if(t.getAttribute && t.getAttribute('data-act')==='fmonth'){
    ui.month = t.value;
    render();
    toast(ui.month==='all'? '전체 월로 봅니다' : (+ui.month)+'월만 봅니다');
    return;
  }
  if(t.getAttribute && t.getAttribute('data-act')==='owner'){
    var c = ensureCust(t.getAttribute('data-id'));
    if(c && c.owner!==t.value){
      c.comments = c.comments||[];
      c.comments.push(sysCmt('담당자 '+(c.owner||'미지정')+' → '+t.value));
      c.owner = t.value;
      save(); render(); toast('담당자를 '+t.value+'님으로 바꿨어요');
    }
    return;
  }
  if(t.getAttribute && t.getAttribute('data-act')==='resv-done'){
    var p = findPost(t.getAttribute('data-pid'));
    if(p){
      var rid = t.getAttribute('data-rid');
      (p.reservations||[]).forEach(function(r){ if(r.id===rid){ r.done = !!t.checked; if(r.link) r.linkOff = !r.done;
        if(t.checked) notifyBridge('사전예약 개통완료', (r.name||'예약자')+' · '+(r.model||''));
      } });
      save(); refreshPostStat(p.id); render(); toast(t.checked?'개통완료로 체크했어요':'개통 체크를 해제했어요');
    }
    return;
  }
});

document.addEventListener('submit', function(e){
  var f = e.target.closest('form[data-form]');
  if(!f) return;
  e.preventDefault();
  var kind = f.getAttribute('data-form');

  if(kind==='login'){ doLogin(); return; }

  /* v8.1(#16813): 관리자 PIN — 맞으면 이 앱의 화면 캡처를 10분 동안 허용 */
  if(kind==='adminpin'){
    var pin = String(new FormData(f).get('pin')||'').trim();
    if(!pin){ toast('관리자 PIN 을 넣어 주세요.', true); return; }
    if(hash('ktband-admin:'+pin) !== ADMIN_HASH){
      toast('관리자 PIN 이 맞지 않아요.', true);
      try{ var inp = f.querySelector('input[name="pin"]'); inp.value=''; inp.focus(); }catch(e){}
      return;
    }
    setAdmin(true);
    closeSheet();
    return;
  }

  if(kind==='cmt' || kind==='reply'){
    var fd = new FormData(f);
    var text = String(fd.get('text')||'').trim();
    var id = f.getAttribute('data-id');
    var ctx = f.getAttribute('data-ctx');
    var mode = f.getAttribute('data-mode')||'';
    var fkey = f.getAttribute('data-key') || (ctx+':'+id);
    var st = ui.cmtStatus[fkey]||'';
    var item = ctx==='cust'? ensureCust(id) : findPost(id);
    if(!item){ toast('대상을 찾지 못했어요.', true); return; }
    if(!text && st) text = st;
    var rpick = ui.cmtRes[fkey];   /* v8.3: 예약 날짜·시간 */
    if(st==='예약' && rpick && rpick.resDate){
      if(ctx==='cust'){ item.resDate = rpick.resDate; item.resTime = rpick.resTime||''; }
    }
    if(mode==='req'){
      if(!st){ toast('통화 상태를 먼저 골라주세요.', true); return; }
      if(!text){ toast('상담 내용을 적어주세요.', true); return; }
    }

    if(kind==='cmt'){
      var photos = ui.attach[fkey]||[];
      if(!text && !photos.length){ toast('내용을 입력해 주세요.', true); return; }
      item.comments = item.comments||[];
      if(ctx==='cust') applyCustStatus(item, st);
      var ncm = {id:uid('c'), author:session.staff, at:nowAt(), text:text, st:st, photos:photos.slice(), replies:[]};
      if(st==='예약' && rpick && rpick.resDate){
        ncm.resDate = rpick.resDate; ncm.resTime = rpick.resTime||'';
        if(rpick.memo){ ncm.memo = rpick.memo; if(ctx==='cust') item.memo = rpick.memo; }
      }
      item.comments.push(ncm);
      ui.openCmts[item.id] = true;
      /* v8.13: 접힌 카드에서 바로 쓴 댓글도 등록하면 바로 보이게 그 글의 댓글을 펼친다 */
      if(ctx==='post') ui.openThreads[item.id] = true;
      delete ui.drafts[fkey]; delete ui.attach[fkey]; delete ui.cmtStatus[fkey]; delete ui.cmtRes[fkey];
      save(); render();
      toast((ctx==='cust'? '통화 기록을 남겼어요' : '댓글을 남겼어요') + (st? ' · '+stLabel(st) : ''));
      notifyBridge(ctx==='cust'? '통화 기록' : '댓글 등록',
                   (ctx==='cust'? (item.name||'고객') : (item.author||'글'))+' · '+shortText(text, 60));
    } else {
      var cid = f.getAttribute('data-cid');
      var parent = (item.comments||[]).filter(function(c){ return c.id===cid; })[0];
      if(!parent){ toast('댓글을 찾지 못했어요.', true); return; }
      if(!text){ toast('답글 내용을 입력해 주세요.', true); return; }
      parent.replies = parent.replies||[];
      if(ctx==='cust') applyCustStatus(item, st);
      parent.replies.push({id:uid('r'), author:session.staff, at:nowAt(), text:text, st:st, photos:[]});
      ui.replyOpen = null;
      ui.openReplies[cid] = true;
      delete ui.drafts[fkey]; delete ui.cmtStatus[fkey];
      save(); render();
      toast('답글을 남겼어요' + (st? ' · '+stLabel(st) : ''));
      notifyBridge('답글 등록', (ctx==='cust'? (item.name||'고객') : (parent.author||'글'))+' · '+shortText(text, 60));
    }
    return;
  }

  if(kind==='custadd'){
    var d = new FormData(f);
    var name = String(d.get('name')||'').trim();
    var phone = String(d.get('phone')||'').trim();
    var day = String(d.get('day')||todayStr());
    if(!name){ toast('고객명을 입력해 주세요.', true); return; }
    var c = {
      id: uid('c'), day: day, name: name, phone: phone,
      bucket: String(d.get('bucket')||'730'),
      owner: String(d.get('owner')||session.staff),
      status: '미통화',
      memo: String(d.get('memo')||'').trim(),
      comments: []
    };
    state.customers.push(c);
    custIdxDirty();
    var autoDone = ledgerApply();
    save(); closeSheet(); render();
    toast(autoDone? name+'님 — 장부에서 개통 확인, 개통완료로 표시했어요' : name+'님을 명단에 추가했어요');
    notifyBridge('명단 추가', name+' · '+day+' · '+c.bucket);
    return;
  }

  /* v8.17: ⏰ 예약 추가 — 날짜·시간을 잡은 '예약' 고객을 명단에 바로 넣는다.
     · 구분(bucket)은 '예약' → 730·550·3년 필터를 어지럽히지 않는다
     · day = 예약 날짜 → 그 날짜가 되면 명단(오늘 남은 콜)에도 자연스럽게 올라온다
     · 예약 킵·예약 필터·예약 알람은 모두 status '예약' + resDate 를 읽으므로 세 곳에 함께 잡힌다 */
  if(kind==='resvnew'){
    var nf = new FormData(f);
    var rn2 = String(nf.get('name')||'').trim();
    var rp2 = String(nf.get('phone')||'').trim();
    var rd2 = String(nf.get('date')||'').trim();
    var rt2 = String(nf.get('time')||'').trim();
    var rm2 = String(nf.get('memo')||'').trim();
    var ro2 = String(nf.get('owner')||session.staff);
    if(!rd2){ toast('예약 날짜를 골라 주세요.', true); return; }
    if(!rn2){ toast('고객명을 입력해 주세요.', true); return; }
    if(!digits(rp2)){ toast('연락처를 입력해 주세요.', true); return; }
    if(rt2 && !/^\d{2}:\d{2}$/.test(rt2)) rt2 = '';
    var nc = { id: uid('c'), day: rd2, name: rn2, phone: rp2, bucket: '예약', owner: ro2,
               status: '예약', resDate: rd2, resTime: rt2, memo: rm2,
               keep: false, tries: 0, resOnly: true, at: nowAt(), comments: [] };
    nc.comments.push(sysCmt('예약 추가 · '+resvText(nc)));
    state.customers.push(nc);
    custIdxDirty();
    save();
    /* 저장한 예약이 바로 보이게 예약 목록으로 */
    ui.tab = 'band'; ui.filter = 's:예약';
    closeSheet(); render();
    toast(rn2+'님 예약 · '+resvText(nc)+' — 예약 킵에 담았어요');
    notifyBridge('⏰ 예약 추가', rn2+' · '+resvText(nc));
    scheduleResvAlarm(rd2, rt2, '⏰ 예약 알람', rn2+' · '+resvText(nc));
    return;
  }

  if(kind==='resvdate'){   /* v8.3: 예약 날짜·시간 저장 */
    var rd0 = new FormData(f);
    var rdate = String(rd0.get('date')||'').trim();
    var rtime = String(rd0.get('time')||'').trim();
    var rmemo = String(rd0.get('memo')||'').trim();   /* v8.4(#17916) */
    var rtgt = f.getAttribute('data-target')||'cust';
    if(!rdate){ toast('예약 날짜를 골라 주세요.', true); return; }
    if(rtime && !/^\d{2}:\d{2}$/.test(rtime)) rtime = '';
    if(rtgt==='cmtnew'){
      var rkey = f.getAttribute('data-key')||'';
      ui.cmtRes[rkey] = {resDate:rdate, resTime:rtime, memo:rmemo};
      ui.cmtStatus[rkey] = '예약';   /* 댓글 작성창 칩도 예약으로 켜 둔다 */
      closeSheet(); render();
      toast('예약 · '+resvText({resDate:rdate, resTime:rtime})+' — 댓글을 등록하면 함께 저장돼요');
      return;
    }
    var rObj = null, rName = '';
    if(rtgt==='cust'){
      rObj = ensureCust(f.getAttribute('data-id'));
      rName = rObj ? (rObj.name||'고객') : '';
    } else {
      var rp1 = findPost(f.getAttribute('data-pid'));
      (rp1 && rp1.comments || []).forEach(function(x){ if(x.id===f.getAttribute('data-cid')) rObj = x; });
      rName = rObj ? (rObj.author||'댓글') : '';
    }
    if(!rObj){ toast('대상을 찾지 못했어요.', true); return; }
    var prevSt = rtgt==='cust'? (rObj.status||'미통화') : (rObj.st||'');
    rObj.resDate = rdate; rObj.resTime = rtime;
    rObj.memo = rmemo;   /* v8.4(#17916): 예약 메모를 고객 카드·댓글 메모로 함께 저장 */
    if(rtgt==='cust'){
      rObj.status = '예약';
      if(rObj.link) rObj.linkOff = true;
      rObj.comments = rObj.comments||[];
      rObj.comments.push(sysCmt('통화상태 '+stLabel(prevSt)+' → 예약 · '+resvText(rObj)));
    } else {
      rObj.st = '예약'; rObj.stBy = session.staff; rObj.stAt = nowAt();
    }
    save(); closeSheet(); render();
    notifyBridge('⏰ 예약 알람 · '+resvText(rObj), rName + ' · 예약을 걸어 두었어요');
    scheduleResvAlarm(rdate, rtime, '⏰ 예약 알람', rName+' · '+resvText(rObj));
    toast('예약 · '+resvText(rObj)+' 알람을 걸었어요');
    return;
  }

  if(kind==='resvadd'){
    var rd = new FormData(f);
    var rname = String(rd.get('name')||'').trim();
    if(!rname){ toast('고객명을 입력해 주세요.', true); return; }
    var post = findPost(f.getAttribute('data-id'));
    if(!post){ toast('공지를 찾지 못했어요.', true); return; }
    post.reservations = post.reservations||[];
    post.reservations.push({
      id: uid('r'), name: rname,
      phone: String(rd.get('phone')||'').trim(),
      model: String(rd.get('model')||'').trim(),
      owner: String(rd.get('owner')||session.staff),
      memo: String(rd.get('memo')||'').trim(),
      at: nowAt(),
      done: false
    });
    ledgerApply();
    save();
    sheetSpec = {type:'post', id:post.id};
    render();
    toast(rname+'님 사전예약을 추가했어요');
    return;
  }

  if(kind==='memo'){
    var md = new FormData(f);
    var cc = ensureCust(f.getAttribute('data-id'));
    if(cc){
      cc.memo = String(md.get('memo')||'').trim();
      save();
      if(sheetSpec && sheetSpec.type==='cust'){ render(); }
      else { closeSheet(); render(); }
      toast('메모를 저장했어요');
      notifyBridge('메모 저장', (cc.name||'고객')+' · '+shortText(cc.memo||'', 60));
    }
    return;
  }
});

document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    if($('lightbox').classList.contains('on')){ closeLB(); }
    else if(ui.resvMemo){ ui.resvMemo = null; render(); }
    else if(ui.memoEdit){ ui.memoEdit = null; render(); }
    else if(sheetSpec){ closeSheet(); }
    return;
  }
  if(e.target && e.target.getAttribute && e.target.getAttribute('data-memo') && e.key==='Enter'){
    e.preventDefault();
    saveMemo(e.target.getAttribute('data-memo'));
    return;
  }
  if(e.target && e.target.getAttribute && e.target.getAttribute('data-resvmemo')){
    if(e.key==='Enter'){
      e.preventDefault();
      saveResvMemo(e.target.getAttribute('data-pid'), e.target.getAttribute('data-resvmemo'));
      return;
    }
    if(e.key==='Escape'){
      e.preventDefault();
      ui.resvMemo = null; render();
      return;
    }
  }
  if(e.target && e.target.getAttribute && e.target.getAttribute('data-keepmemo') && e.key==='Enter'){
    e.preventDefault();
    saveKeepMemo(e.target.getAttribute('data-keepmemo'));
    return;
  }
  if(e.key==='Enter' && e.target && e.target.tagName==='INPUT' && e.target.name==='text'){
    var form = e.target.closest('form[data-form="cmt"],form[data-form="reply"]');
    if(form){ e.preventDefault(); if(form.requestSubmit) form.requestSubmit(); else form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true})); }
  }
  if(e.target && e.target.id==='pinInput' && e.key==='Enter'){
    e.preventDefault(); doLogin();
  }
});

/* ================= init ================= */
/* v8.7(#18345): 새 버전이 배포되면 앱을 껐다 켜지 않아도 화면이 저절로 최신으로 바뀐다.
   · 앱을 열 때·화면으로 돌아올 때·켜 둔 동안 1분마다 새 버전을 확인(reg.update)
   · 새 서비스워커가 이 화면을 넘겨받으면(controllerchange) 한 번만 새로고침 */
var swReg = null;
var swLastCheck = 0;
var swReloading = false;
var swHadController = false;
try{ swHadController = !!(navigator.serviceWorker && navigator.serviceWorker.controller); }catch(e){}

function swReloadForUpdate(){
  if(swReloading) return;
  swReloading = true;
  try{
    var last = parseInt(sessionStorage.getItem('ktBandSwReload')||'0', 10) || 0;
    if(Date.now() - last < 20000) return;   /* 무한 새로고침 방지 */
    sessionStorage.setItem('ktBandSwReload', String(Date.now()));
  }catch(e){}
  /* 글 쓰는 중이면 저장이 날아가지 않게, 입력칸에서 손을 뗀 뒤 새로고침 */
  var ae = document.activeElement;
  var typing = ae && (/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) || ae.isContentEditable);
  if(typing){
    try{ toast('새 버전이 준비되었습니다 — 입력을 마치면 화면이 새로 고쳐집니다.'); }catch(e){}
    document.addEventListener('focusout', function(){ setTimeout(function(){ location.reload(); }, 500); }, {once:true});
    return;
  }
  location.reload();
}

function swCheckUpdate(){
  if(!swReg) return;
  var now = Date.now();
  if(now - swLastCheck < 60000) return;   /* 1분에 한 번만 확인 */
  swLastCheck = now;
  try{ swReg.update(); }catch(e){}
}

function registerSW(){
  if('serviceWorker' in navigator && location.protocol!=='file:'){
    try{
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(!swHadController) return;   /* 첫 설치 때는 새로고침하지 않는다 */
        swReloadForUpdate();
      });
      navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(function(reg){
        swReg = reg;
        swCheckUpdate();
      }).catch(function(){});
      document.addEventListener('visibilitychange', function(){ if(!document.hidden) swCheckUpdate(); });
      window.addEventListener('focus', swCheckUpdate);
      setInterval(function(){ if(!document.hidden) swCheckUpdate(); }, 60000);
    }catch(e){}
  }
}
function init(){
  session = loadSession();
  state = loadState();
  ledgerLoad();
  archInit();   /* v8: 과거 전체 명단(archive.json)을 백그라운드로 받아 IndexedDB에 */
  if(session){
    /* 저장해 둔 장부 캐시로 먼저 대조 — 네트워크 없이도 바로 반영 */
    if(ledgerApply()) save();
    ledger.lastNew = 0;
  }
  renderLogin();
  if(session){
    $('login').hidden = true;
    $('app').hidden = false;
    ui.loginStaff = session.staff;
    render();
    var pi = $('pinInput'); if(pi) try{ pi.blur(); }catch(e){}
    /* v8.12: 장부(5.2MB) 대조는 첫 화면을 그린 뒤 한가할 때 — 앱이 바로 뜨고, 스크롤·사진이 먼저다.
       실제 조회는 4분에 한 번만 하고, 바뀐 고객이 있을 때만 화면을 다시 그린다. */
    if(window.requestIdleCallback){
      requestIdleCallback(function(){ ledgerSync(false); }, {timeout: 3000});
    } else {
      setTimeout(function(){ ledgerSync(false); }, 1500);
    }
    syncStart();   /* v8.9: 전 직원 실시간 공유 — 앱을 열 때 바로 한 번 받아온다 */
    setTimeout(resvNotifyDue, 1200);   /* v8.3: 오늘·지난 예약은 앱을 열 때 한 번 알림 */
  } else {
    $('login').hidden = false;
    $('app').hidden = true;
    var p2 = $('pinInput');
    if(p2) try{ p2.focus({preventScroll:true}); }catch(e){}
  }
  /* v8.1(#16813): 전용 앱에는 지금이 '직원 화면 = 캡처 차단'임을 먼저 알린다.
     관리자 PIN 을 넣어 관리자 모드가 되면 setAdmin(true) 가 다시 허용으로 바꾼다. */
  applyCapture();
  setInterval(adminTick, 20 * 1000);
  setInterval(function(){ if(session && !document.hidden) ledgerSync(false); }, 5*60*1000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ adminTick(); ledgerSync(false); } });
  registerSW();
}
init();

})();
</script>
