  .nl-title{font-size:15.5px}
}
  /* ================= v8.3: 생년월일 · 예약 알람 ================= */
  /* v8.6(#18220·#18232): 생년월일은 전화번호 바로 옆 같은 줄 — 박스·테두리 없이 전화번호와 같은 텍스처,
     숫자가 붙어 보이지 않도록 사이는 넉넉히 띄운다 */
  .c-birth{flex:none;display:inline-flex;align-items:baseline;gap:5px;padding:10px 0;border:0;border-radius:0;background:none;
    color:#0F172A;font-size:15.5px;font-weight:700;letter-spacing:.005em;
    white-space:nowrap;font-variant-numeric:tabular-nums}
  /* v8.4(#17833·#17844): 만 나이는 옆에 작게 */
  .c-birth em{font-style:normal;font-size:12px;font-weight:500;color:#64748B;letter-spacing:0}
  .c-birth.none{border:0;background:none;color:var(--hint);font-weight:600;font-size:13px}
  .c-resv{display:inline-flex;align-items:center;gap:5px;margin:6px 0 0;padding:4px 9px;border-radius:9px;
    background:#E8F0FE;color:var(--kt-blue);font-size:12px;font-weight:800;letter-spacing:-.01em}
  .c-resv.late{background:var(--no-call-bg);color:var(--no-call-ink)}
  .cd-birth{font-size:15px;font-weight:700;color:var(--ink-2);flex:1}
  .cd-birth em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--hint);margin-left:6px}
  .cmt-resv{display:inline-flex;align-items:center;gap:4px;margin:2px 0 6px;padding:3px 8px;border-radius:8px;
    background:#E8F0FE;color:var(--kt-blue);font-size:11.5px;font-weight:800}
  /* 예약 알람 카드 */
  .resvalarm{margin:10px 0 2px;padding:12px 12px 8px;border-radius:14px;background:#FFF7EA;
    border:1px solid #FBD9A5;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .ra-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 8px}
  .ra-head b{font-size:14.5px;font-weight:800;color:#8A4B08;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
  .ra-n{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 6px;
    border-radius:999px;background:#F59E0B;color:#fff;font-size:12px;font-weight:800}
  .ra-sub{font-size:11.5px;font-weight:700;color:#B0741F}
  .ra-list{display:grid;gap:6px}
  .ra-row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px;width:100%;
    padding:9px 10px;border-radius:11px;border:1px solid #FDE6C4;background:#fff;text-align:left}
  .ra-row:hover{background:#FFFCF6}
  .ra-when{font-size:12px;font-weight:800;color:var(--kt-blue);white-space:nowrap}
  .ra-when.late{color:var(--no-call-ink)}
  .ra-name{font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ra-name i{font-style:normal;font-size:10.5px;font-weight:800;color:var(--no-call-ink);background:var(--no-call-bg);
    padding:1px 5px;border-radius:6px;margin-left:4px}
  .ra-phone{font-size:12px;font-weight:600;color:var(--hint);white-space:nowrap}
  .ra-go{font-size:12px;font-weight:800;color:var(--kt-blue);white-space:nowrap}
  .ra-more{margin:6px 2px 0;background:none;border:0;padding:0;font-size:12px;font-weight:700;color:#B0741F}
  /* 예약 날짜·시간 시트 */
  .resvform{padding:2px 2px 6px}
  .resvform .rf-who{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--blue-weak);
    color:var(--kt-blue);font-size:13.5px;font-weight:800;margin-bottom:12px;letter-spacing:-.01em}
  .resvform .rf-quick{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
  .resvform .rf-quick button{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;
    font-size:13px;font-weight:700;color:var(--ink-2)}
  .resvform .rf-quick button.on{background:var(--blue-weak);border-color:#A8C7FA;color:var(--kt-blue);font-weight:800}
  .resvform label{display:block;margin-bottom:12px}
  .resvform label > span{display:block;font-size:12.5px;font-weight:800;color:var(--hint);margin-bottom:6px}
  /* v8.17: 글자 입력·선택·메모도 폭을 꽉 채운다(예전엔 기본 폭이라 반만 차지했다) */
  .resvform label > input,.resvform label > select,.resvform label > textarea{width:100%}
  .resvform input[type=date],.resvform input[type=time]{width:100%;height:46px;border:1px solid var(--line);
    border-radius:12px;padding:0 12px;font-size:15px;font-weight:700;color:var(--ink);background:#fff}
  .resvform input:focus{outline:none;border-color:var(--blue)}
  .resvform .rf-btns{display:grid;gap:8px;margin-top:4px}
  .resvform .rf-btns .btn.lg{height:48px}
  .resvform .rf-cancel{height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:14px;
    font-weight:700;color:var(--red)}
  .resvform .rf-cur{margin:0 0 12px;padding:9px 12px;border-radius:11px;background:var(--gray-bg);
    font-size:12.5px;font-weight:700;color:var(--ink-2)}
  @media (max-width:420px){
    .ra-row{grid-template-columns:auto 1fr;row-gap:4px}
    .ra-phone,.ra-go{font-size:11.5px}
  }

  /* ================= v8.4: 홈 피드 정리(매장 공지·상담·사전예약) ================= */
  .feedmore{display:block;width:100%;margin:2px 0 6px;padding:13px 12px;border-radius:12px;border:1px solid var(--line);
    background:#fff;color:var(--kt-blue);font-size:13.5px;font-weight:800;letter-spacing:-.01em}
  .feedmore:hover{background:#F5F9FF}
  .cmtbanner{background:#FEF2F2;border:1px solid #FBD5D5}
  .cmtbanner b{color:#B91C1C}
  .cmtbanner span b{color:#B91C1C}
  /* v8.4: 좁은 화면에서 필터 칩 4개가 다 보이게 — '모두 펼치기'는 윗줄 오른쪽으로 */
  @media (max-width:520px){
    .feedbar{flex-wrap:wrap;row-gap:6px}
    .feedbar .filterbar{order:2;flex:1 1 100%;padding-bottom:12px}
    .feedbar .collapsebtn{order:1;margin-left:auto;height:32px;padding:0 11px;font-size:12px}
  }

  /* ================= v8.4(#17870): 명단 상단 필터 정리 ================= */
  .cf-row{display:flex;align-items:center;gap:6px;min-width:0;margin:0 0 8px}
  .cf-buckets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .cf-status{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .cf-row .fchip{width:100%;display:inline-flex;align-items:center;justify-content:center;
    padding:0 4px;height:36px;font-size:13px;font-weight:700}
  .cf-status .fchip{font-size:12.5px;letter-spacing:-.02em}
  .qfull{display:flex;width:100%;flex:none;margin:0 0 14px}
  .qfull input{width:100%;min-width:0;flex:1;font-size:13.5px}
  .c-top{gap:7px}
  .c-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:420px){
    .cf-row .fchip{height:34px;font-size:12.5px;padding:0 3px}
    .cf-status .fchip{font-size:12px}
  }
  @media (max-width:340px){
    .cf-status .fchip{font-size:11.5px;padding:0 2px;letter-spacing:-.03em}
    .cf-row .fchip{font-size:12px}
  }

  /* ================= v8.4(#17927): 상태별 바로 보기 목록 ================= */
  .flathead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;padding:12px 14px;
    border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .flathead b{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.02em;display:inline-flex;align-items:center;gap:6px}
  .flathead .n{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 7px;
    border-radius:999px;background:var(--kt-blue);color:#fff;font-size:12px;font-weight:800}
  .flathead small{flex:1;min-width:0;font-size:11.5px;font-weight:700;color:var(--hint)}
  .flatback{flex:none;height:32px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:#fff;
    font-size:12.5px;font-weight:800;color:var(--kt-blue)}
  .resvlist{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
  .rrowline{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;width:100%;
    padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;text-align:left}
  .rrowline:hover{background:#F7FAFF;border-color:#D5E3F8}
  .rl-when{font-size:13.5px;font-weight:800;color:var(--kt-blue);white-space:nowrap;letter-spacing:-.01em}
  .rl-when.late{color:var(--no-call-ink)}
  .rl-main{display:flex;flex-direction:column;gap:2px;min-width:0}
  .rl-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rl-name{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.02em;display:inline-flex;align-items:center;gap:6px}
  .rl-phone{font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap}
  .rl-memo{grid-column:1/-1;font-size:12.5px;font-weight:600;color:var(--hint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rl-late{font-size:11px;font-weight:800;color:var(--no-call-ink);background:var(--no-call-bg);
    padding:2px 7px;border-radius:7px;white-space:nowrap}
  .ra-head{width:100%;background:none;border:0;text-align:left;cursor:pointer}
  .ra-memo{grid-column:1/-1;font-size:11.5px;font-weight:600;color:#B0741F;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .krow.cmtrow{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff}
  .krow.cmtrow .k-top{display:flex;align-items:center;gap:6px}
  .k-src{flex:none;font-size:10.5px;font-weight:800;color:#B45309;background:#FEF3C7;padding:2px 6px;border-radius:6px}
  /* v8.4: 생년월일은 이름 바로 옆에, 📌은 오른쪽 끝으로 */
  .c-top .c-name{flex:0 1 auto;min-width:0}
  .c-top .kpin{margin-left:auto}

  /* ================= v8.6(#18220·#18232): 📞 번호 바로 옆 생년월일 ================= */
  /* 번호 묶음은 절대 쪼개지 않고(nowrap), 공간이 모자랄 때만 생년월일이 다음 줄로 내려간다 */
  .c-mid{gap:8px}
  .c-nums{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 16px;min-width:0;flex:1 1 auto}
  .c-nums .c-phone:not(.quiet){flex:none;white-space:nowrap;color:#0F172A}
  .c-nums .c-birth.none{color:var(--faint)}
  .cust.is-done .c-birth{color:var(--hint)}
  @media (max-width:430px){
    .c-nums{gap:2px 14px}
    .c-nums .c-birth,.c-birth{font-size:15px;padding:10px 0}
  }

  /* ================= v8.10: 글 카드 통화 상태 집계 · 고객 시트 댓글 한 줄 ================= */
  /* 처리완료 버튼을 뺀 자리 — 이 글 안 1단계 댓글의 상태별 건수를 칩으로 (건수 있는 것만) */
  .post-actions{flex-wrap:wrap;row-gap:6px}
  .pstat{margin-left:auto;display:inline-flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:5px}
  .pst{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 8px;border-radius:8px;
    font-size:11.5px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;
    background:var(--gray-bg);color:var(--ink-2)}
  .pst b{font-size:12px;font-weight:900}
  .pst[data-st="미통화"]{background:var(--no-call-bg);color:var(--no-call-ink)}
  .pst[data-st="부재"]{background:var(--absent-bg);color:var(--absent-ink)}
  .pst[data-st="예약"]{background:#E8F0FE;color:var(--kt-blue)}
  .pst[data-st="완료"]{background:#E9F6EF;color:var(--done-ink)}
  .pst[data-st="개통완료"]{background:var(--open-bg);color:var(--open-ink)}
  @media (max-width:430px){
    .pst{height:23px;padding:0 7px;font-size:11px}
    .pst b{font-size:11.5px}
  }

  /* ================= v8.13: 댓글 사진(바로 촬영·앨범) · 접힌 카드 바로 댓글 · 고정 배지 ================= */
  /* 댓글 줄 📷 을 누르면 뜨는 작은 메뉴 — 줄 폭을 늘리지 않는다 */
  .pmenu{position:fixed;z-index:66;min-width:172px;padding:6px;border-radius:14px;background:#fff;
    border:1px solid #E3E9F0;box-shadow:0 12px 28px rgba(15,23,42,.18),0 2px 6px rgba(15,23,42,.08);
    animation:pmIn .12s ease-out}
  @keyframes pmIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .pmenu button{display:flex;align-items:center;gap:10px;width:100%;height:48px;padding:0 12px;border:0;border-radius:10px;
    background:none;font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.02em;text-align:left;cursor:pointer}
  .pmenu button:hover{background:#F5F8FC}
  .pmenu button:active{background:#EAF0F7}
  .pmenu button i{font-style:normal;font-size:18px;line-height:1;flex:none}

  /* 접힌 글 카드의 바로 댓글 줄 — 펼친 카드의 입력칸과 같은 높이·모양 */
  .cbar.qbar{margin-top:4px;padding-bottom:16px}
  .cbar.qbar input{background:#F5F8FC}
  .cbar.qbar .send[disabled]{opacity:.38}

  /* '전체' 피드에서도 고정 글임을 알리는 배지 */
  .pinbadge{flex:none;display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:8px;
    background:#FFF3D6;color:#8A5B00;font-size:11.5px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
  @media (max-width:400px){
    .pinbadge{height:22px;padding:0 7px;font-size:11px}
    .pmenu button{height:46px;font-size:14.5px}
  }

  /* ================= v8.13: 730·550·3년 고객 카드 메모 — 시인성·터치감 ================= */
  /* 빈 메모: 연한 테두리 입력 박스(최소 40px) / 적힌 메모: 연노랑 박스 + 진한 글씨 */
  .c-memo{display:flex;align-items:flex-start;gap:7px;width:100%;min-height:40px;margin-top:4px;
    padding:9px 11px;border-radius:11px;border:1px solid #F2E3B6;background:#FFF9E8;
    font-size:14.5px;font-weight:700;line-height:1.45;letter-spacing:-.01em;color:#4A3B12;
    text-align:left;white-space:normal;overflow:visible;text-overflow:clip;flex:none}
  .c-memo .c-memo-ic{flex:none;font-size:14px;line-height:1.5}
  .c-memo .c-memo-t{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;white-space:normal;word-break:break-word}
  .c-memo.empty{background:#F7F9FC;border:1px dashed #C7D2DF;color:#5C6B7F;font-weight:700}
  .c-memo.empty .c-memo-ic{filter:grayscale(1);opacity:.6}
  .c-memo:hover{background:#FFF4D6;border-color:#E7CE8C}
  .c-memo.empty:hover{background:#EEF3F9;border-color:#AEBECD;color:#33414F}
  .c-memo:active{transform:scale(.995)}
  .cust.is-done .c-memo.has{color:#4A3B12;opacity:.92}
  @media (max-width:400px){
    .c-memo{font-size:14px;min-height:38px;padding:8px 10px}
  }

  /* ================= v8.14: 담당자는 이름 옆(좌측 상단) · 메모는 카드 하단 한 줄 ================= */
  .cust .c-top .c-name{flex:0 1 auto}
  .c-topsp{flex:1 1 auto;min-width:0}
  .c-owner.sm{height:32px;padding:0 8px;border-radius:9px;background:#F2F5FA;gap:5px;margin-top:0}
  .c-owner.sm select{font-size:12px;font-weight:800;max-width:78px}
  .c-owner.sm::after{font-size:8px;margin-left:-3px}
  .c-owner.sm .ownerdot{width:6px;height:6px}
  .c-memo{margin-top:9px}
  @media (max-width:400px){
    .c-owner.sm{height:30px;padding:0 7px}
    .c-owner.sm select{font-size:11.5px;max-width:70px}
    .c-memo{margin-top:8px}
  }

  /* ================= v8.17: + 로 예약 추가(전 직원) · 예약 구분 배지 ================= */
  /* 구분 '예약' — 730(파랑)·550(초록)·3년(보라)과 겹치지 않는 하늘색 */
  .bresv{--bk-bg:#E8F0FE;--bk-ink:#0B57D0;--bk-line:#A8C7FA}

  /* 관리자 + 창 상단 탭: ⏰ 예약 추가 | 📋 명단 추가 */
  .addtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 16px}
  .addtab{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"ico lb" "ico sm";
    align-items:center;column-gap:8px;min-width:0;padding:10px 12px;border-radius:13px;
    border:1px solid var(--line);background:#fff;text-align:left;font-size:14px;font-weight:800;
    color:var(--ink-2);letter-spacing:-.02em;transition:background .12s,border-color .12s}
  .addtab i{grid-area:ico;font-style:normal;font-size:19px;line-height:1}
  .addtab small{grid-area:sm;font-size:11px;font-weight:700;color:var(--hint);letter-spacing:-.01em}
  .addtab:hover{background:#FAFBFC}
  .addtab.on{background:var(--blue-weak);border-color:#8FB6F0;color:var(--blue-deep)}
  .addtab.on small{color:var(--blue-deep)}
  @media (max-width:400px){
    .addtab{padding:9px 10px;font-size:13px;column-gap:6px}
    .addtab i{font-size:17px}
    .addtab small{font-size:10.5px}
  }

  /* 필수 표시 · 시간 빠른 선택 · 안내 한 줄 */
  .resvform .req{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:6px;
    background:#FEE2E2;color:#B91C1C;font-size:10.5px;font-weight:800;vertical-align:1px}
  .resvform .rf-quick + .fgrid{margin-top:-4px}
  .resvform .rf-tquick{margin:-4px 0 14px}
  .resvform .rf-tquick button.on{background:var(--blue-weak);border-color:#A8C7FA;color:var(--kt-blue);font-weight:800}
  .resvform .rf-tip{margin:2px 0 12px;padding:9px 11px;border-radius:11px;background:#F4F8FF;
    border:1px solid #DCE8FA;font-size:12px;font-weight:600;color:#3B5578;line-height:1.5}
  .resvform .rf-tip b{color:var(--kt-blue)}
  @media (max-width:400px){
    .resvform .fgrid{grid-template-columns:1fr;gap:0}
  }

  /* 검색 결과 상단 — 기간 밖 예약 */
  .srchresv{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 2px 8px}
  .srchresv b{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--kt-blue)}
  .srchresv .n{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:19px;
    padding:0 6px;border-radius:999px;background:var(--kt-blue);color:#fff;font-size:11.5px;font-weight:800}
  .srchresv small{font-size:11px;font-weight:700;color:var(--hint)}

  @media (max-width:400px){
    .rl-when{font-size:12.5px;letter-spacing:-.02em}
    .ra-when{font-size:11.5px;letter-spacing:-.02em}
    .c-resv{font-size:11.5px;padding:4px 8px}
  }

  /* v8.17: 고른 예약 날짜를 한국어로 — '2026년 11월 28일 (토) · 오후 2:00' */
  .resvform .rf-when{margin:-2px 0 14px;padding:8px 11px;border-radius:10px;background:#E8F0FE;
    color:var(--kt-blue);font-size:12.5px;font-weight:800;letter-spacing:-.01em;
    display:flex;align-items:center;gap:6px}
  .resvform .rf-when::before{content:'📅';font-size:13px;line-height:1}

  /* ================= v8.19(#20470): 피드 미리보기 댓글 → 댓글 창 ================= */
  .cmt-preview{position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .cmt-preview:active{background:#F3F7FD;border-radius:12px}
  .cmt-preview .cp-go{margin-left:auto;flex:none;font-size:11.5px;font-weight:800;color:var(--kt-blue);
    background:#EAF1FB;padding:2px 8px;border-radius:999px;white-space:nowrap;letter-spacing:-.02em}

  /* ================= v8.19(#20482): 들어온 댓글까지 스크롤 + 잠깐 강조 ================= */
  .cmt.cmt-flash{animation:cmtflash 2.4s ease-out;border-radius:12px}
  @keyframes cmtflash{
    0%{background:#FFF6D6;box-shadow:inset 0 0 0 2px #F0B429}

function birthISO(raw){
  var s = String(raw||'').replace(/\s+/g,'');
  if(!s) return '';
  var m, y=0, mo=0, d=0;
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/))){ y=+m[1]; mo=+m[2]; d=+m[3]; }
  else if((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))){ y=+m[1]; mo=+m[2]; d=+m[3]; }

    var g = m[4], yy = +m[1]; mo=+m[2]; d=+m[3];
    if('12569'.indexOf(g)>=0) y = 1900+yy;
    else if('34780'.indexOf(g)>=0) y = 2000+yy;
    else if(g==='9'||g==='0') y = 1800+yy;

  else if((m = s.match(/^(\d{2})(\d{2})(\d{2})$/))){

function minsAgo(m){ var d=new Date(Date.now()-m*60000); return todayStr(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }

/* ================= seed (v8 실데이터) ================= */
/* 기본 시드 = 실제 밴드 '칠금점 가망고객' 글 67건·댓글 1,041건 + 최근 90일(2026-09-01~11-25) 고객 1,942건.
   index.html 안의 <script id="seedV8" type="application/json"> 에 그대로 들어 있어서
   인터넷이 없어도 첫 실행부터 실제 명단이 뜹니다. v1~v7의 가짜 샘플(홍길동 등)은 시드에서 완전히 빠졌습니다. */
var SEED_VER = 8;

function seedRaw(){
  var el = document.getElementById('seedV8');
  var d = null;
  try{ d = JSON.parse(el ? el.textContent : '{}'); }catch(e){ d = null; }
  if(!d || !Array.isArray(d.posts) || !Array.isArray(d.customers)) d = {v:1, seedVersion:SEED_VER, posts:[], customers:[]};
  return d;
}
/* 시드에 없는 id(댓글·답글)를 채우고 빠진 배열을 만들어 둔다 — 화면 코드가 id 로 상태를 다루기 때문 */
function normalizeSeed(d){
  (d.posts||[]).forEach(function(p, pi){
    p.photos = p.photos || [];
    p.reservations = p.reservations || [];
    p.comments = p.comments || [];
    p.comments.forEach(function(c, ci){
      if(!c.id) c.id = 'p'+(pi+1)+'c'+(ci+1);
      c.photos = c.photos || [];
      c.replies = c.replies || [];
      c.replies.forEach(function(r, ri){
        if(!r.id) r.id = 'p'+(pi+1)+'c'+(ci+1)+'r'+(ri+1);
        r.photos = r.photos || [];
      });
    });
  });
  (d.customers||[]).forEach(function(c, ci){
    if(!c.id) c.id = 'c-seed-'+ci;
    if(!c.status) c.status = '미통화';
    if(c.resDate===undefined) c.resDate = '';   /* v8.3 */
    if(c.resTime===undefined) c.resTime = '';
    c.comments = c.comments || [];
    (c.comments||[]).forEach(function(x, xi){
      if(!x.id) x.id = c.id+'-x'+(xi+1);
      x.photos = x.photos || [];
      x.replies = x.replies || [];
    });
  });
  d.seedVersion = SEED_VER;
  return d;
}
function seed(){ return normalizeSeed(seedRaw()); }

/* 매일 09:00 새 시드(오늘 명단·오늘 올린 밴드 글)가 배포돼도, 이 기기에 이미 저장된 상태·메모는 그대로 두고
   저장본에 없는 글·고객만 덧붙인다(같은 id 는 손대지 않음, 삭제 없음).
   v8.12: 관리자가 삭제한 고객은 다시 살아나지 않게 건너뛴다. */
function mergeSeed(d, s){
  var pids = {}, cids = {}, added = 0;
  (d.posts||[]).forEach(function(p){ pids[p.id] = 1; });
  (d.customers||[]).forEach(function(c){ cids[c.id] = 1; });
  (s.posts||[]).forEach(function(p){ if(!pids[p.id] && !isPostDeleted(p.id, d)){ d.posts.push(p); added++; } });
  (s.customers||[]).forEach(function(c){ if(!cids[c.id] && !isCustDeleted(c.id, d)){ d.customers.push(c); added++; } });
  return added;
}
/* v8.3: 예전에 저장된 명단(같은 id)에 비어 있는 생년월일만 시드 값으로 채운다. 한 번만. */
var BIRTH_SYNC = '2026-11-25.1';
function syncBirth(d, s){
  if(d.birthSync === BIRTH_SYNC) return 0;
  var idx = {};
  (s.customers||[]).forEach(function(c){ if(c.birth) idx[c.id] = c.birth; });
  var n = 0;
  (d.customers||[]).forEach(function(c){ if(!c.birth && idx[c.id]){ c.birth = idx[c.id]; n++; } });
  d.birthSync = BIRTH_SYNC;
  return n;
}
/* v8.2: 공지사항(중요공지·일반공지)은 새 시드로 글·댓글·대댓글·사진까지 새로 맞춘다.
   직원이 찍어 둔 1단계 댓글 상태(st)는 시간·내용이 같은 댓글에 그대로 옮겨 둔다.
   v8.12: 같은 함수·선언이 6번 겹쳐 있던 것을 한 벌로 정리. (겹친 사본 중 마지막 '25.1' 이 실제로 쓰이고 있어
   기기 저장본에 이미 '25.1' 이 찍혀 있으므로, 키는 그대로 두어 공지 글이 불필요하게 다시 덮이지 않게 한다.) */
var NOTICE_SYNC = '2026-11-25.1';
function syncNotices(d, s){
  if(d.noticeSync === NOTICE_SYNC) return 0;
  var idx = {};
  (d.posts||[]).forEach(function(p,i){ idx[p.id] = i; });
  var n = 0;
  (s.posts||[]).forEach(function(sp){
    if(!sp.isNotice) return;
    var i = idx[sp.id];
    if(i == null){ d.posts.push(sp); n++; return; }
    var old = d.posts[i], st = {};
    (old.comments||[]).forEach(function(c){
      if(c.st) st[(c.at||'')+'|'+String(c.text||'').replace(/\s+/g,'')] = c.st;
    });
    var cp = JSON.parse(JSON.stringify(sp));
    (cp.comments||[]).forEach(function(c){
      var k = (c.at||'')+'|'+String(c.text||'').replace(/\s+/g,'');
      if(st[k]) c.st = st[k];
    });
    d.posts[i] = cp; n++;
  });
  d.noticeSync = NOTICE_SYNC;
  return n;
}
/* v8: seedVersion 이 8보다 낮은 저장본(v1~v7 테스트 데이터)은 한 번만 새 실데이터로 깨끗이 교체한다 */
function loadState(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var d = JSON.parse(raw);
      if(d && Array.isArray(d.posts) && Array.isArray(d.customers)){
        if((+d.seedVersion || 0) < SEED_VER){
          var fresh = seed();
          try{ localStorage.setItem(KEY, JSON.stringify(fresh)); }catch(e){}
          return fresh;
        }
        /* v8.12: save the seed once and reuse it — seed() parses the 650KB JSON and normalizes every call,
           so six seed() calls at every launch were a big part of the slow start. */
        var s = seed();
        if(!d.delCust) d.delCust = {};          /* v8.12: 삭제 표시(가입 시드·과거 명단에서 다시 살아나지 않게) */
        if(!d.delPost) d.delPost = {};          /* v8.18: 지운 글 표시(새 시드·전 직원 공유에서 다시 살아나지 않게) */
        var dirty = false;
        if(adoptLegacyPostDeletes(d)) dirty = true;   /* v8.18: 구버전 기기가 deleted=true 만 적어 둔 글을 삭제 표시로 */
        if(syncNotices(d, s)) dirty = true;
        if(mergeSeed(d, s)) dirty = true;
        if(pruneDeletedPosts(d)) dirty = true;  /* v8.18: 지운 글은 시드·동기화로 다시 들어와도 화면에 남기지 않는다 */
        if(syncBirth(d, s)) dirty = true;       /* v8.3 */
        if(dirty){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }
        return d;
      }
    }
  }catch(e){}
  var s = seed();
  try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){}
  return s;
}
/* 이 기기(localStorage)에 저장하는 건 최근 3개월 명단 + 글·댓글까지. 과거 전체는 archive(IndexedDB)에 따로 둔다. */
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('저장 공간이 부족해요. 사진을 줄이거나 내보내기 후 초기화해 주세요.', true); }
  custIdxDirty();
  /* v8.9: 바뀐 칸이 있으면 전 직원 실시간 공유로 곧바로 올린다(0.4초 묶음) */
  try{ if(typeof syncChanged === 'function') syncChanged(); }catch(e){}
}
function findPost(id){ for(var i=0;i<state.posts.length;i++){ if(state.posts[i].id===id) return state.posts[i]; } return null; }

/* ================= v8.12: 고객 삭제(관리자) · 삭제 표시 ================= */
/* 삭제는 명단에서 빼고 '삭제 표시(state.delCust)'를 남긴다.
   · 다음 실행 때 시드·과거 명단(archive)에서 같은 id 가 다시 살아나지 않게 하고,
   · 전 직원 폰에도 band_push(f.deleted=true)로 같은 표시를 보내 함께 사라지게 한다. */
function isCustDeleted(id, d){
  d = d || state;   /* loadState 처럼 state 가 아직 없을 때는 저장본(d)을 직접 넘긴다 */
  return !!(d && d.delCust && d.delCust[String(id||'')]);
}
function custTombstone(id, at, by, name){
  if(!state) return false;
  id = String(id||'');
  if(!id) return false;
  state.delCust = state.delCust || {};
  at = +at || Date.now();
  var prev = state.delCust[id];
  if(prev && (+prev.at||0) > at) return false;   /* 더 새로운 삭제 표시가 이미 있음 */
  state.delCust[id] = {at:at, by:by||'', name:name||(prev&&prev.name)||''};
  var before = state.customers.length;
  state.customers = state.customers.filter(function(c){ return c && c.id!==id; });
  custIdxDirty();
  /* 삭제 표시가 끝없이 쌓이지 않게 최근 400건만 남긴다 */
  var ids = Object.keys(state.delCust);
  if(ids.length > 400){
    ids.sort(function(a,b){ return (state.delCust[a].at||0)-(state.delCust[b].at||0); });
    ids.slice(0, ids.length-400).forEach(function(k){ delete state.delCust[k]; });
  }
  return before !== state.customers.length || !prev;
}
function deleteCust(id){
  var c = findCust(id);
  if(!c) return false;
  var nm = c.name || '';
  if(!custTombstone(id, Date.now(), (session && session.staff) || '', nm)) return false;
  if(sheetSpec) closeSheet();
  save(); render();
  toast(nm + ' 님을 명단에서 지웠어요 · 전 직원에게도 반영됩니다');
  return true;
}
/* ================= v8.18: 글(공지) 삭제(관리자) · 삭제 표시 ================= */
/* 고객 삭제(v8.12)와 같은 방식 —
   · state.posts 에서 빼고 '삭제 표시(state.delPost)'를 남겨 다음 실행·새 시드·전 직원 공유에서 다시 살아나지 않게 하고,
   · 전 직원 폰에도 band_push(f.deleted=true)로 같은 표시를 보내 함께 사라지게 한다. */
function isPostDeleted(id, d){
  d = d || state;   /* loadState 처럼 state 가 아직 없을 때는 저장본(d)을 직접 넘긴다 */
  return !!(d && d.delPost && d.delPost[String(id||'')]);
}
/* 시드·저장본에서 지운 글을 걷어낸다 — loadState 의 syncNotices·mergeSeed 뒤에 한 번 */
function pruneDeletedPosts(d){
  if(!d || !d.delPost) return 0;
  var before = (d.posts||[]).length;
  d.posts = (d.posts||[]).filter(function(p){ return p && !isPostDeleted(p.id, d); });
  return before - d.posts.length;
}
/* v8.18: v8.17 기기가 서버의 삭제 표시(f.deleted)를 먼저 받아 글 객체에 deleted=true 로만 적어 둔 경우
   → 저장본을 읽을 때 삭제 표시(delPost)로 옮긴다. 그 기기가 v8.18 로 바뀌어도 지운 글이 화면에 남지 않게. */
function adoptLegacyPostDeletes(d){
  if(!d || !Array.isArray(d.posts)) return 0;
  var n = 0;
  d.posts.forEach(function(p){
    if(!p || p.deleted !== true) return;
    d.delPost = d.delPost || {};
    if(!d.delPost[p.id]) d.delPost[p.id] = {at: Date.now(), by: '', title: p.title || shortText(p.body || '', 30) || '글', sent: 1};
    n++;
  });
  return n;
}
/* 실시간 공유 부수 기록(삭제 표시의 '이미 올림')을 저장할 때 — syncChanged 를 다시 태우지 않는다 */
function saveQuiet(){
  try{ if(state) localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}

function postTombstone(id, at, by, title){
  if(!state) return false;
  id = String(id||'');
  if(!id) return false;
  state.delPost = state.delPost || {};
  at = +at || Date.now();
  var prev = state.delPost[id];
  if(prev && (+prev.at||0) > at) return false;   /* 더 새로운 삭제 표시가 이미 있음 */
  state.delPost[id] = {at:at, by:by||'', title:title||(prev&&prev.title)||''};
  if(prev && prev.sent) state.delPost[id].sent = prev.sent;
  var before = state.posts.length;
  state.posts = state.posts.filter(function(p){ return p && p.id!==id; });
  /* 그 글에 열어 둔 댓글 칸·글 시트가 남아 있지 않게 */
  if(ui.openThreads) delete ui.openThreads[id];
  if(ui.openCmts) delete ui.openCmts[id];
  /* 삭제 표시가 끝없이 쌓이지 않게 최근 400건만 남긴다 */
  var ids = Object.keys(state.delPost);
  if(ids.length > 400){
    ids.sort(function(a,b){ return (state.delPost[a].at||0)-(state.delPost[b].at||0); });
    ids.slice(0, ids.length-400).forEach(function(k){ delete state.delPost[k]; });
  }
  return before !== state.posts.length || !prev;
}
function deletePost(id){
  var p = findPost(id);
  if(!p) return false;
  var ttl = p.title || shortText(p.body || '', 30) || '글';
  if(!postTombstone(id, Date.now(), (session && session.staff) || '', ttl)) return false;
  if(sheetSpec) closeSheet();
  save(); render();
  toast('글을 지웠어요 · 전 직원에게도 반영됩니다');
  return true;
}

/* ================= archive (v8: 과거 전체 명단 10,066건) ================= */
/* archive.json(10,066건 · 2024-11-10~2026-11-25)은 앱이 백그라운드에서 한 번 받아 IndexedDB에 넣어 둡니다.
   localStorage 5MB 한도를 넘지 않도록 저장본(state)에는 최근 3개월만 두고, 과거 연/월을 고르거나 검색할 때만
   archive 를 합쳐서 조회합니다. 상태·메모를 고친 과거 고객은 그 건만 state 로 복사해 저장합니다. */
var ARCH_URL = 'archive.json';
var ARCH_TAG = '2026-11-25.10066b';  /* v8.3: 생년월일 포함본 */     /* 배포본이 바뀌면 이 값을 올리면 기기들이 새로 받습니다 */
var ARCH_DB = 'kt_band_archive_v1';
var ARCH_STORE = 'kv';
var arch = {items:null, map:null, ready:false, loading:false, err:'', at:0};

function archOpenDb(){
  return new Promise(function(res, rej){
    if(!window.indexedDB){ rej(new Error('IndexedDB를 쓸 수 없어요')); return; }
    var r;
    try{ r = indexedDB.open(ARCH_DB, 1); }catch(e){ rej(e); return; }
    r.onupgradeneeded = function(){
      var db = r.result;
      if(!db.objectStoreNames.contains(ARCH_STORE)) db.createObjectStore(ARCH_STORE);
    };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error || new Error('IndexedDB 열기 실패')); };
  });
}
function archIdbGet(key){
  return archOpenDb().then(function(db){
    return new Promise(function(res, rej){
      var q;
      try{ q = db.transaction(ARCH_STORE, 'readonly').objectStore(ARCH_STORE).get(key); }
      catch(e){ rej(e); return; }
      q.onsuccess = function(){ res(q.result); };
      q.onerror = function(){ rej(q.error); };
    });
  });
}
function archIdbPut(key, val){
  return archOpenDb().then(function(db){
    return new Promise(function(res, rej){
      var q;
      try{ q = db.transaction(ARCH_STORE, 'readwrite').objectStore(ARCH_STORE).put(val, key); }
      catch(e){ rej(e); return; }
      q.onsuccess = function(){ res(true); };
      q.onerror = function(){ rej(q.error); };
    });
  });
}
function archCustById(id){
  if(!arch.items) return null;
  if(!arch.map){
    arch.map = {};
    for(var i=0;i<arch.items.length;i++){ arch.map[arch.items[i].id] = arch.items[i]; }
  }
  return arch.map[id] || null;
}
function archUse(items, at){
  arch.items = items;
  arch.map = null;
  arch.ready = true;
  arch.err = '';
  arch.at = at || 0;
  custIdxDirty();
  archRefreshUI();
}
/* 과거 명단이 도착하면 화면을 한 번 다시 그린다 — 입력 중이거나 시트가 열려 있으면 건드리지 않는다 */
function archRefreshUI(){
  if(!session) return;
  var app = $('app');
  if(!app || app.hidden) return;
  if(sheetSpec) return;
  var ae = document.activeElement;
  if(ae && ae !== document.body && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA')) return;
  render();
}
function archFetch(){
  return fetch(ARCH_URL, {cache:'no-cache'}).then(function(res){
    if(!res || !res.ok) throw new Error('archive '+ (res ? res.status : '연결 실패'));
    return res.json();
  }).then(function(d){
    var items = (d && Array.isArray(d.customers)) ? d.customers : (Array.isArray(d) ? d : []);
    if(!items.length) throw new Error('과거 명단이 비어 있어요');
    var at = Date.now();
    archUse(items, at);
    archIdbPut('archive', {tag:ARCH_TAG, at:at, items:items}).catch(function(){});
    return items.length;
  });
}
function archInit(){
  if(arch.ready || arch.loading) return;
  arch.loading = true;
  archIdbGet('archive').then(function(rec){
    if(rec && Array.isArray(rec.items) && rec.items.length){
      archUse(rec.items, rec.at);
      if(rec.tag === ARCH_TAG){ arch.loading = false; return null; }
    }
    return archFetch();
  }, function(){
    return archFetch();
  }).then(function(){ arch.loading = false; archRefreshUI(); },
          function(e){ arch.loading = false; arch.err = (e && e.message) || '과거 명단을 불러오지 못했어요'; archRefreshUI(); });
}
function archStatusText(){
  if(arch.ready){
    var n = arch.items ? arch.items.length : 0;
    return '과거 명단 '+archNum(n)+'건 · 불러옴';
  }
  if(arch.err) return '과거 명단 불러오기 실패 · ' + arch.err;
  if(arch.loading) return '과거 명단 불러오는 중…';
  return '과거 명단 대기 중';
}
function archNum(n){
  var s = String(n == null ? 0 : n), out = '';
  while(s.length > 3){ out = ',' + s.slice(-3) + out; s = s.slice(0, -3); }
  return s + out;
}

/* ---- 명단 인덱스(최근 3개월 + 과거 전체를 id 로 겹치지 않게 합친다) ---- */
var CUST_IDX = null;
function custIdxDirty(){ CUST_IDX = null; }
function allCustomers(){
  var st = state ? state.customers : [];
  if(!arch.items || !arch.items.length) return st;
  var seen = {}, out = st.slice();
  for(var i=0;i<st.length;i++){ seen[st[i].id] = 1; }
  for(var j=0;j<arch.items.length;j++){ var c = arch.items[j]; if(!seen[c.id] && !isCustDeleted(c.id)) out.push(c); }
  return out;
}
function custIndex(){
  if(CUST_IDX && CUST_IDX.stamp === state) return CUST_IDX;
  var all = allCustomers(), byDay = {};
  for(var i=0;i<all.length;i++){
    var c = all[i];
    (byDay[c.day] || (byDay[c.day] = [])).push(c);
  }
  CUST_IDX = {stamp:state, all:all, byDay:byDay, days:Object.keys(byDay).sort().reverse()};
  return CUST_IDX;
}
function custsOfDay(day){ return custIndex().byDay[day] || []; }
function findCust(id){
  if(isCustDeleted(id)) return null;   /* v8.12: 삭제한 고객은 어디에서도 찾지 않는다 */
  for(var i=0;i<state.customers.length;i++){ if(state.customers[i].id===id) return state.customers[i]; }
  return archCustById(id);
}
/* 과거 명단의 고객을 고치기 전에 이 기기 저장본으로 한 번 복사해 온다(그래야 수정이 남는다) */
function ensureCust(id){
  var c = findCust(id);
  if(!c) return null;
  for(var i=0;i<state.customers.length;i++){ if(state.customers[i].id===id) return state.customers[i]; }
  var copy = JSON.parse(JSON.stringify(c));
  state.customers.push(copy);
  custIdxDirty();
  return copy;
}

var LEDGER_URL = 'https://script.google.com/macros/s/AKfycbz502Kzj6P_p3ku_i-91a4nIKtPKk2xzfpXv5qbJ2XYESroO5BKHpNjIK_fItNirVpaNw/exec';

var LEDGER_FULL = 6 * 60 * 60 * 1000;   /* 이 시간이 지나면 건수가 같아도 목록을 새로 받는다 */
var LEDGER_TMO = 25000;                 /* 요청 제한 시간 */
var ledger = {at:0, checked:0, count:0, rows:[], map:null, busy:false, err:'', lastNew:0, lastBack:0, lastRun:0};

function ledgerBase(){
  return LEDGER_URL + (LEDGER_URL.indexOf('?') < 0 ? '?' : '&') + 'pin=' + LEDGER_PIN;
}
function ledgerNum(n){
  var s = String(n == null ? 0 : n), out = '';
  while(s.length > 3){ out = ',' + s.slice(-3) + out; s = s.slice(0, -3); }
  return s + out;
}
/* 구글 응답은 본문을 못 읽는 경우가 있어 JSONP 로도 받습니다 */
function ledgerFetchJson(url){
  return new Promise(function(resolve, reject){
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var tm = setTimeout(function(){ if(ctrl){ try{ ctrl.abort(); }catch(e){} } }, LEDGER_TMO);
    var opt = {method:'GET', cache:'no-store', redirect:'follow'};
    if(ctrl) opt.signal = ctrl.signal;
    fetch(url, opt).then(function(res){
      return res.text();
    }).then(function(text){
      clearTimeout(tm);
      var d = null;
      try{ d = JSON.parse(text); }catch(e){ d = null; }
      if(d) resolve(d);
      else ledgerJsonp(url).then(resolve, reject);
    }).catch(function(){
      clearTimeout(tm);
      ledgerJsonp(url).then(resolve, reject);
    });
  });
}
function ledgerJsonp(url){
  return new Promise(function(resolve, reject){
    var name = '__ktLedger' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    var s = document.createElement('script');
    var done = false, tm = null;
    function clean(){
      try{ delete window[name]; }catch(e){ window[name] = undefined; }
      if(s.parentNode) s.parentNode.removeChild(s);
    }
    window[name] = function(d){ if(done) return; done = true; clearTimeout(tm); clean(); resolve(d); };
    s.onerror = function(){ if(done) return; done = true; clearTimeout(tm); clean(); reject(new Error('연결 실패')); };
    tm = setTimeout(function(){ if(done) return; done = true; clean(); reject(new Error('응답이 없습니다')); }, LEDGER_TMO);
    s.src = url + '&callback=' + name;
    document.head.appendChild(s);
  });
}

/* ---------- 캐시 ---------- */
function ledgerLoad(){
  try{
    var raw = localStorage.getItem(LKEY);
    if(!raw) return false;
    var d = JSON.parse(raw);
    if(!d || !Array.isArray(d.rows)) return false;
    ledger.at = +d.at || 0;
    ledger.checked = +d.checked || ledger.at;
    ledger.count = +d.count || 0;
    ledger.rows = d.rows;
    ledger.map = null;
    return ledger.rows.length > 0;
  }catch(e){ return false; }
}
function ledgerSave(){
  try{
    localStorage.setItem(LKEY, JSON.stringify({at:ledger.at, checked:ledger.checked, count:ledger.count, rows:ledger.rows}));
    return true;
  }catch(e){ return false; }
}
/* 장부 응답 → [전화번호 숫자, 개통일, 담당자] 만 남긴다 */
function ledgerCompact(recs){
  var out = [];
  for(var i=0;i<recs.length;i++){
    var r = recs[i] || {};
    var ph = digits(r['연락처']);
    if(ph.length < 7) continue;
    var dt = String(r['개통일'] || '').slice(0, 10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)) dt = '';
    out.push([ph, dt, String(r['담당자'] || '').slice(0, 10)]);
  }
  return out;
}
function ledgerIndex(){
  if(ledger.map) return ledger.map;
  var m = {};
  for(var i=0;i<ledger.rows.length;i++){
    var ph = String(ledger.rows[i][0] || '');
    if(ph.length < 7) continue;
    var k = ph.slice(-8);
    (m[k] || (m[k] = [])).push(i);
  }
  ledger.map = m;
  return m;
}
/* ---- v8.5: 원 개통일·기개통(재약정) 대조 ---- */
var LEDGER_TERM = {'730':730, '550':550, '3년':1095};   /* 명단 날짜 = 원 개통일 + (기간-1)일 */
var LEDGER_SELF = 15;                                   /* 원 개통 건 자기 자신을 피하는 여유(일) */
function ledgerAddDays(day, n){
  var p = String(day || '').slice(0,10).split('-');
  if(p.length !== 3) return '';
  var d = new Date(+p[0], (+p[1])-1, +p[2]);
  if(isNaN(d.getTime())) return '';
  d.setDate(d.getDate() + n);
  return todayStr(d);
}
function ledgerTerm(c){ return LEDGER_TERM[String((c && c.bucket) || '')] || 730; }
function ledgerOrigDay(c){ return ledgerAddDays(c && c.day, -(ledgerTerm(c) - 1)); }   /* 원 개통일(역산) */
function ledgerSince(c){ return ledgerAddDays(c && c.day, -(ledgerTerm(c) - LEDGER_SELF)); }   /* 기개통 대조 시작일 */
/* 전화번호 뒤 8자리 + fromDay <= 개통일 < beforeDay 중 가장 최근 건 */
function ledgerFindBack(phone, fromDay, beforeDay){
  var d = digits(phone);
  if(d.length < 7 || !fromDay) return null;
  var hit = ledgerIndex()[d.slice(-8)];
  if(!hit) return null;
  var best = null;
  for(var i=0;i<hit.length;i++){
    var r = ledger.rows[hit[i]];
    var dt = r && r[1] || '';
    if(!dt || dt < fromDay || (beforeDay && dt >= beforeDay)) continue;
    if(!best || dt > best.date) best = {date:dt, owner:(r[2] || '')};
  }
  return best;
}
/* 가망고객 1명 → 장부 매칭 {date, owner, back}. ①새 개통이 있으면 ①, 없으면 ②기개통 */
function ledgerMatch(c){
  var fwd = ledgerFind(c.phone, c.day);
  if(fwd) return {date:fwd.date, owner:fwd.owner, back:false};
  var from = ledgerSince(c);
  if(!from || from >= String(c.day || '')) return null;
  var bk = ledgerFindBack(c.phone, from, String(c.day || '').slice(0,10));
  return bk ? {date:bk.date, owner:bk.owner, back:true} : null;
}
/* 전화번호 뒤 8자리 + 개통일(>= minDay) 로 장부 건을 찾는다 */
function ledgerFind(phone, minDay){
  var d = digits(phone);
  if(d.length < 7) return null;
  var hit = ledgerIndex()[d.slice(-8)];
  if(!hit) return null;
  var best = null;
  for(var i=0;i<hit.length;i++){
    var r = ledger.rows[hit[i]];
    var dt = r && r[1] || '';
    if(!dt) continue;
    if(minDay && dt < minDay) continue;
    if(!best || dt < best.date) best = {date:dt, owner:(r[2] || '')};
  }
  return best;
}
function ledgerCmt(hit){
  return {id:uid('s'), author:'장부 연동', at:nowAt(), sys:true,
          text:'개통장부에서 개통 확인 — ' + hit.date + (hit.owner ? ' · 담당 ' + hit.owner : '') + ' · 자동 개통완료',
          photos:[], replies:[]};
}
/* v8.5: 기개통(재약정) — 원 개통일 이후 다시 개통한 기록이 있는 고객 */
function ledgerBackCmt(hit, c){
  var orig = ledgerOrigDay(c);
  return {id:uid('s'), author:'장부 연동', at:nowAt(), sys:true,
          text:'🔗 기개통 — ' + hit.date + '에 재개통' + (hit.owner ? ' (담당 ' + hit.owner + ')' : '')
             + (orig ? ' · 원 개통 ' + orig : '') + ' 이후라 자동 개통완료',
          photos:[], replies:[]};
}
/* 캐시/새 목록을 명단·사전예약에 반영. 새로 개통완료로 바꾼 수를 돌려준다. */
function ledgerApply(){
  if(!state) return 0;
  if(!ledger.rows.length) return 0;
  var n = 0, nb = 0;
  (state.customers || []).forEach(function(c){
    if(c.linkOff) return;
    /* v8.19(#20511): 예약에 수기로 올린 고객(＋ → ⏰ 예약 추가 · resOnly·bucket '예약')은
       전화번호가 같아도 장부 자동 대조로 '개통완료' 처리하지 않는다. 예약 상태 그대로 둔다. */
    if(c.resOnly || String(c.bucket || '') === '예약') return;
    var hit = ledgerMatch(c);
    if(!hit) return;
    if(!c.link || c.link.date !== hit.date || c.link.owner !== hit.owner || !!c.link.back !== !!hit.back){
      c.link = {date:hit.date, owner:hit.owner, at:nowAt(), back:!!hit.back};
    }
    /* v8: 장부에서 실개통이 확인된 고객은 '개통완료'(통화만 끝난 '완료'와 구분) */
    if(c.status !== '개통완료'){
      c.status = '개통완료';
      c.resDate = ''; c.resTime = '';   /* v8.4(#17938): 실제 개통 확인되면 예약 정보는 정리 */
      c.keep = false;
      c.comments = c.comments || [];
      c.comments.push(hit.back ? ledgerBackCmt(hit, c) : ledgerCmt(hit));
      n++;
      if(hit.back) nb++;
    } else if(c.keep){
      c.keep = false;   /* 개통완료면 부재중 킵에서 빼낸다 */
    }
  });
  ledger.lastBack = nb;
  (state.posts || []).forEach(function(p){
    (p.reservations || []).forEach(function(r){
      if(r.linkOff) return;
      var base = String(r.at || p.at || '').slice(0, 10);
      var hit = ledgerFind(r.phone, /^\d{4}-\d{2}-\d{2}$/.test(base) ? base : '');
      if(!hit) return;
      if(!r.link || r.link.date !== hit.date || r.link.owner !== hit.owner){
        r.link = {date:hit.date, owner:hit.owner, at:nowAt()};
      }
      if(!r.done){ r.done = true; n++; }
    });
  });
  if(n) notifyBridge('개통완료 자동 반영', n+'명을 장부와 대조해 개통완료로 표시했어요' + (nb ? ' (기개통 ' + nb + '명)' : ''));
  return n;
}

/* ---------- 장부 요청 ---------- */
function ledgerPing(){
  return ledgerFetchJson(ledgerBase() + '&action=ping&t=' + Date.now()).then(function(d){
    if(!d || d.ok !== true) throw new Error((d && d.error) || '장부 응답 오류');
    return +d.count || 0;
  });
}
function ledgerPull(){
  return ledgerFetchJson(ledgerBase() + '&action=list&t=' + Date.now()).then(function(d){
    if(d && d.pending) throw new Error('기기 승인 대기');
    if(d && d.blocked) throw new Error('차단된 기기');
    if(!d || d.ok !== true) throw new Error((d && d.error) || '장부 응답 오류');
    var recs = Array.isArray(d.records) ? d.records : [];
    ledger.rows = ledgerCompact(recs);
    ledger.count = recs.length;
    ledger.at = Date.now();
    ledger.checked = ledger.at;
    ledger.map = null;
    ledgerSave();
    return 0;
  });
}
function ledgerCheck(){
  /* 캐시가 없거나 오래됐으면 목록을, 아니면 건수만 확인 */
  if(!ledger.rows.length || !ledger.at || (Date.now() - ledger.at) > LEDGER_FULL) return ledgerPull();
  return ledgerPing().then(function(count){
    if(ledger.count && count !== ledger.count) return ledgerPull();
    ledger.checked = Date.now();
    return 0;
  });
}
function ledgerSync(force){
  if(!session || ledger.busy) return;
  if(document.hidden && !force) return;   /* v8.12: 화면이 꺼져 있으면 대조하지 않는다 */
  var now = Date.now();
  if(!force){
    if(ledger.checked && (now - ledger.checked) < LEDGER_TTL) return;
  } else if(ledger.lastRun && (now - ledger.lastRun) < LEDGER_CD && !ledger.err){
    toast('방금 확인했어요 · 장부 ' + ledgerNum(ledger.count) + '건');
    return;
  }
  ledger.busy = true;
  ledger.err = '';
  ledger.lastNew = 0;
  ledger.lastRun = now;
  refreshLedgerUI(true);
  (force ? ledgerPull() : ledgerCheck()).then(function(){
    ledger.busy = false;
    var added = ledgerApply();
    ledger.lastNew = added;
    ledger.checked = Date.now();
    if(added) save();
    ledgerSave();
    /* v8.12: 실제로 바뀐 고객이 있을 때만 화면 전체를 다시 그린다 — 상태 줄만 바뀌면 그 줄만 갱신 */
    if(added) render(); else refreshLedgerUI(true);
    if(added) toast('장부에서 ' + added + '명 개통완료로 자동 반영했어요'
                   + (ledger.lastBack ? ' (기개통 ' + ledger.lastBack + '명)' : ''));
  }, function(e){
    ledger.busy = false;
    ledger.err = (e && e.message) || '연결 실패';
    refreshLedgerUI(true);
    if(force) toast('장부를 확인하지 못했어요 — ' + ledger.err, true);
  });
}
function refreshLedgerUI(light){
  if(!session) return;
  if($('app').hidden) return;
  if(sheetSpec) return;   /* 시트에서 입력 중이면 화면을 다시 그리지 않는다 */
  if(light){
    /* v8.12: 장부 상태 줄만 바꾼다(명단·사진을 다시 그리지 않아 즉시 반응) */
    var bar = document.querySelector('.ledgerbar');
    if(bar) bar.outerHTML = ledgerBar();
    return;
  }
  render();
}
function ledgerAgeText(){
  var t = ledger.checked || ledger.at || 0;
  if(!t) return '아직 확인 안 함';
  var m = Math.floor((Date.now() - t) / 60000);
  if(m < 1) return '방금 확인';
  if(m < 60) return m + '분 전 확인';
  var h = Math.floor(m / 60);
  if(h < 24) return h + '시간 전 확인';
  return Math.floor(h / 24) + '일 전 확인';
}
function ledgerSummary(){
  if(ledger.busy) return '개통장부와 대조하는 중…';
  if(ledger.err) return '확인 실패 · ' + ledger.err;
  if(!ledger.at) return '아직 확인하지 않았어요 · 지금 확인을 눌러주세요';
  return '장부 ' + ledgerNum(ledger.count) + '건 · ' + ledgerAgeText()
       + (ledger.lastNew ? ' · 방금 ' + ledger.lastNew + '명 자동 반영' : '');
}
function ledgerBar(){
  var st = ledger.busy ? 'busy' : (ledger.err ? 'err' : (ledger.at ? 'on' : 'idle'));
  var title = ledger.busy ? '장부 확인 중…' : (ledger.err ? '장부 확인 실패' : '장부 개통 연동');
  var sub = ledger.busy ? '개통장부와 대조하고 있어요'
          : (ledger.err ? ledger.err + ' · 지금 확인으로 다시 시도'
          : (ledger.at ? ledgerNum(ledger.count) + '건 · ' + ledgerAgeText()
                          + (ledger.lastNew ? ' · 방금 ' + ledger.lastNew + '명 자동 반영' : '')
                        : '아직 확인하지 않았어요 · 지금 확인을 눌러주세요'));
  return '<div class="ledgerbar ' + st + '">'
    + '<span class="lb-ico">' + (ledger.busy ? '⏳' : '🔄') + '</span>'
    + '<span class="lb-txt"><b>' + esc(title) + '</b><small>' + esc(sub) + '</small></span>'
    + '<button type="button" class="lb-btn" data-act="ledger-sync">' + (ledger.busy ? '확인 중' : '지금 확인') + '</button>'
    + '</div>';
}
/* 개통일 표기 : 2026-11-24 → 11-24 */
function ledgerMd(date){ return String(date || '').slice(5, 10) || '—'; }
/* v8.5: 기개통은 최대 3년 전 날짜라 연도까지 — 2025-06-05 → 25-06-05 */
function ledgerYmd2(date){ var s = String(date || ''); return s.length >= 10 ? s.slice(2, 10) : (s || '—'); }
function ledgerBadgeHTML(link, auto){
  if(!link) return '';
  var when = (link.back ? ledgerYmd2(link.date) : ledgerMd(link.date)) + (link.owner ? ' · ' + link.owner : '');
  var label = link.back ? '기개통' : (auto ? '장부 자동개통완료' : '장부 개통');
  return '<span class="lk-badge' + (link.back ? ' back' : (auto ? '' : ' off')) + '">🔗 '
    + label + ' (' + esc(when) + ')</span>';
}

/* ================= realtime sync (v8.9) ================= */
/* 전 직원 실시간 공유 — 개통장부가 쓰는 공용 Apps Script(Code.gs)에 붙인 숨김 탭 '_밴드공유' 와 주고받습니다.
   · 직원이 부재·예약·완료·개통완료·부재중 킵·메모·댓글·글쓰기·수정을 하면
     바뀐 칸만 updatedAt 과 변경자(staff)를 붙여 곧바로 band_push 로 올립니다(연속 변경은 0.4초 묶어서).
   · 앱을 열 때·화면으로 돌아올 때(focus/visibilitychange) 즉시 band_get,
     화면을 켜 둔 동안 6.5초마다 since(마지막 서버 시각) 이후 변경분만 받아 화면에 바로 반영합니다.
   · 칸(고객 상태·메모…) 단위로 최신 것만 반영하므로, 직원 A가 김기*를 완료 누르는 동시에
     직원 B가 김미*를 부재 눌러도 서로 덮어쓰지 않습니다.
   · 라이브 Apps Script 가 아직 band_get 을 모르면(구버전) 조용히 로컬 모드로 두고
     30초마다 다시 확인해, 새 Code.gs 가 배포되는 즉시 자동으로 실시간 공유가 켜집니다. */
var SYNC_INT = 6500;            /* 켜 둔 동안 변경 확인 간격(ms) */
var SYNC_IDLE_INT = 30000;      /* 서버가 아직 band_get 을 모를 때 다시 확인하는 간격 */
var SYNC_TMO = 12000;           /* 요청 제한 시간 */
var SYNC_PUSH_WAIT = 400;       /* 연속 변경 묶어 보내기 */
var SYNC_CHUNK = 20;            /* 한 번에 올리는 항목 수 */
var SYNC_CHUNK_BYTES = 24000;   /* 한 번에 올리는 크기(구글 셀 한 칸 50,000자 보호) */
var SYNC_SINCE_KEY = 'kt_band_sync_since_v2';
var SYNC_BASE_KEY = 'kt_band_sync_base_v2';

var sync = {
  mode: 'off',        /* off(로그인 전) | wait(서버 준비 대기) | live(실시간) */
  started: false,
  primed: false,
  since: 0,
  skew: 0,            /* 서버 시각 - 이 기기 시각 */
  map: {},            /* 항목 key → {u, f:{칸:{v,u}}, cm:{댓글id:{u}}, rv:예약지문} */
  applying: false,
  pullBusy: false,
  pushBusy: false,
  loopT: null,
  pushT: null,
  lastAt: 0,
  dirty: false,
  lastErr: '',
  fails: 0,
  baseSent: false,
  lastNote: ''
};

function syncNow(){ return Date.now() + (sync.skew || 0); }
function syncRec(key){
  var r = sync.map[key];
  if(!r) r = sync.map[key] = {u:0, f:{}, cm:{}, rv:null};
  return r;
}
function syncBase(){
  return LEDGER_URL + (LEDGER_URL.indexOf('?') < 0 ? '?' : '&') + 'pin=' + LEDGER_PIN;
}

/* ---------- 바뀐 칸만 골라내는 투영(projection) ---------- */
/* 링크(장부 연동 표시)는 기기마다 장부를 직접 대조해 스스로 채우므로 주고받지 않습니다. */
function syncCustFields(c){
  return {
    day: c.day || '', name: c.name || '', phone: c.phone || '', bucket: c.bucket || '',
    status: c.status || '미통화', resDate: c.resDate || '', resTime: c.resTime || '',
    memo: c.memo || '', keep: !!c.keep, tries: +c.tries || 0, owner: c.owner || ''

}
function syncPostFields(p){

    done: !!p.done, title: p.title || '', body: String(p.body || '').slice(0, 12000),
    author: p.author || '', at: p.at || '', bandPostId: +p.bandPostId || 0, bandUrl: p.bandUrl || ''

}
/* 댓글·답글은 사진(data:)을 빼고 주소(http)만 — 큰 이미지는 폰에만 두고 글로만 공유합니다 */
function syncPhotos(list){
  var out = [];
  (list || []).forEach(function(ph){
    var src = String((ph && ph.src) || '');
    if(/^https?:\/\//.test(src) && src.length < 600) out.push({src: src, name: String(ph.name || '').slice(0, 40)});
  });
  return out;
}
function syncReplies(list){
  var out = [];
  (list || []).slice(-20).forEach(function(r){
    out.push({id: r.id || '', author: r.author || '', at: r.at || '', text: String(r.text || '').slice(0, 2000),
              st: r.st || '', photos: syncPhotos(r.photos)});
  });
  return out;
}
function syncCmtPayload(c){
  if(!c || !c.id) return null;
  return {
    id: c.id, author: c.author || '', at: c.at || '', text: String(c.text || '').slice(0, 2000),
    st: c.st || '', stBy: c.stBy || '', stAt: c.stAt || '', resDate: c.resDate || '', resTime: c.resTime || '',
    memo: String(c.memo || '').slice(0, 200), sys: !!c.sys,
    photos: syncPhotos(c.photos), replies: syncReplies(c.replies), u: syncNow()
  };
}
function syncCmtFp(c){
  return [c.author || '', c.at || '', c.text || '', c.st || '', c.stBy || '', c.stAt || '',
          c.resDate || '', c.resTime || '', c.memo || '', (c.photos || []).length, (c.replies || []).length].join('\u001f');
}
function syncNewCmts(list, rec){
  var out = [];
  (list || []).forEach(function(c){
    if(!c || !c.id) return;
    if(c.sys && c.author === '장부 연동') return;   /* 장부 자동 표시는 기기마다 스스로 계산 — 중복 방지 */
    var fp = syncCmtFp(c);
    var prev = rec.cm[c.id];
    if(prev && prev.fp === fp) return;
    var p = syncCmtPayload(c);
    if(p){ p.fp = fp; out.push(p); }
  });
  return out;
}
function syncRvKey(list){
  var out = [];
  (list || []).slice(-100).forEach(function(r){
    out.push({id: r.id || '', name: r.name || '', phone: r.phone || '', model: r.model || '',
              owner: r.owner || '', memo: String(r.memo || '').slice(0, 300), at: r.at || '', done: !!r.done});
  });

/* ---------- 시드 색인 (처음 한 번 기준 올리기에 쓴다) ---------- */
var SYNC_SEED = null;
function syncSeedIndex(){
  if(SYNC_SEED) return SYNC_SEED;
  var d = seed();
  var out = {p: {}, c: {}, cust: {}};
  (d.posts || []).forEach(function(p){
    var ids = {};
    (p.comments || []).forEach(function(c){ if(c.id) ids[c.id] = 1; });
    out.p[p.id] = ids;
  });
  (d.customers || []).forEach(function(c){
    var ids = {};
    (c.comments || []).forEach(function(x){ if(x.id) ids[x.id] = 1; });
    out.c[c.id] = ids;
    out.cust[c.id] = c;
  });
  SYNC_SEED = out;
  return out;
}
/* 이 기기에서 실제로 손댄 고객인가 — 시드에 없는 명단이거나, 메모·킵·예약·직원 댓글이 붙은 건 */
function syncCustTouched(c){
  if(!c) return false;
  if(c.keep || c.resDate || c.resTime) return true;
  if(String(c.memo || '').trim()) return true;
  var idx = syncSeedIndex();
  var known = idx.c[c.id];
  if(!known) return true;                     /* 시드에 없음 = 새로 넣었거나 과거 명단에서 고친 건 */
  var cs = c.comments || [];
  for(var i = 0; i < cs.length; i++){
    if(!cs[i] || !cs[i].id) continue;
    if(cs[i].sys && cs[i].author === '장부 연동') continue;
    if(!known[cs[i].id]) return true;
  }
  return false;
}

/* ---------- 기준 올리기(baseline) ---------- */
/* v8.8까지는 기기마다 따로 저장돼서, 이미 눌러 둔 완료·부재·메모가 서버에 없습니다.
   실시간 공유가 처음 켜질 때 '시드와 달라진 칸'만 한 번 올려 전 직원 폰을 같은 상태로 맞춥니다. */
function syncBaseline(){
  sync.dirty = true;
  if(sync.baseSent || !state) return;
  sync.baseSent = true;
  try{ if(localStorage.getItem(SYNC_BASE_KEY) === '1') return; }catch(e){}
  var idx = syncSeedIndex(), n = 0;
  (state.customers || []).forEach(function(c){
    if(!syncCustTouched(c)) return;
    var rec = syncRec('c:' + c.id), f = syncCustFields(c), s = idx.cust[c.id];
    for(var k in f){
      if(!f.hasOwnProperty(k)) continue;
      var sv = s ? (k === 'keep' ? !!s.keep : (k === 'tries' ? (+s.tries || 0) : (s[k] == null ? '' : s[k]))) : null;
      if(s && sv === f[k]) continue;        /* 시드와 같은 값은 올리지 않는다 */
      delete rec.f[k];
    }
    var known = idx.c[c.id] || {};
    (c.comments || []).forEach(function(cm){
      if(cm.id && !known[cm.id] && !(cm.sys && cm.author === '장부 연동')) delete rec.cm[cm.id];
    });
    n++;
  });
  (state.posts || []).forEach(function(p){
    var rec = syncRec('p:' + p.id), known = idx.p[p.id];
    if(!known){                             /* 이 기기에서 새로 쓴 글 */
      var f = syncPostFields(p);
      for(var k in f){ if(f.hasOwnProperty(k)) delete rec.f[k]; }
      (p.comments || []).forEach(function(cm){ if(cm.id) delete rec.cm[cm.id]; });
      rec.rv = null;
      n++;
      return;
    }
    (p.comments || []).forEach(function(cm){ if(cm.id && !known[cm.id]) delete rec.cm[cm.id]; });
  });
  try{ localStorage.setItem(SYNC_BASE_KEY, '1'); }catch(e){}
  if(n) syncFlush(80);
}

/* ---------- 이 기기 상태 → 보낼 변경분 ---------- */
function syncScan(){
  if(!session || !state || sync.applying) return [];
  var items = [], now = syncNow();
  (state.customers || []).forEach(function(c){
    var rec = syncRec('c:' + c.id), f = syncCustFields(c), ch = null, k;
    for(k in f){
      if(!f.hasOwnProperty(k)) continue;
      var prev = rec.f[k];
      if(prev && prev.v === f[k]) continue;
      ch = ch || {};
      ch[k] = f[k];
    }
    var cm = syncNewCmts(c.comments, rec);
    if(ch || cm.length) items.push({t: 'c', id: c.id, f: ch || {}, cm: cm, u: now});
  });
  (state.posts || []).forEach(function(p){
    var rec = syncRec('p:' + p.id), f = syncPostFields(p), ch = null, k;
    for(k in f){
      if(!f.hasOwnProperty(k)) continue;
      var prev = rec.f[k];
      if(prev && prev.v === f[k]) continue;
      ch = ch || {};
      ch[k] = f[k];
    }
    var cm = syncNewCmts(p.comments, rec);
    var rv = syncRvKey(p.reservations);
    var rvChanged = (rec.rv !== rv);
    if(ch || cm.length || rvChanged){
      var it = {t: 'p', id: p.id, f: ch || {}, cm: cm, u: now};
      if(rvChanged) it.rv = JSON.parse(rv);
      items.push(it);
    }
  });
  /* v8.12: 삭제 표시 — 이 기기에서 지운 고객은 f.deleted 로 한 번 올려 전 직원 폰에서도 사라지게 */
  for(var did in (state.delCust || {})){
    if(!state.delCust.hasOwnProperty(did)) continue;
    var drec = syncRec('c:' + did);
    if(drec.f.deleted && drec.f.deleted.v === true) continue;
    var dt = state.delCust[did] || {};
    items.push({t: 'c', id: did, f: {deleted: true}, u: +dt.at || now});
  }
  /* v8.18: 지운 글도 같은 방식으로 f.deleted 를 한 번 올려 전 직원 폰의 홈 피드에서 함께 사라지게 */
  for(var pid2 in (state.delPost || {})){
    if(!state.delPost.hasOwnProperty(pid2)) continue;
    var prec = syncRec('p:' + pid2);
    if(prec.f.deleted && prec.f.deleted.v === true) continue;
    var pt = state.delPost[pid2] || {};
    if(pt.sent) continue;                 /* 이미 서버에 올린 삭제 표시 — 앱을 다시 열 때마다 되풀이해 올리지 않는다 */
    items.push({t: 'p', id: pid2, f: {deleted: true}, u: +pt.at || now});
  }
  return items;
}
function syncMarkSent(items, at){
  items.forEach(function(it){
    var rec = syncRec((it.t === 'c' ? 'c:' : 'p:') + it.id);
    for(var k in (it.f || {})){
      if(it.f.hasOwnProperty(k)) rec.f[k] = {v: it.f[k], u: at || syncNow()};
    }
    (it.cm || []).forEach(function(c){ if(c && c.id) rec.cm[c.id] = {fp: c.fp, u: at || syncNow()}; });
    if(it.rv) rec.rv = syncRvKey(it.rv);
    rec.u = at || syncNow();
    /* v8.18: 서버에 올라간 글 삭제 표시는 '올림'을 남겨 다시 올리지 않는다 */
    if(it.t === 'p' && it.f && it.f.deleted === true && state && state.delPost && state.delPost[it.id]){
      state.delPost[it.id].sent = 1;
      if(typeof saveQuiet === 'function') saveQuiet();
    }
  });
}

/* ---------- 주고받기 ---------- */
function syncPostJson(payload){
  return new Promise(function(resolve, reject){
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var tm = setTimeout(function(){ if(ctrl){ try{ ctrl.abort(); }catch(e){} } }, SYNC_TMO);
    var opt = {method: 'POST', cache: 'no-store', redirect: 'follow',
               headers: {'Content-Type': 'text/plain;charset=utf-8'},
               body: JSON.stringify(payload)};
    if(ctrl) opt.signal = ctrl.signal;
    fetch(syncBase(), opt).then(function(res){ return res.text(); }).then(function(text){
      clearTimeout(tm);
      var d = null;
      try{ d = JSON.parse(text); }catch(e){ d = null; }
      if(d) resolve(d); else reject(new Error('응답을 읽지 못했어요'));
    }).catch(function(e){ clearTimeout(tm); reject(e); });
  });
}
function syncIsUnknown(msg){
  return /지원하지\s*않는|unknown_action|band_get|band_push/i.test(String(msg || ''));
}
function syncWait(){
  if(sync.mode === 'live') toast('실시간 공유가 잠시 멈췄어요 — 서버가 준비되면 다시 켜집니다');
  sync.mode = 'wait';
  sync.lastErr = '';
  syncFails(0);
  syncChip();
}
function syncFails(n){
  sync.fails = n;
  syncChip();
}
function syncFail(msg){
  sync.lastErr = msg || '연결 실패';
  sync.fails = (sync.fails || 0) + 1;
  if(sync.fails > 6){
    sync.mode = 'wait';                 /* 계속 실패하면 조용히 쉬었다가 다시 */
    sync.lastErr = '';
  }
  syncChip();
}
function syncLive(d){
  var was = sync.mode;
  sync.mode = 'live';
  sync.lastErr = '';
  sync.fails = 0;
  if(+d.now) sync.skew = (+d.now) - Date.now();
  syncChip();
  if(was !== 'live'){
    try{ console.log('[sync] 실시간 공유 ON'); }catch(e){}
    if(was !== 'off' && was !== 'wait') toast('전 직원 실시간 공유가 켜졌어요');
    syncBaseline();
    syncFlush(250);
    syncLoop();          /* 대기(30초) 주기로 잡혀 있던 타이머를 실시간(6.5초)으로 */
  }
}
function syncPull(full){
  if(!session || sync.pullBusy) return Promise.resolve(0);
  sync.pullBusy = true;
  var since = full ? 0 : sync.since;
  var url = syncBase() + '&action=band_get&since=' + since + '&t=' + Date.now();
  return ledgerFetchJson(url).then(function(d){
    sync.pullBusy = false;
    if(!d || d.ok !== true){
      var msg = (d && (d.error || d.message)) || '연결 실패';
      if(syncIsUnknown(msg)) syncWait(); else syncFail(msg);
      return 0;
    }
    syncLive(d);
    if(+d.now) sync.since = +d.now;
    try{ localStorage.setItem(SYNC_SINCE_KEY, String(sync.since)); }catch(e){}
    sync.lastAt = Date.now();
    var items = Array.isArray(d.items) ? d.items : [];
    var n = items.length ? syncApply(items) : 0;
    if(n) syncChip();
    return n;
  }, function(e){
    sync.pullBusy = false;
    syncFail((e && e.message) || '연결 실패');
    return 0;
  });
}
function syncPush(force){

  if(!sync.dirty && !force) return;      /* 바뀐 게 없으면 전체 훑지 않는다 */
  var items = syncScan();
  if(!items.length) return;
  var chunks = [], cur = [], size = 0;
  items.forEach(function(it){
    var s = 0;
    try{ s = JSON.stringify(it).length; }catch(e){ s = 200; }
    if(cur.length && (cur.length >= SYNC_CHUNK || size + s > SYNC_CHUNK_BYTES)){ chunks.push(cur); cur = []; size = 0; }
    cur.push(it); size += s;
  });
  if(cur.length) chunks.push(cur);
  sync.pushBusy = true;
  var chain = Promise.resolve();
  chunks.forEach(function(ch){
    chain = chain.then(function(){
      return syncPostJson({pin: LEDGER_PIN, action: 'band_push', staff: (session && session.staff) || '', items: ch})
        .then(function(d){
          if(!d || d.ok !== true){
            var msg = (d && (d.error || d.message)) || '저장 실패';
            if(syncIsUnknown(msg)){ syncWait(); return; }
            throw new Error(msg);
          }
          var at = +d.now ? (+d.now - sync.skew) : syncNow();
          if(+d.now) sync.skew = (+d.now) - Date.now();
          syncMarkSent(ch, at);
          sync.lastAt = Date.now();
          sync.fails = 0;
        });
    });
  });
  chain.then(function(){
    sync.pushBusy = false;
    sync.dirty = false;
    syncChip();
  }, function(e){
    sync.pushBusy = false;
    syncFail((e && e.message) || '저장 실패');
  });
}
function syncFlush(delay){
  clearTimeout(sync.pushT);
  sync.pushT = setTimeout(syncPush, delay == null ? SYNC_PUSH_WAIT : delay);
}
/* 저장(save) 뒤에 부른다 — 바뀐 칸이 있으면 묶어서 곧바로 올린다 */
function syncChanged(){
  if(!session || !state || sync.applying || !sync.primed) return;
  sync.dirty = true;
  if(sync.mode !== 'live') return;   /* 서버 준비 전에 바꾼 것도 켜질 때 함께 올라간다 */
  syncFlush();
}

/* ---------- 받은 변경을 화면에 반영 ---------- */
function syncSetCustField(c, k, v){
  var cur = c[k];
  if(k === 'keep' || k === 'tries' || k === 'status' || k === 'owner' ||
     k === 'memo' || k === 'day' || k === 'name' || k === 'phone' || k === 'bucket' ||
     k === 'resDate' || k === 'resTime'){
    if(cur === v) return false;
    c[k] = v;
    return true;
  }
  return false;
}
function syncMergeCmts(arr, list, rec){
  if(!list || !list.length) return 0;
  var n = 0;
  list.forEach(function(rc){
    if(!rc || !rc.id) return;
    var cur = null;
    for(var i = 0; i < arr.length; i++){ if(arr[i] && arr[i].id === rc.id){ cur = arr[i]; break; } }
    var lr = rec.cm[rc.id];
    if(lr && lr.u && rc.u && (+rc.u) < (+lr.u)) return;      /* 내가 더 최근에 고친 댓글 */
    if(!cur){ cur = {id: rc.id, photos: [], replies: []}; arr.push(cur); }
    ['author', 'at', 'text', 'st', 'stBy', 'stAt', 'resDate', 'resTime', 'memo', 'sys'].forEach(function(k){
      if(rc[k] !== undefined && rc[k] !== null) cur[k] = rc[k];
    });
    if(rc.photos && rc.photos.length) cur.photos = rc.photos;
    if(rc.replies && rc.replies.length) cur.replies = rc.replies;
    cur.photos = cur.photos || [];
    cur.replies = cur.replies || [];
    rec.cm[rc.id] = {fp: syncCmtFp(cur), u: +rc.u || 0};
    n++;
  });
  return n;
}
function syncApplyCust(it){
  var rec = syncRec('c:' + it.id);
  /* v8.12: 삭제 표시 — 다른 직원이 지운 고객은 이 폰에서도 명단에서 빼고, 다시 살아나지 않게 표시를 남긴다 */
  if(it.f && it.f.deleted === true){
    var du = +it.u || 0, pd = rec.f.deleted;
    if(pd && (+pd.u || 0) > du) return 0;
    rec.f.deleted = {v: true, u: du};
    if(isCustDeleted(it.id)) return 0;
    var knownDel = findCust(it.id);
    custTombstone(it.id, du || Date.now(), it.st || '', knownDel ? (knownDel.name || '') : '');
    return 1;
  }
  if(isCustDeleted(it.id)) return 0;   /* 이미 지운 고객 — 늦게 도착한 다른 칸 변경은 무시 */
  var c = null, i, created = false;
  for(i = 0; i < state.customers.length; i++){ if(state.customers[i].id === it.id){ c = state.customers[i]; break; } }
  if(!c){
    if(findCust(it.id)) c = ensureCust(it.id);     /* 과거 명단에서 꺼내 고친 건 */
    else if(it.f && it.f.name && it.f.day){
      c = {id: it.id, day: it.f.day, name: it.f.name, phone: it.f.phone || '', bucket: it.f.bucket || '730',
           owner: it.f.owner || '', status: it.f.status || '미통화', memo: it.f.memo || '',
           resDate: it.f.resDate || '', resTime: it.f.resTime || '', keep: !!it.f.keep,
           tries: +it.f.tries || 0, comments: []};
      state.customers.push(c);
      custIdxDirty();
      created = true;
    }
    if(!c) return 0;
  }
  var n = created ? 1 : 0, u = +it.u || 0, f = it.f || {}, k;
  for(k in f){
    if(!f.hasOwnProperty(k)) continue;
    var prev = rec.f[k];
    if(prev && prev.u && u && u < prev.u) continue;
    if(syncSetCustField(c, k, f[k])) n++;
    rec.f[k] = {v: f[k], u: u};
  }
  c.comments = c.comments || [];

  if(n){ custIdxDirty(); }
  return n;
}
function syncApplyPost(it){
  var rec = syncRec('p:' + it.id);
  /* v8.18: 삭제 표시 — 다른 직원이 지운 글은 이 폰에서도 피드에서 빼고, 다시 살아나지 않게 표시를 남긴다 */
  if(it.f && it.f.deleted === true){
    var du = +it.u || 0, pd = rec.f.deleted;
    if(pd && (+pd.u || 0) > du) return 0;

    var knownDel = findPost(it.id);

    if(state.delPost && state.delPost[it.id]) state.delPost[it.id].sent = 1;   /* 이미 서버에 있는 삭제 표시 */
    return 1;
  }
  if(isPostDeleted(it.id)) return 0;   /* 이미 지운 글 — 늦게 도착한 다른 칸 변경은 무시 */

  if(!p){
    var f0 = it.f || {};
    if(!f0.author && !f0.at) return 0;
    p = {id: it.id, kind: f0.kind || 'store', pinned: !!f0.pinned, isNotice: f0.isNotice !== false,
         title: f0.title || '', body: f0.body || '', author: f0.author || '', at: f0.at || nowAt(),
         done: !!f0.done, reserve: !!f0.reserve, bandPostId: +f0.bandPostId || 0, bandUrl: f0.bandUrl || '',
         photos: [], comments: [], reservations: []};
    state.posts.push(p);

  }
  var n = created ? 1 : 0, u = +it.u || 0, f = it.f || {}, k;
  for(k in f){
    if(!f.hasOwnProperty(k)) continue;
    var prev = rec.f[k];
    if(prev && prev.u && u && u < prev.u) continue;
    if(p[k] !== f[k]){ p[k] = f[k]; n++; }
    rec.f[k] = {v: f[k], u: u};
  }
  p.comments = p.comments || [];
  n += syncMergeCmts(p.comments, it.cm, rec);
  if(it.rv && syncRvKey(p.reservations) !== syncRvKey(it.rv)){
    p.reservations = it.rv.slice();
    n++;
  }
  if(it.rv) rec.rv = syncRvKey(it.rv);
  rec.u = Math.max(rec.u || 0, u);
  return n;
}
function syncItemKind(it){
  var t = String((it && it.t) || '');
  if(t === 'c' || t === 'cust') return 'c';
  if(t === 'p' || t === 'post') return 'p';
  return '';
}
function syncApplyItem(it){
  if(!it || !it.id) return 0;
  var k = syncItemKind(it);
  if(k === 'c') return syncApplyCust(it);
  if(k === 'p') return syncApplyPost(it);
  return 0;
}
function syncNoteOf(it){
  var who = it.st || '';
  if(syncItemKind(it) === 'c'){
    if(it.f && it.f.deleted === true){
      var dd = state && state.delCust && state.delCust[it.id];
      return (who ? who + ' · ' : '') + ((dd && dd.name) || '고객') + ' 삭제';
    }
    var c = findCust(it.id);
    var nm = (it.f && it.f.name) || (c && c.name) || '고객';
    var st = it.f && it.f.status;
    if(st) return (who ? who + ' · ' : '') + nm + ' ' + stLabel(st);
    if(it.f && it.f.memo !== undefined) return (who ? who + ' · ' : '') + nm + ' 메모';
    if(it.f && it.f.resDate !== undefined) return (who ? who + ' · ' : '') + nm + ' 예약';
    return '';
  }
  var p = findPost(it.id);
  var ttl = (it.f && it.f.title) || (p && p.title) || '';
  if(it.f && it.f.deleted === true){
    var dp = state && state.delPost && state.delPost[it.id];
    return (who ? who + ' · ' : '') + ((dp && dp.title) || ttl || '글') + ' 삭제';
  }
  if(it.cm && it.cm.length){ var a = it.cm[it.cm.length - 1]; return (a.author || who) + ' · 댓글' + (ttl ? ' · ' + shortText(ttl, 18) : ''); }
  if(it.f && it.f.body !== undefined && !p) return (who ? who + ' · ' : '') + '새 글';
  return '';
}
function syncApply(items){
  var changed = 0, notes = [];
  sync.applying = true;
  items.forEach(function(it){
    try{
      var n = syncApplyItem(it);
      if(n > 0){
        changed += n;
        var mine = (it.st && session && it.st === session.staff);
        if(!mine){ var t = syncNoteOf(it); if(t) notes.push(t); }
      }
    }catch(e){ try{ console.warn('[sync] 적용 실패', it && it.id, (e && e.message) || e); }catch(e2){} }
  });
  sync.applying = false;
  if(changed){
    syncAfterApply();
    if(notes.length){
      var uniq = [];
      notes.forEach(function(t){ if(uniq.indexOf(t) < 0) uniq.push(t); });
      var head = uniq.slice(0, 2).join(' · ');
      var rest = uniq.length - Math.min(2, uniq.length);
      toast((rest > 0 ? head + ' 외 ' + rest + '건' : head) + ' 반영');
    }
  }
  return changed;
}
/* 화면을 다시 그린다 — 입력 중이면 손대지 않고, 시트가 열려 있으면 그 시트만 갱신 */

  }

  }

/* ---------- 시작 · 멈춤 · 주기 ---------- */
function syncStart(){
  if(!session || !state) return;
  if(!sync.primed) syncPrime();
  if(sync.started){ syncWake(); return; }
  sync.started = true;
  sync.mode = 'wait';
  try{ sync.since = parseInt(localStorage.getItem(SYNC_SINCE_KEY) || '0', 10) || 0; }catch(e){ sync.since = 0; }
  sync.chipEl = $('liveChip');
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && session) syncWake();
  });
  window.addEventListener('focus', function(){ if(session) syncWake(); });
  window.addEventListener('online', function(){ if(session) syncWake(); });
  syncPull(sync.since ? false : true);
  syncLoop();
}
function syncWake(){
  if(!session) return;
  if(!sync.primed) syncPrime();
  syncPull(sync.since ? false : true);
  syncPush(true);
}
function syncLoop(){
  clearTimeout(sync.loopT);
  var wait = (sync.mode === 'live' && !sync.lastErr) ? SYNC_INT : SYNC_IDLE_INT;
  sync.loopT = setTimeout(function(){
    if(!session){ syncLoop(); return; }
    if(document.hidden){ syncLoop(); return; }
    if(sync.mode === 'live'){ syncPull(false); syncPush(); }
    else syncPull(sync.since ? false : true);
    syncLoop();
  }, wait);
}
function syncStop(){
  clearTimeout(sync.loopT);
  clearTimeout(sync.pushT);
  sync.loopT = null;
  sync.started = false;
  sync.mode = 'off';
  sync.primed = false;
  sync.map = {};
  sync.since = 0;
  syncChip();
}
/* 기준값 — 지금 화면 상태를 '이미 아는 값'으로 채워 두고, 이후 바뀐 칸만 올린다 */
function syncPrime(){
  if(!state) return;
  sync.map = {};
  (state.customers || []).forEach(function(c){
    var r = syncRec('c:' + c.id), f = syncCustFields(c), k;
    for(k in f){ if(f.hasOwnProperty(k)) r.f[k] = {v: f[k], u: 0}; }
    (c.comments || []).forEach(function(cm){ if(cm && cm.id) r.cm[cm.id] = {fp: syncCmtFp(cm), u: 0}; });
  });
  (state.posts || []).forEach(function(p){
    var r = syncRec('p:' + p.id), f = syncPostFields(p), k;
    for(k in f){ if(f.hasOwnProperty(k)) r.f[k] = {v: f[k], u: 0}; }
    (p.comments || []).forEach(function(cm){ if(cm && cm.id) r.cm[cm.id] = {fp: syncCmtFp(cm), u: 0}; });
    r.rv = syncRvKey(p.reservations);
  });
  sync.primed = true;
}
/* 메뉴의 '지금 동기화' */
function syncNowPush(){
  if(!session){ toast('로그인하면 실시간 공유가 켜져요'); return; }
  toast('전 직원 변경을 확인하는 중…');
  syncPull(sync.since ? false : true).then(function(n){
    syncPush();
    if(!n) toast(sync.mode === 'live' ? '최신 상태예요 · 전 직원 실시간 공유 중' : '서버 준비 중이에요');
  });
}

function postMatch(p){
  if(ui.filter==='all') return true;
  if(ui.filter==='noticeall') return !!p.isNotice;          /* 📢 전체 공지 목록 */
  if(ui.filter==='notice') return kindOf(p)==='notice';      /* 매장 공지 */
  if(ui.filter==='consult') return kindOf(p)==='consult';    /* 상담(옛 상담건) */
  if(ui.filter==='reserve') return !!p.reserve;              /* 사전예약 */

function byAtDesc(a,b){ return String(b.at||'').localeCompare(String(a.at||'')); }
/* v8.4(#17762): 매일 자동 업로드되는 730·550·3년 표 글 — 명단 탭에 이미 있으니 홈 피드에서는 감춥니다.
   판별: 메모 글 + 본문 첫머리가 730/550/3년/1095 + (본문이 그 조합뿐이거나 표 사진이 붙은 날짜별 업로드) */
function isTablePost(p){
  if(!p || p.kind!=='memo') return false;
  var b = String(p.body||'').trim();
  if(!/^(730|550|3년|1095)(\s|$)/.test(b)) return false;
  if(/^(730|550|3년|1095)([\s,·\/+-]*(730|550|3년|1095))*[\s,·\/+-]*$/.test(b)) return true;
  return !!(p.photos && p.photos.length) && !p.title;
}

var KIND_META = {

  store:{label:'매장 공지', short:'공지'},
  notice:{label:'매장 공지', short:'공지'},

                 : (ui.filter==='consult'? '상담 글이 아직 없어요.' : (ui.filter==='reserve'? '사전예약 글이 아직 없어요.' : '매장 공지가 아직 없어요.'));
    h += '<div class="feed">' + (feed.length? feed.map(function(p){ return postCard(p); }).join('')
       : '<div class="emptycard">'+emptyTxt+'</div>');

       + (ui.feedAll? '접기 ▴' : '글 '+feedMoreN+'건 더 보기 ▾') + '</button>';

}

    curMemo = c.memo || '';
  } else if(target==='cmt'){
    var p = findPost(sp.pid), cm = null;
    (p && p.comments || []).forEach(function(x){ if(x.id===sp.cid) cm = x; });
    if(!cm) return '';
    cur = cm; who = (cm.author||'댓글') + ' · 글 댓글';
    if(cm.st==='예약' && cm.resDate) curText = '지금 예약 : ' + resvText(cm);

    if(cur.resDate) curText = '고른 예약 : ' + resvText(cur);

  var d = (cur && cur.resDate) || todayStr();
  var tm = (cur && cur.resTime) || '';
  function addDay(n){
    var t = new Date(); t.setDate(t.getDate()+n);

  }
  var quick = [['오늘',0],['내일',1],['모레',2],['3일 뒤',3],['1주 뒤',7]];
  var h = '<form class="form resvform" data-form="resvdate" data-target="'+esc(target)+'"'

        + (curText? '<p class="rf-cur">'+esc(curText)+'</p>' : '')

        + '<p class="rf-when" id="resvWhen">'+esc(fmtResvWhen(d, tm))+'</p>'

        + '<label><span>예약 메모 (선택)</span>'

/* v8.17: 고른 예약 날짜를 한국어로 한 줄 — '2026년 11월 28일 (토) · 오후 2:00'.
   폰 브라우저에 따라 달력 칸이 11/28/2026 처럼 보여도 어느 날인지 바로 알 수 있다. */
function fmtResvWhen(ds, ts){
  ds = String(ds||'');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return '날짜를 골라 주세요';
  var dt = new Date(ds+'T00:00:00');
  var w = '일월화수목금토'[dt.getDay()];
  var s = ds.slice(0,4)+'년 '+(+ds.slice(5,7))+'월 '+(+ds.slice(8,10))+'일 ('+w+')';
  var tl = resvTimeLabel(ts);
  return s + (tl? ' · '+tl : ' · 시간 없음');
}
function updateResvWhen(){
  var el = $('resvWhen');
  if(!el) return;
  var d = $('resvDate'), t = $('resvTime');
  el.textContent = fmtResvWhen(d? d.value : '', t? t.value : '');
}

/* v6: 홈 피드 카드 — 기본은 제목·본문·'댓글 N개 보기'만, 누를 때만 댓글이 열립니다 */
function postCard(p, opts){
  opts = opts||{};
  var cs = p.comments||[];
  var open = !!opts.sheet || !!ui.openThreads[p.id];
  var kk = kindOf(p);
  var h = '<article class="post k-'+kk+(open?' thread-open':'')+'" data-pid="'+p.id+'">';
  h += '<div class="post-head">'
     +   '<span class="av" style="--c:'+colorOf(p.author)+'">'+esc(initial(p.author))+'</span>'
     +   '<div class="who"><div class="wname">'+esc(p.author)+'</div>'
     +     '<div class="wmeta">'+fmtAt(p.at)+'</div></div>'
     +   '<span class="kbadge kb-'+kk+'">'+KIND_META[kk].label+'</span>'
     +   (p.pinned? '<span class="pinbadge">📌 고정</span>' : '')   /* v8.13: 전체 피드에서도 고정 글임을 표시 */
     +   '<button class="morebtn" data-act="post-menu" data-id="'+p.id+'" aria-label="글 관리">⋯</button>'
     + '</div>';
  if(p.title) h += '<h3 class="post-title">'+esc(p.title)+'</h3>';
  if(p.body) h += '<p class="post-body">'+esc(p.body)+'</p>';
  h += photoGrid(p.photos);
  if(p.reserve) h += reserveBlock(p);
  if(!open && !opts.sheet && cs.length) h += cmtPreview(cs, p.id);
  h += '<div class="post-actions">'
     +   (opts.sheet
            ? '<span class="act cmt-act static">💬 댓글 <b class="cnt">'+cs.length+'</b></span>'
            : (open || cs.length
                ? '<button class="act cmt-act'+(open?' on':'')+'" data-act="thread-toggle" data-id="'+p.id+'" aria-expanded="'+(open?'true':'false')+'">'
                  +     (open? '💬 댓글 접기 <span class="chev">▴</span>'
                           : '💬 댓글 <b class="cnt">'+cs.length+'</b>개 모두 보기 <span class="chev">▾</span>')
                  +   '</button>'
                : ''))   /* v8.13: 댓글이 없으면 아래 바로 쓰는 입력칸이 그 자리를 대신한다 */
     +   (isAdmin()? '<button class="act post-del" data-act="post-del" data-id="'+p.id+'" aria-label="'+esc(shortText(p.title||p.body||'글',20))+' 삭제">🗑️ 삭제</button>' : '')
     +   postStatHTML(p)
     + '</div>';
  /* v8.13: 접힌 카드에서도 '댓글 모두 보기'를 누르기 전에 바로 댓글·사진을 남길 수 있게 한다.
     펼친 카드(threadHTML)와 같은 입력 키를 써서 한 상태에서는 입력칸이 하나만 보인다. */
  if(!opts.sheet && !open) h += quickCmtHTML(p);
  h += threadHTML(p, 'post', open);
  h += '</article>';
  return h;
}

/* v8.10: 글 카드·글 시트 하단 — 이 글 안 1단계 댓글의 통화 상태 집계와 사전예약 진척도.
   상태가 바뀔 때마다 render()가 다시 그려서 자동으로 최신 숫자가 된다. */
function postStatHTML(p){
  var cnt = {'미통화':0,'부재':0,'예약':0,'완료':0,'개통완료':0};
  (p.comments||[]).forEach(function(c){
    if(c.sys) return;
    var s = c.st || '미통화';
    if(cnt[s] === undefined) return;
    cnt[s]++;
  });
  var chips = '';
  ['미통화','부재','예약','완료','개통완료'].forEach(function(s){
    if(!cnt[s]) return;
    chips += '<span class="pst" data-st="'+s+'">'+esc(stLabel(s))+' <b>'+cnt[s]+'</b></span>';
  });
  /* 사전예약 공지 — 확정건 명단의 예약/개통 진척 = 앞에 (v8.20: '예약자' → '확정건') */
  if(p.reservations && p.reservations.length){
    var dn = p.reservations.filter(function(r){ return r.done; }).length;
    var pend = p.reservations.length - dn;
    chips = (pend? '<span class="pst" data-st="예약">확정건 <b>'+pend+'</b></span>' : '')
          + (dn? '<span class="pst" data-st="개통완료">개통 <b>'+dn+'</b></span>' : '')
          + chips;
  }
  return chips? '<span class="pstat">'+chips+'</span>' : '';
}
/* 댓글 상태를 바꿀 때(전체 render 없이) 그 글의 요약만 다시 그린다 */
function refreshPostStat(pid){
  var p = findPost(pid);
  if(!p) return;
  var html = postStatHTML(p);
  var cards = document.querySelectorAll('article.post[data-pid="'+pid+'"]');
  for(var i=0;i<cards.length;i++){
    var act = cards[i].querySelector('.post-actions');
    if(!act) continue;
    var cur = act.querySelector('.pstat');
    if(!html){ if(cur) cur.parentNode.removeChild(cur); continue; }
    if(cur) cur.outerHTML = html;
    else act.insertAdjacentHTML('beforeend', html);
  }
}

function photoGrid(ps, size){
  if(!ps || !ps.length) return '';
  var cls = ps.length===1?'one':(ps.length===2?'two':'');
  var out = '<div class="pgrid '+(size||'')+' '+cls+'">';
  for(var i=0;i<ps.length;i++){
    var src = ps[i].src || '';
    var th = thumbURL(src);       /* v8.12: 목록은 축소본, 크게 보기는 원본 */
    out += '<button class="pcell" data-act="photo" aria-label="사진 크게 보기">'
         + '<img src="'+esc(th||src)+'" data-full="'+esc(src)+'"'+(th?' data-thumb="1"':'')
         + ' alt="'+esc(ps[i].name||'첨부 사진')+'" loading="lazy" decoding="async">'
         + '</button>';
  }
  return out+'</div>';
}

/* v8.2: 접힌 카드에는 맨 위 댓글 1개만 미리 보여준다 (밴드와 같은 방식)
   v8.19(#20470): 미리보기(글자·사진)를 누르면 그 글의 댓글 창이 바로 열린다.
   → 댓글 창 안에서 사진을 누르면 크게 보기(lightbox)는 그대로 쓸 수 있다. */
function cmtPreview(cs, pid){
  var c = cs[0];
  if(!c) return '';
  var h = '<div class="cmt-preview" data-act="preview-open" data-id="'+esc(pid)+'" data-cid="'+esc(c.id||'')+'"'
        + ' role="button" tabindex="0" aria-label="댓글 '+cs.length+'개 — 댓글 창 열기">'
        + '<div class="cp-head"><span class="av xs" style="--c:'+colorOf(c.author)+'">'+esc(initial(c.author))+'</span>'

/* v8.19: 댓글 창을 열 때 그 댓글까지 스크롤 + 잠깐 강조
   (예약 고객 목록의 '상담 댓글'·부재 목록의 '상담 댓글'·피드 미리보기에서 들어올 때) */
function cmtElOf(pid, cid){
  if(!pid || !cid) return null;
  var q = 'article.post[data-pid="'+pid+'"] li.cmt[data-cid="'+cid+'"]';
  var scopes = [$('sheetBody'), document.querySelector('.feed'), document];
  for(var i=0;i<scopes.length;i++){
    if(!scopes[i] || !scopes[i].querySelector) continue;
    var el = scopes[i].querySelector(q);
    if(el) return el;
  }
  return null;
}
function flashCmt(el){
  if(!el) return;
  el.classList.remove('cmt-flash');
  void el.offsetWidth;        /* 같은 댓글을 다시 눌러도 강조가 처음부터 보이게 */
  el.classList.add('cmt-flash');
  clearTimeout(flashCmt._t);
  flashCmt._t = setTimeout(function(){ el.classList.remove('cmt-flash'); }, 2600);
}
function scrollToCmt(pid, cid){
  if(!pid || !cid) return;
  var n = 0;
  function go(){
    var el = cmtElOf(pid, cid);
    if(!el) return;
    var r = el.getBoundingClientRect();
    var off = Math.abs((r.top + r.height/2) - (window.innerHeight/2));
    if(n===0 || off > 120){    /* 사진이 늦게 로딩돼 위치가 밀리면 한 번 더 맞춘다 */
      try{ el.scrollIntoView({behavior: n===0? 'smooth' : 'auto', block:'center'}); }
      catch(e){ el.scrollIntoView(); }
    }
    flashCmt(el);
    n++;
    if(n < 3) setTimeout(go, n===1? 600 : 700);
  }
  setTimeout(go, 80);
}
